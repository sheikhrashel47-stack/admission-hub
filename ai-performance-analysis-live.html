<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071d1a">
  <title>AI Performance Analysis | Admission Hub</title>
  <style>
    :root {
      --ink: #09201d;
      --ink-2: #173733;
      --muted: #78918b;
      --paper: #f5f8f4;
      --card: #ffffff;
      --line: #dfe9e3;
      --mint: #c8f5df;
      --mint-2: #8fe6bd;
      --green: #1d956b;
      --green-dark: #0c6b51;
      --orange: #f4aa62;
      --red: #e66e63;
      --blue: #7aa7ef;
      --violet: #a48be2;
      --shadow: 0 22px 55px rgba(12, 47, 38, .10), 0 2px 8px rgba(12, 47, 38, .04);
      --shadow-deep: 0 30px 75px rgba(5, 30, 26, .25);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 15px;
      --ease: cubic-bezier(.2, .75, .25, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, "Noto Sans Bengali", "Hind Siliguri", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(39, 167, 119, .45);
      outline-offset: 3px;
    }
    .app-shell { min-height: 100vh; overflow: hidden; }
    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1440px;
      margin: auto;
      padding: 0 38px;
    }
    .brand-lockup, .top-actions, .meta-row, .pill, .section-kicker, .saved-state,
    .chart-legend, .inline-action, .question-meta, .tag, .vocab-header, .demo-control {
      display: flex;
      align-items: center;
    }
    .brand-lockup { gap: 13px; min-width: 0; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: var(--ink); color: var(--mint); font-weight: 800; letter-spacing: -.08em;
      box-shadow: 0 8px 18px rgba(9, 32, 29, .16);
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong { display: block; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
    .brand-copy span { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; }
    .top-actions { gap: 10px; }
    .icon-button {
      width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; background: var(--card);
      color: var(--ink); display: grid; place-items: center; transition: transform .2s var(--ease), border-color .2s, background .2s;
    }
    .icon-button:hover { transform: translateY(-2px); border-color: var(--mint-2); background: #f0fff7; }
    .saved-state { gap: 7px; color: var(--green-dark); font-size: 13px; font-weight: 700; }
    .saved-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(29,149,107,.11); }
    .page-wrap { max-width: 1440px; margin: auto; padding: 20px 38px 80px; }
    .hero {
      position: relative; isolation: isolate; overflow: hidden; display: grid; grid-template-columns: 1.3fr .7fr;
      min-height: 440px; padding: 55px 58px; border-radius: var(--radius-xl); color: #effff7;
      background: radial-gradient(circle at 86% 18%, rgba(121,231,182,.24), transparent 26%),
        radial-gradient(circle at 18% 110%, rgba(47,157,125,.24), transparent 37%),
        linear-gradient(126deg, #09221f 0%, #0b3029 58%, #105047 100%); box-shadow: var(--shadow-deep);
    }
    .hero::before, .hero::after { content: ""; position: absolute; border: 1px solid rgba(190, 255, 224, .14); border-radius: 50%; z-index: -1; }
    .hero::before { width: 560px; height: 560px; right: -168px; top: -238px; }
    .hero::after { width: 420px; height: 420px; right: -77px; top: -168px; }
    .hero-copy { max-width: 730px; align-self: center; }
    .eyebrow { display: inline-flex; gap: 8px; align-items: center; color: var(--mint-2); font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 26px; height: 1px; background: var(--mint-2); }
    h1, h2, h3, p { margin: 0; }
    .hero h1 { max-width: 690px; margin: 18px 0 17px; font-size: clamp(34px, 5vw, 68px); line-height: 1.08; letter-spacing: -.06em; font-weight: 800; }
    .hero h1 em { color: var(--mint-2); font-style: normal; }
    .hero-summary { max-width: 640px; color: rgba(239,255,247,.75); font-size: 17px; line-height: 1.85; }
    .meta-row { gap: 9px; flex-wrap: wrap; margin-top: 26px; }
    .pill { gap: 8px; padding: 8px 12px; border: 1px solid rgba(222,255,239,.16); border-radius: 99px; color: rgba(239,255,247,.82); background: rgba(255,255,255,.07); font-size: 12px; }
    .pill b { color: var(--mint-2); font-size: 13px; }
    .score-stage { display: grid; place-items: center; align-self: center; position: relative; }
    .score-ring { width: min(292px, 30vw); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative; background: conic-gradient(var(--mint-2) 0 77.5%, rgba(255,255,255,.12) 77.5% 100%); box-shadow: 0 0 0 1px rgba(212,255,235,.08), 0 20px 60px rgba(0,0,0,.20); }
    .score-ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #0c342d; box-shadow: inset 0 0 0 1px rgba(222,255,239,.08); }
    .score-ring::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 1px dashed rgba(200,245,223,.26); animation: spin 26s linear infinite; }
    .score-value { position: relative; z-index: 1; text-align: center; }
    .score-value strong { display: block; font-size: 62px; line-height: 1; letter-spacing: -.08em; }
    .score-value span { color: rgba(239,255,247,.65); font-size: 13px; }
    .ring-caption { position: absolute; bottom: -24px; right: 18px; color: var(--mint-2); font-size: 12px; font-weight: 700; }
    .workspace-nav { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 27px 0 20px; scrollbar-width: none; }
    .workspace-nav::-webkit-scrollbar { display: none; }
    .workspace-nav a { flex: 0 0 auto; text-decoration: none; color: var(--muted); padding: 10px 14px; border-radius: 99px; font-size: 13px; transition: color .2s, background .2s; }
    .workspace-nav a:hover, .workspace-nav a.active { color: var(--ink); background: #e3f4ea; }
    .section { scroll-margin-top: 20px; margin-top: 38px; }
    .section-kicker { gap: 12px; color: var(--green-dark); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .section-kicker i { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; color: var(--green-dark); background: var(--mint); font-style: normal; font-size: 11px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .section-head h2 { margin-top: 8px; font-size: clamp(25px, 3.4vw, 40px); line-height: 1.14; letter-spacing: -.055em; }
    .section-head p { max-width: 480px; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .grid { display: grid; gap: 17px; }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    .metric-card { min-height: 144px; padding: 22px; position: relative; overflow: hidden; }
    .metric-card::after { content: ""; position: absolute; width: 92px; height: 92px; right: -32px; bottom: -30px; border-radius: 50%; border: 12px solid #e9f7ef; }
    .metric-card small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
    .metric-card strong { display: block; margin-top: 14px; font-size: 34px; letter-spacing: -.06em; line-height: 1; }
    .metric-card .delta { display: inline-flex; margin-top: 11px; color: var(--green-dark); font-size: 12px; font-weight: 700; }
    .metric-card.warn .delta { color: #bc7435; }
    .chart-card { padding: 25px; min-height: 324px; }
    .chart-card.tall { min-height: 398px; }
    .card-title { display: flex; align-items: start; justify-content: space-between; gap: 16px; margin-bottom: 23px; }
    .card-title h3 { font-size: 17px; letter-spacing: -.025em; }
    .card-title p { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .chart-legend { gap: 12px; color: var(--muted); font-size: 11px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .chart-svg { width: 100%; height: 215px; overflow: visible; }
    .chart-svg text { fill: #8a9e97; font-family: inherit; font-size: 11px; }
    .chart-grid-line { stroke: #edf2ee; stroke-width: 1; }
    .chart-area { fill: url(#areaMint); }
    .chart-line { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-line.secondary { stroke: var(--orange); stroke-width: 2; stroke-dasharray: 5 6; }
    .chart-point { fill: #fff; stroke: var(--green); stroke-width: 3; }
    .subject-orbit { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: center; min-height: 235px; }
    .orbit { width: 184px; aspect-ratio: 1; margin: auto; border-radius: 50%; background: conic-gradient(var(--green) 0 83%, #e8f2ec 83% 100%); display: grid; place-items: center; position: relative; }
    .orbit::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: var(--card); }
    .orbit-center { z-index: 1; text-align: center; }
    .orbit-center strong { display: block; font-size: 37px; letter-spacing: -.08em; line-height: 1; }
    .orbit-center span { color: var(--muted); font-size: 11px; }
    .subject-list { display: grid; gap: 16px; }
    .subject-row { display: grid; grid-template-columns: 92px 1fr 38px; gap: 12px; align-items: center; font-size: 13px; }
    .subject-row > span:last-child { text-align: right; font-weight: 800; }
    .progress-track { height: 9px; border-radius: 99px; background: #edf3ef; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), #68cf9f); }
    .progress-fill.orange { background: linear-gradient(90deg, #df8d48, var(--orange)); }
    .progress-fill.red { background: linear-gradient(90deg, #d95d58, #f3987d); }
    .topic-stack { display: grid; gap: 13px; }
    .topic-row { display: grid; grid-template-columns: 118px 1fr auto; gap: 14px; align-items: center; }
    .topic-row strong { font-size: 13px; font-weight: 700; }
    .topic-row em { font-style: normal; color: var(--muted); font-size: 11px; }
    .priority { padding: 5px 8px; border-radius: 7px; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .priority.high { color: #b04e47; background: #fff0ed; }
    .priority.medium { color: #a3681e; background: #fff7e8; }
    .priority.low { color: var(--green-dark); background: #e8f8ef; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    @media (max-width: 900px) {
      .topbar, .page-wrap { padding-left: 22px; padding-right: 22px; }
      .hero { grid-template-columns: 1fr; gap: 30px; padding: 40px 34px; }
      .score-stage { justify-self: start; padding-left: 8px; }
      .score-ring { width: 210px; }
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 620px) {
      .topbar { height: 70px; padding: 0 16px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-copy strong { font-size: 12px; }
      .brand-copy span { font-size: 10px; }
      .saved-state { display: none; }
      .page-wrap { padding: 12px 16px 60px; }
      .hero { padding: 32px 24px 37px; min-height: auto; border-radius: 24px; }
      .hero h1 { font-size: 38px; }
      .hero-summary { font-size: 15px; line-height: 1.7; }
      .score-stage { margin-top: 12px; }
      .score-ring { width: 180px; }
      .score-value strong { font-size: 49px; }
      .section { margin-top: 30px; }
      .section-head { display: block; }
      .section-head p { margin-top: 10px; }
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .chart-card { padding: 20px; min-height: 300px; }
      .chart-card.tall { min-height: 360px; }
      .subject-orbit { grid-template-columns: 1fr; gap: 16px; }
      .orbit { width: 150px; }
      .topic-row { grid-template-columns: 100px 1fr auto; gap: 8px; }
      .topic-row strong { font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="Application header">
      <div class="brand-lockup">
        <button class="icon-button" aria-label="Back to results" title="Back">←</button>
        <div class="brand-mark" aria-hidden="true">ah</div>
        <div class="brand-copy"><strong>Admission Hub</strong><span>Intelligence workspace</span></div>
      </div>
      <div class="top-actions">
        <div class="saved-state" id="savedState"><span class="saved-dot"></span><span>Saved locally</span></div>
        <button class="icon-button" id="saveButton" aria-label="Save analysis" title="Save analysis">✓</button>
      </div>
    </header>
    <main class="page-wrap" id="workspace"></main>
  </div>

  <div class="thinking-screen" id="thinkingScreen" aria-live="polite" aria-label="AI analysis in progress" hidden>
    <div class="thinking-orbit orbit-one"></div><div class="thinking-orbit orbit-two"></div>
    <div class="thinking-core"><div class="core-glow"></div><span>ah</span></div>
    <div class="thinking-copy"><span class="thinking-label">AI PERFORMANCE ANALYSIS</span><h2 id="thinkingMessage">তোমার আজকের performance পড়ছি…</h2><p id="thinkingSub">Verified exam data থেকে useful patterns খুঁজে নিচ্ছি</p></div>
    <div class="stage-list" id="stageList" aria-label="Analysis stages"></div>
    <button class="skip-thinking" id="skipThinking">Report খুলুন</button>
  </div>

  <style>
    .thinking-screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; color: #effff7; background: #071d1a; }
    .thinking-screen[hidden] { display: none; }
    .thinking-screen::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, rgba(85, 221, 160, .17), transparent 22%), radial-gradient(circle at 50% 100%, rgba(24, 116, 88, .20), transparent 45%); }
    .thinking-core { width: 130px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1; background: radial-gradient(circle at 35% 27%, #e3fff0 0 4%, #78e8b2 5% 13%, #278f6a 35%, #082923 70%); box-shadow: 0 0 32px rgba(115, 239, 185, .55), 0 0 110px rgba(42, 171, 126, .25), inset -20px -24px 26px rgba(1, 14, 12, .52); animation: breathe 3.2s ease-in-out infinite; }
    .thinking-core::after { content: ""; position: absolute; inset: -18px; border: 1px solid rgba(145, 242, 194, .35); border-radius: 50%; border-left-color: transparent; border-bottom-color: transparent; animation: spin 8s linear infinite; }
    .thinking-core span { color: #c8f5df; font-size: 19px; font-weight: 900; letter-spacing: -.12em; }
    .core-glow { position: absolute; width: 5px; height: 5px; top: 20px; right: 28px; border-radius: 50%; background: white; box-shadow: 0 0 16px 4px white; }
    .thinking-orbit { position: absolute; border-radius: 50%; border: 1px solid rgba(159, 240, 201, .16); transform: rotate(-26deg); }
    .thinking-orbit::after { content: ""; position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--mint-2); box-shadow: 0 0 18px 3px var(--mint-2); }
    .orbit-one { width: 380px; height: 150px; top: calc(50% - 145px); left: calc(50% - 190px); }
    .orbit-one::after { top: 10px; left: 49%; }
    .orbit-two { width: 520px; height: 210px; top: calc(50% - 172px); left: calc(50% - 260px); transform: rotate(42deg); border-color: rgba(159, 240, 201, .09); }
    .orbit-two::after { bottom: 22px; right: 14%; background: var(--orange); box-shadow: 0 0 16px 3px var(--orange); }
    @keyframes breathe { 50% { transform: scale(1.06); box-shadow: 0 0 42px rgba(115, 239, 185, .68), 0 0 130px rgba(42,171,126,.3), inset -20px -24px 26px rgba(1,14,12,.52); } }
    .thinking-copy { position: absolute; z-index: 1; top: calc(50% + 96px); text-align: center; padding: 0 22px; }
    .thinking-label { color: var(--mint-2); font-size: 11px; font-weight: 800; letter-spacing: .18em; }
    .thinking-copy h2 { margin-top: 13px; font-size: clamp(23px, 3vw, 34px); letter-spacing: -.04em; }
    .thinking-copy p { margin-top: 8px; color: rgba(239,255,247,.56); font-size: 13px; }
    .stage-list { position: absolute; left: 30px; bottom: 30px; display: flex; gap: 8px; z-index: 1; }
    .stage-item { display: flex; align-items: center; gap: 6px; color: rgba(239,255,247,.42); font-size: 11px; }
    .stage-item::before { content: ""; width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; }
    .stage-item.active { color: var(--mint-2); }
    .stage-item.active::before { background: currentColor; box-shadow: 0 0 11px currentColor; }
    .stage-item.done { color: rgba(239,255,247,.75); }
    .stage-item.done::before { content: "✓"; width: 15px; height: 15px; border: 0; font-size: 11px; text-align: center; }
    .skip-thinking { position: absolute; z-index: 1; right: 30px; bottom: 25px; border: 1px solid rgba(200,245,223,.28); border-radius: 99px; padding: 9px 15px; color: rgba(239,255,247,.68); background: transparent; font-size: 12px; }
    .skip-thinking:hover { color: var(--mint); border-color: var(--mint-2); }
    @media (max-width: 620px) { .thinking-core { width: 106px; } .orbit-one { width: 290px; left: calc(50% - 145px); } .orbit-two { width: 370px; left: calc(50% - 185px); } .thinking-copy { top: calc(50% + 79px); } .stage-list { left: 20px; right: 20px; bottom: 78px; justify-content: center; flex-wrap: wrap; } .stage-item { font-size: 10px; } .skip-thinking { right: 20px; left: 20px; bottom: 20px; } }
  </style>
  <style>
    .demo-strip { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 12px 15px; margin-top: 22px; border: 1px dashed #a9c9b8; border-radius: 15px; color: #57766a; background: #eef9f1; font-size: 12px; }
    .demo-strip strong { color: var(--green-dark); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .demo-control { gap: 10px; }
    .demo-control select { border: 1px solid #c4ddcd; border-radius: 9px; padding: 8px 27px 8px 10px; color: var(--ink); background: #fff; font-size: 12px; }
    .muted-note { color: var(--muted); font-size: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 11px; padding: 11px 15px; color: #fff; background: var(--ink); font-size: 12px; font-weight: 800; transition: transform .2s var(--ease), box-shadow .2s, background .2s; }
    .button:hover { transform: translateY(-2px); background: var(--green-dark); box-shadow: 0 9px 18px rgba(12,107,81,.18); }
    .button.secondary { color: var(--ink); border-color: var(--line); background: #fff; box-shadow: none; }
    .button.secondary:hover { border-color: var(--mint-2); background: #f3fff8; }
    .button.mint { color: var(--green-dark); background: var(--mint); }
    .button.mint:hover { background: #aef0ce; }
    .soft-strip { padding: 22px 25px; border-radius: var(--radius-lg); background: #e9f8ee; border: 1px solid #d2eddb; color: var(--ink-2); }
    .soft-strip strong { color: var(--green-dark); font-size: 13px; }
    .soft-strip p { margin-top: 5px; color: #66877a; font-size: 14px; line-height: 1.7; }
    .numbered-card { padding: 24px; position: relative; overflow: hidden; }
    .numbered-card::before { content: attr(data-index); position: absolute; top: 12px; right: 18px; color: #e4f0e8; font-size: 62px; font-weight: 900; letter-spacing: -.1em; line-height: 1; }
    .numbered-card h3 { position: relative; font-size: 17px; }
    .numbered-card p { position: relative; margin-top: 11px; color: var(--muted); font-size: 13px; line-height: 1.75; }
    .insight-list { position: relative; display: grid; gap: 13px; margin-top: 21px; }
    .insight-list li { list-style: none; display: flex; gap: 10px; align-items: start; color: var(--ink-2); font-size: 13px; line-height: 1.7; }
    .insight-list li::before { content: "↗"; flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 7px; color: var(--green-dark); background: var(--mint); font-size: 11px; font-weight: 800; }
    .weakness-card { background: #fffdfb; border-color: #f0e6df; }
    .weakness-card::before { color: #f8eee7; }
    .weakness-card .signal { color: #bf6941; }
    .signal { display: inline-flex; align-items: center; gap: 6px; color: var(--green-dark); font-size: 11px; font-weight: 800; }
    .signal::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px rgba(29,149,107,.10); }
    .weakness-card .signal::before { box-shadow: 0 0 0 4px rgba(230,110,99,.12); }
    .map-card { padding: 25px; }
    .map-card .card-title { margin-bottom: 28px; }
    .axis { display: flex; justify-content: space-between; padding-left: 132px; color: #9aaa9f; font-size: 10px; }
    .axis span:nth-child(2) { color: var(--orange); }

        <section class="section" id="atlas" aria-labelledby="atlas-title"><div class="section-head"><div><span class="section-kicker"><i>02A</i> 3D performance atlas</span><h2 id="atlas-title">তোমার performance field</h2></div><p>Canvas-based 3D projection: subject bars, topic nodes, accuracy height এবং live focus readout.</p></div><div class="atlas-layout"><article class="card atlas-card"><div class="atlas-toolbar"><div><span class="atlas-live"><i></i>LIVE VECTOR FIELD</span><p>Drag / hover nodes · orbit responds to your pointer</p></div><div class="atlas-actions"><button class="atlas-action" data-action="atlas-toggle">Pause orbit</button><button class="atlas-action" data-action="atlas-reset">Reset view</button></div></div><div class="atlas-stage"><span class="atlas-corner top">X / SUBJECT · Y / ACCURACY · Z / TOPIC</span><span class="atlas-corner bottom">RENDERER ${RENDERER_VERSION} · 60 FPS TARGET</span><canvas id="atlasCanvas" aria-label="Interactive three dimensional performance chart. Subject accuracy is represented by height and topic accuracy by floating nodes."></canvas><div class="atlas-tooltip" id="atlasTooltip" hidden></div><div class="atlas-legend"><span><i style="background:var(--mint-2)"></i>subject accuracy</span><span><i style="background:var(--orange)"></i>topic signal</span></div></div></article><aside class="card atlas-inspector"><div class="card-title"><div><h3>Signal inspector</h3><p>Click a node to isolate its layer</p></div></div><div class="inspector-stats"><div class="inspector-stat"><small>Signal nodes</small><strong>09</strong></div><div class="inspector-stat"><small>Focus score</small><strong>${num(state.metrics.percentage)}%</strong></div></div><span class="inspector-label">PERFORMANCE NODES</span><div class="node-list">${renderAtlasNodes()}</div><div class="atlas-readout"><small>AI READOUT</small><p>${esc(state.analysis.trends[2] || "একটি focused node বেছে নিয়ে তার performance আলাদা করে দেখো।")}</p></div></aside></div></section>

        <section class="section" id="strengths" aria-labelledby="strengths-title"><div class="section-head"><div><span class="section-kicker"><i>03</i> Strengths</span><h2 id="strengths-title">যেখানে তোমার edge আছে</h2></div><p>এই zones-এ confidence রাখো, কিন্তু maintenance practice বন্ধ কোরো না।</p></div><div class="grid grid-3">${state.analysis.strengths.map((item, index) => `<article class="card numbered-card" data-index="0${index + 1}"><span class="signal">Reliable signal</span><h3 style="margin-top:14px">${esc(item)}</h3><p>${index === 0 ? "Recent answers-এ এই pattern consistently দেখা গেছে।" : index === 1 ? "এখানে তোমার response সাধারণত দ্রুত এবং নির্ভুল।" : "এটি তোমার current exam strategy-র একটি ভালো দিক।"}</p></article>`).join("")}</div></section>

        <section class="section" id="weaknesses" aria-labelledby="weaknesses-title"><div class="section-head"><div><span class="section-kicker"><i>04</i> Priority weaknesses</span><h2 id="weaknesses-title">কম effort-এ বেশি impact</h2></div><p>সব ভুল এক রকম নয়। প্রথমে সেই friction-গুলো ঠিক করো যেগুলো score-এ repeat করে।</p></div><div class="grid grid-3">${state.analysis.weaknesses.map((item, index) => `<article class="card numbered-card weakness-card" data-index="0${index + 1}"><span class="signal">Priority ${index + 1}</span><h3 style="margin-top:14px">${esc(item)}</h3><p>${index === 0 ? "প্রশ্নের option দুটো একই রকম মনে হলে rule contrast করো।" : index === 1 ? "Recall sheet-এ short facts রেখে spaced review করো।" : "Timed set-এ skip-and-return rule ব্যবহার করো।"}</p></article>`).join("")}</div></section>

        <section class="section" id="topics" aria-labelledby="topics-title"><div class="section-head"><div><span class="section-kicker"><i>05</i> Topic intelligence</span><h2 id="topics-title">কোন chapter-এ সময় দেবে?</h2></div><p>Accuracy, priority আর subject balance একসঙ্গে দেখো। Chart values frontend থেকেই calculated.</p></div><div class="grid grid-2"><article class="card map-card"><div class="card-title"><div><h3>Weakness map</h3><p>Higher bar = stronger command</p></div><span class="priority high">high priority</span></div><div class="axis"><span>0%</span><span>attention zone</span><span>100%</span></div><div class="map-rows">${renderTopicRows()}</div></article><article class="card chart-card"><div class="card-title"><div><h3>Subject balance</h3><p>Average accuracy ${num(averageSubject)}%</p></div></div><div class="subject-orbit"><div class="orbit" style="background:conic-gradient(var(--green) 0 ${Math.round(averageSubject)}%,#e8f2ec ${Math.round(averageSubject)}% 100%)"><div class="orbit-center"><strong>${num(averageSubject)}%</strong><span>all subjects</span></div></div><div class="subject-list">${renderSubjectRows()}</div></div></article></div></section>

        <section class="section" id="mistakes" aria-labelledby="mistakes-title"><div class="section-head"><div><span class="section-kicker"><i>06</i> Mistake patterns</span><h2 id="mistakes-title">ভুলকে category-তে ভাঙো</h2></div><p>একই ফলাফলের ভেতরে আলাদা আলাদা cause থাকে। Cause জানলেই revision ছোট হয়।</p></div><div class="grid grid-2"><article class="card chart-card"><div class="card-title"><div><h3>Mistake distribution</h3><p>Pattern history across recent attempts</p></div></div><div class="donut-wrap"><div class="donut"><div class="donut-center"><strong>${totalMistakes}</strong><span>signals</span></div></div><div class="donut-legend"><div><i class="legend-pip" style="background:var(--orange)"></i>Rule confusion · 38%</div><div><i class="legend-pip" style="background:var(--red)"></i>Recall gap · 28%</div><div><i class="legend-pip" style="background:var(--violet)"></i>Careless reading · 19%</div><div><i class="legend-pip" style="background:var(--blue)"></i>Time pressure · 15%</div></div></div></article><article class="card chart-card"><div class="card-title"><div><h3>Time efficiency</h3><p>Minutes spent versus accuracy</p></div></div>${timeEfficiencySvg()}</article></div><div class="card pattern-stack" style="padding:17px;margin-top:17px">${renderMistakePatterns()}</div></section>

        <section class="section" id="insight" aria-labelledby="insight-title"><article class="ai-insight"><span class="section-kicker"><i>07</i> AI insight · Secure proxy</span><h3 id="insight-title">“${esc(state.analysis.summary)}”</h3><p>${esc(state.analysis.recommendations[0] || "তোমার next step verified result-এর সঙ্গে সামঞ্জস্য রেখে বেছে নাও।")} ${esc(state.analysis.recommendations[1] || "ছোট, repeatable practice-এ focus রাখাই ভালো।")}</p></article></section>

        <section class="section" id="lab" aria-labelledby="lab-title"><div class="section-head"><div><span class="section-kicker"><i>08</i> Wrong answer lab</span><h2 id="lab-title">ভুল প্রশ্নগুলোকে teacher বানাও</h2></div><p>প্রতিটি explanation প্রশ্নের payload-এ সীমাবদ্ধ। Cache থাকলে আবার AI call হবে না।</p></div><article class="card wrong-lab"><div class="lab-toolbar"><div><strong>${wrongQuestions.length ? `${wrongQuestions.length}টি প্রশ্ন review-ready` : "No wrong answers"}</strong><span>${wrongQuestions.length ? "select করে batch explanation চালাও" : "এই scenario-তে সব attempted answer correct"}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="button mint" data-action="explain-all" ${wrongQuestions.length ? "" : "disabled"}>✨ Explain all wrong</button><button class="button secondary" data-action="explain-selected" ${state.selectedQuestions.size ? "" : "disabled"}>Explain selected (${state.selectedQuestions.size})</button></div></div><div class="question-stack">${wrongQuestions.length ? wrongQuestions.map(renderWrongQuestion).join("") : `<div class="empty-state">No wrong answers in this demo scenario. Use the selector above to inspect the other lab states.</div>`}</div></article></section>

        <section class="section" id="revision" aria-labelledby="revision-title"><div class="section-head"><div><span class="section-kicker"><i>09</i> Revision plan</span><h2 id="revision-title">পরের ৩ দিনের clarity</h2></div><p>AI suggestion; duration, order এবং progress tracking UI layer-এর নিয়ন্ত্রণে।</p></div><article class="card revision"><div class="timeline">${state.analysis.actionPlan.map((item, index) => `<div class="timeline-item"><div class="timeline-dot">${index + 1}</div><div class="timeline-day">${esc(item.day)}</div><div class="timeline-copy"><strong>${esc(item.title)}</strong><p>${esc(item.detail)}</p></div></div>`).join("")}</div></article></section>

        <section class="section" id="coach" aria-labelledby="coach-title"><article class="coach-note"><span class="section-kicker"><i>10</i> Final coach note</span><blockquote id="coach-title">“Score বাড়ানোর shortcut নতুন chapter নয়; repeat হওয়া ভুলের friction কমানো।”</blockquote><cite>— AI Coach · based on verified attempt data</cite></article></section>

        <footer style="padding:50px 0 20px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><span>Admission Hub · AI Performance Analysis prototype</span><span>schema ${AI_SCHEMA_VERSION} · analysis ${ANALYSIS_VERSION} · renderer ${RENDERER_VERSION}</span></footer>`;
      bindWorkspaceEvents();
    }
    function toast(message) {
      let node = document.querySelector(".toast");
      if (!node) { node = document.createElement("div"); node.className = "toast"; document.body.appendChild(node); }
      node.textContent = message; node.classList.add("show"); clearTimeout(node._timer); node._timer = setTimeout(() => node.classList.remove("show"), 2600);
    }
    function bindWorkspaceEvents() {
      const scenarioSelect = document.getElementById("scenarioSelect");
      if (scenarioSelect) scenarioSelect.onchange = () => runAnalysis(scenarioSelect.value);
      const hero = document.querySelector(".hero");
      if (hero && window.matchMedia("(pointer:fine)").matches) {
        hero.onpointermove = event => { const rect = hero.getBoundingClientRect(); hero.style.setProperty("--hero-x", `${((event.clientX - rect.left) / rect.width - .5) * 2.2}deg`); hero.style.setProperty("--hero-y", `${((event.clientY - rect.top) / rect.height - .5) * -2.2}deg`); };
        hero.onpointerleave = () => { hero.style.setProperty("--hero-x", "0deg"); hero.style.setProperty("--hero-y", "0deg"); };
      }
      workspace.onchange = event => {
        const checkbox = event.target.closest("[data-question-check]");
        if (!checkbox) return;
        const id = checkbox.dataset.questionCheck;
        checkbox.checked ? state.selectedQuestions.add(id) : state.selectedQuestions.delete(id);
        renderWorkspace();
      };
      workspace.onclick = event => {
        const actionNode = event.target.closest("[data-action]");
        if (!actionNode) return;
        const action = actionNode.dataset.action;
        if (action === "toggle-question") { const id = actionNode.dataset.id; state.openQuestions.has(id) ? state.openQuestions.delete(id) : state.openQuestions.add(id); renderWorkspace(); }
        if (action === "explain") explainQuestions([actionNode.dataset.id]);
        if (action === "regenerate") explainQuestions([actionNode.dataset.id], true);
        if (action === "explain-all") explainQuestions(state.payload.questions.filter(q => q.status === "wrong").map(q => q.id));
        if (action === "explain-selected") explainQuestions([...state.selectedQuestions]);
        if (action === "generate-vocab") generateVocabularyPlan(actionNode);
        if (action === "apply-vocab") state.vocabReady ? toast("Mapped images are ready to apply by vocabId.") : toast("Generate the visual plan first.");
        if (action === "atlas-toggle") { state.atlasSettings.auto = !state.atlasSettings.auto; updateAtlasControls(); }
        if (action === "atlas-reset") { state.atlasSettings = { ...state.atlasSettings, auto: true, rotY: -.42, rotX: .34, focus: "" }; updateAtlasControls(); }
        if (action === "atlas-focus") { state.atlasSettings.focus = state.atlasSettings.focus === actionNode.dataset.node ? "" : actionNode.dataset.node; state.atlasSettings.auto = false; updateAtlasControls(); }
      };
      init3DAtlas();
    }
    function loadExplanationCache() { try { state.explanationCache = JSON.parse(localStorage.getItem("ah-explanation-cache") || "{}"); } catch (_) { state.explanationCache = {}; } }
    async function explainQuestions(ids, regenerate = false) {
      const questions = state.payload.questions.filter(q => ids.includes(q.id) && q.status === "wrong");
      if (!questions.length) { toast("এই scenario-তে explain করার মতো selected wrong answer নেই।"); return; }
      questions.forEach(question => { state.openQuestions.add(question.id); if (regenerate) delete state.explanationCache[`${question.id}::${question.selected}::1`]; state.busyQuestions.add(question.id); });
      renderWorkspace();
      try {
        const uncached = questions.filter(question => !state.explanationCache[`${question.id}::${question.selected}::1`]);
        if (uncached.length) {
          const results = await state.ai.explainBatch(uncached);
          results.forEach((result, index) => { const question = uncached[index]; state.explanationCache[`${question.id}::${question.selected}::1`] = result; });
          try { localStorage.setItem("ah-explanation-cache", JSON.stringify(state.explanationCache)); } catch (_) {}
          toast(`${results.length}টি focused explanation তৈরি হয়েছে এবং cache করা হয়েছে।`);
        } else toast("Cached explanation দেখানো হলো, নতুন AI call হয়নি।");
      } catch (_) { toast("AI explanation এখন unavailable; পরে আবার চেষ্টা করো।"); }
      questions.forEach(question => state.busyQuestions.delete(question.id));
      renderWorkspace();
    }
    async function generateVocabularyPlan(button) {
      button.disabled = true; button.textContent = "Planning visuals…";
      try { state.vocabPlans = await state.ai.generateVocabularyVisualPlan(vocabulary); state.vocabReady = true; toast("5টি stable vocabId → imageId mapping তৈরি হয়েছে।"); }
      catch (_) { toast("Visual planner unavailable; পরে আবার চেষ্টা করো।"); }
      renderWorkspace();
    }
    function setupThinking() {
      thinkingScreen.hidden = false;
      stageList.innerHTML = stages.map((stage, index) => `<span class="stage-item ${index === 0 ? "active" : ""}" data-stage="${index}">${stage}</span>`).join("");
      let index = 0;
      clearInterval(state.thinkingTimer);
      state.thinkingTimer = setInterval(() => {
        index = Math.min(index + 1, stages.length - 1);
        document.querySelectorAll(".stage-item").forEach((node, nodeIndex) => node.className = `stage-item ${nodeIndex < index ? "done" : nodeIndex === index ? "active" : ""}`);
        document.getElementById("thinkingMessage").textContent = thinkingMessages[Math.min(index, thinkingMessages.length - 1)][0];
        document.getElementById("thinkingSub").textContent = thinkingMessages[Math.min(index, thinkingMessages.length - 1)][1];
      }, 560);
    }
    async function runAnalysis(scenarioKey) {
      state.scenario = DEMO_SCENARIOS[scenarioKey] ? scenarioKey : "sample";
      state.adapter.scenario = state.scenario; state.selectedQuestions.clear(); state.openQuestions.clear(); state.vocabReady = false; state.atlasSettings = { ...state.atlasSettings, auto: true, rotY: -.42, rotX: .34, focus: "" };
      setupThinking();
      const payload = buildAnalysisPayload(state.adapter);
      state.payload = payload; state.metrics = calculateMetrics(payload.currentExam);
      const aiRequest = state.ai.analyze(payload).catch(() => fallbackAnalysis());
      const minimumExperience = new Promise(resolve => setTimeout(resolve, 3300));
      const [raw] = await Promise.all([aiRequest, minimumExperience]);
      state.analysis = validateAndNormalize(raw);
      await AnalysisStore.save({ analysisId: `analysis-${payload.currentExam.id}`, examId: payload.currentExam.id, createdAt: new Date().toISOString(), schemaVersion: AI_SCHEMA_VERSION, analysisData: state.analysis, status: "complete", rendererVersion: RENDERER_VERSION });
      clearInterval(state.thinkingTimer); thinkingScreen.hidden = true; renderWorkspace();
      document.getElementById("savedState").innerHTML = `<span class="saved-dot"></span><span>Saved locally</span>`;
    }

    async function bootLiveAnalysis() {
      const rawText = sessionStorage.getItem('admission-hub-ai-live-input');
      let raw = null;
      try { raw = rawText ? JSON.parse(rawText) : null; } catch (_) { raw = null; }
      if (!raw?.result) {
        state.payload = { currentExam: { id: 'missing-result', title: 'Result পাওয়া যায়নি', type: 'Admission Hub', date: '—', totalQuestions: 0, totalMarks: 0, marksPerQ: 1, negativeMarking: 0, correct: 0, wrong: 0, skipped: 0, timeSpentSeconds: 0, durationSeconds: 3600 }, previousExams: [], questions: [], subjects: [], topics: [], mistakeHistory: [] };
        state.metrics = calculateMetrics(state.payload.currentExam); state.analysis = fallbackAnalysis(); thinkingScreen.hidden = true; renderWorkspace(); return;
      }
      LiveDataAdapter.raw = raw;
      LiveDataAdapter.raw = raw; try { sessionStorage.setItem('admission-hub-ai-endpoint', String(window.ADMISSION_HUB_AI_ENDPOINT || '')); sessionStorage.setItem('admission-hub-ai-sitekey', String(window.ADMISSION_HUB_TURNSTILE_SITEKEY || '')); } catch (_) {} state.adapter = LiveDataAdapter; state.ai = LiveAIAdapter;
      state.scenario = 'live';
      const rendererPayload = buildLiveRendererPayload(raw);
      const analysisId = 'analysis-' + rendererPayload.currentExam.id;
      const cached = await AnalysisStore.get(analysisId);
      if (cached?.analysisData) {
        state.payload = rendererPayload; state.metrics = calculateMetrics(rendererPayload.currentExam); state.analysis = validateAndNormalize(cached.analysisData); thinkingScreen.hidden = true; renderWorkspace(); return;
      }
      await runAnalysis('live');
      sessionStorage.removeItem('admission-hub-ai-live-input');
    }

    document.getElementById("skipThinking").onclick = () => { if (state.analysis && state.payload) { clearInterval(state.thinkingTimer); thinkingScreen.hidden = true; renderWorkspace(); } else toast("রিপোর্ট প্রস্তুত হচ্ছে…"); };
    document.getElementById("saveButton").onclick = async () => { if (state.payload && state.analysis) { await AnalysisStore.save({ analysisId: `analysis-${state.payload.currentExam.id}`, examId: state.payload.currentExam.id, createdAt: new Date().toISOString(), schemaVersion: AI_SCHEMA_VERSION, analysisData: state.analysis, status: "complete", rendererVersion: RENDERER_VERSION }); toast("Analysis saved in this browser."); } };
    loadExplanationCache();
    const backButton = document.querySelector('.topbar .icon-button');
    if (backButton) backButton.addEventListener('click', () => { if (window.parent !== window) window.parent.postMessage({ type: 'admission-hub-ai-close' }, '*'); else history.back(); });
    bootLiveAnalysis();
  </script>
</body>
</html>
