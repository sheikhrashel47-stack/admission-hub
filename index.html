  window.toggleUpgrade=async function(group,key){const s=normalizeSettings(CACHE.settings); if(group==='cards') s.dashboardCards[key]=s.dashboardCards[key]===false; else if(group==='feedback') s.feedback[key]=s.feedback[key]===false; else if(group==='examDefaults') s.examDefaults[key]=s.examDefaults[key]===false; else if(key==='animation') s.animation=s.animation==='on'?'off':'on'; else s[key]=!s[key]; CACHE.settings=s; await dbPut('settings',s); applyUpgradePrefs(); render();};

  function mistakeRows(){return CACHE.mistakes.map(m=>{const q=CACHE.questions.find(x=>x.id===m.questionId); if(!q)return null; const attempts=Math.max(Number(m.attempts||0),Number(q.stats&&q.stats.attempts||0),Number(m.wrongCount||0)); const wrong=Math.max(Number(m.wrongCount||0),Number(q.stats&&q.stats.wrong||0)); const correct=Math.max(0,Number(m.correctCount||0),Number(q.stats&&q.stats.correct||0)); const acc=attempts?round2(correct/attempts*100):0; const age=Math.max(0,Date.now()-Number(m.lastWrongAt||m.updatedAt||0)); const priority=wrong>=5||acc<50?'high':wrong>=2||acc<75?'medium':'low'; return {m,q,attempts,wrong,correct,acc,age,priority};}).filter(Boolean);}
  renderMistakes=function(){const filter=window.MistakeFilter||'all', now=Date.now(), rows=mistakeRows().filter(r=>filter==='all'||filter==='today'?(filter==='all'||todayKey(new Date(r.m.lastWrongAt||0))===todayKey()):filter==='frequent'?r.wrong>=3:filter==='recent'?r.age<7*86400000:filter==='critical'?r.priority==='high':filter==='weak'?r.acc<70:true).sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2}[b.priority])||b.wrong-a.wrong)); const html=`<div class="explorer-head"><div class="explorer-kicker">Revision System</div><div class="explorer-title">Mistake Bank 2.0</div><div class="explorer-subtitle">${rows.length} real mistakes ranked by frequency, accuracy, and recency.</div></div><div class="row wrap" style="gap:7px;margin-bottom:10px"><button class="btn sm" onclick="openMistakePracticeModal()">🔁 Practice My Mistakes</button><button class="btn secondary sm" onclick="startMistakeExam('flash')">⚡ Flash</button></div><div class="filter-row" style="margin-bottom:12px">${[['all','All'],['today','Today'],['frequent','Frequently Wrong'],['recent','Recently Wrong'],['critical','Critical'],['weak','Weak Topic']].map(([v,l])=>`<button class="chip ${(filter===v?'active':'')}" onclick="MistakeFilter='${v}';render()">${l}</button>`).join('')}</div>${rows.length?rows.map(r=>`<article class="card mistake-row priority-${r.priority}" style="cursor:pointer"><div class="row between" style="align-items:flex-start;gap:8px"><div style="min-width:0;flex:1"><b>${esc(r.q.question||'Untitled')}</b><div class="muted" style="margin-top:5px">${esc(subjectName(r.q.subjectId))} · ${esc(topicName(r.q.topicId))}</div></div><span class="pill ${r.priority==='high'?'red':'orange'}">${r.priority.toUpperCase()}</span></div><div class="history-tool-stats"><span>Wrong ${r.wrong}×</span><span>Attempts ${r.attempts}</span><span>Correct ${r.correct}</span><span>Accuracy ${r.acc}%</span></div><div class="row wrap" style="margin-top:9px;gap:6px"><button class="btn ghost sm" onclick="event.stopPropagation();startQuestionPractice(['${r.q.id}'])">Review</button><button class="btn secondary sm" onclick="event.stopPropagation();beginExamFromPool([CACHE.questions.find(q=>q.id==='${r.q.id}')],'flash')">Flash Test</button><button class="btn ghost sm" onclick="event.stopPropagation();toggleQuestionBookmark('${r.q.id}')">${r.q.bookmarked?'★':'☆'} Bookmark</button><button class="btn danger sm" onclick="event.stopPropagation();removeMistake('${r.m.id}')">Remove</button></div></article>`).join(''):emptyState('✅','Mistake Bank is Empty','Wrong answers will appear here automatically after completed exams.')}`; renderShell(html,{title:'Mistake Bank',back:"navigate('exam')"});};
  window.MistakeFilter='all'; window.removeMistake=async function(id){await dbDel('mistakes',id);CACHE.mistakes=await dbGetAll('mistakes');toast('Removed from Mistake Bank');render();};

  function topicAnalytics(){const map={}; CACHE.examResults.forEach(r=>(r.snapshot||[]).forEach(q=>{const key=q.topicId||'unknown'; if(!map[key])map[key]={id:key,name:topicName(key),correct:0,wrong:0,time:0}; if(q.status==='correct')map[key].correct++; if(q.status==='wrong')map[key].wrong++; map[key].time+=(q.timing&&q.timing.ms||0)/1000;})); return Object.values(map).map(x=>({...x,attempts:x.correct+x.wrong,acc:accuracyOf(x),avgTime:x.attempts?round2(x.time/x.attempts):0})).sort((a,b)=>a.acc-b.acc);}

  window.startWeakTopicPractice=async function(topicId){const pool=CACHE.questions.filter(q=>q.topicId===topicId);if(pool.length)beginExamFromPool(pool.slice(0,20),'flash');else toast('No questions in this topic');};

  window.openSmartPracticeModal=function(){openModal(`<h3>Smart Practice</h3><div class="muted">The engine prioritizes frequent mistakes, weak topics, recent mistakes, unattempted, then older questions.</div><label class="flabel">Questions</label><div class="filter-row">${[10,20,50,100].map(n=>`<button class="chip" onclick="startSmartPractice(${n},'flash')">${n}</button>`).join('')}</div><label class="flabel">Mode</label><div class="filter-row"><button class="chip" onclick="startSmartPractice(20,'flash')">⚡ Flash</button><button class="chip" onclick="startSmartPractice(20,'mock')">📝 Mock</button><button class="chip" onclick="startSmartPractice(20,'flash')">🔁 Revision</button></div>`);};
  window.startSmartPractice=async function(count,mode){const score=q=>{const st=q.stats||{}, m=CACHE.mistakes.find(x=>x.questionId===q.id); const wrong=Math.max(st.wrong||0,m&&m.wrongCount||0), attempts=st.attempts||0, recent=m&&m.lastWrongAt?Math.max(0,1-(Date.now()-m.lastWrongAt)/(30*86400000)):0, weak=attempts>=3&&((st.correct||0)/attempts)<.7?1:0, un=attempts===0?1:0; return wrong*100+weak*45+recent*20+un*10+(q.createdAt?1:0);}; const pool=[...CACHE.questions].sort((a,b)=>score(b)-score(a)).slice(0,Number(count)||20); closeModal(); if(!pool.length){toast('Add or import questions first');return;} ExamSetup=freshSetup(); ExamSetup.mode=mode==='mock'?'mock':'flash'; ExamSetup.totalCount=pool.length; ExamSetup.onlyQuestionIds=pool.map(q=>q.id); await beginExam();};
  const oldRender=render; render=function(){if(Router.path==='smart-practice'){openSmartPracticeModal();Router.path='dashboard';location.hash='dashboard';return;} return oldRender();};
})();

boot();
</script>
</body>
</html>
