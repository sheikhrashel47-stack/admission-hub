
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Admission Hub</title>
<style>
:root{
  --emerald:#0f6b4f;
  --emerald-d:#0b4f3b;
  --mint:#e7f4ee;
  --bg:#faf9f6;
  --card:#ffffff;
  --text:#1a1d1b;
  --sub:#6b7370;
  --line:#e7e5e0;
  --green:#1e8e5a;
  --red:#c0392b;
  --orange:#c98a2c;
  --radius:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --shadow: 0 4px 12px rgba(0,0,0,0.05);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"]{
  --emerald:#22c55e;
  --emerald-d:#16a34a;
  --mint:#173a2b;
  --bg:#121212;
  --card:#1c1c1e;
  --text:#f2f2f0;
  --sub:#9aa39d;
  --line:#2d2d2f;
  --green:#2ecc71;
  --red:#ff6b6b;
  --orange:#f0a94d;
}
[data-theme="pink"]{
  --emerald:#b5305a;
  --emerald-d:#8f2147;
  --mint:#fbeaf0;
  --bg:#fff6f8;
  --card:#ffffff;
  --text:#241419;
  --sub:#8a6b73;
  --line:#f2d9e0;
  --green:#1e8e5a;
  --red:#c0392b;
  --orange:#c98a2c;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow-x:hidden;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--text); overscroll-behavior:none;
  touch-action:manipulation; -webkit-user-select:none; user-select:none;
  padding-top:var(--safe-t);
  transition:background .2s ease, color .2s ease;
}
input,textarea,[contenteditable]{-webkit-user-select:text; user-select:text;}
button{font-family:inherit;}
#app{max-width:560px; margin:0 auto; min-height:100%; padding-bottom:calc(74px + var(--safe-b)); overflow-x:hidden;}
#app.no-nav{padding-bottom:calc(24px + var(--safe-b));}
.hide{display:none !important;}
.page{overflow-wrap:break-word; word-break:break-word;}

/* Top bar */
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px);
  display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);}
.topbar h1{font-size:17px; margin:0; flex:1; font-weight:700;}
.iconbtn{background:none; border:none; font-size:19px; padding:6px 8px; border-radius:10px; cursor:pointer; color:var(--emerald-d);}
.iconbtn:active{background:var(--mint);}
.backbtn{background:none;border:none;font-size:20px;padding:4px 6px;color:var(--emerald-d);cursor:pointer;}

/* Bottom nav */
.bottomnav{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card);
  border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);
  max-width:560px; margin:0 auto;}
.navbtn{flex:1; background:none; border:none; padding:9px 0 8px; display:flex; flex-direction:column;
  align-items:center; gap:2px; color:var(--sub); font-size:10.5px; cursor:pointer;}
.navbtn .ic{font-size:20px;}
.navbtn.active{color:var(--emerald);}

.page{padding:14px 16px 24px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px; box-shadow: var(--shadow); transition: var(--transition);}
.card:active{transform:scale(.985);}
.premium-card{background: linear-gradient(135deg, var(--emerald), var(--emerald-d)); color: #fff; border: none;}
.premium-card .muted{color: rgba(255,255,255,0.8);}
.premium-card .progbar{background: rgba(255,255,255,0.2);}
.premium-card .progbar>div{background: #fff;}
.stat-value{font-size: 22px; font-weight: 800; letter-spacing: -0.5px;}
.stat-label{font-size: 11px; text-transform: uppercase; font-weight: 600; opacity: 0.7; margin-top: 2px;}
.focus-tag{padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;}
.focus-tag.revision{background: #fee2e2; color: #ef4444;}
.focus-tag.improving{background: #fef3c7; color: #d97706;}
.focus-tag.strong{background: #dcfce7; color: #16a34a;}
.animate-count{display: inline-block;}
.btn-press{transition: transform 0.1s ease;}
.btn-press:active{transform: translateY(2px);}
@keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in{animation: fadeUp 0.5s ease-out forwards;}
.stagger-1{animation-delay: 0.1s;}
.stagger-2{animation-delay: 0.2s;}
.stagger-3{animation-delay: 0.3s;}
.row{display:flex; align-items:center; gap:10px;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.muted{color:var(--sub); font-size:12.5px;}
.big{font-size:26px; font-weight:800;}
.h2{font-size:15px; font-weight:700; margin:18px 0 8px;}
.pill{background:var(--mint); color:var(--emerald-d); font-size:11.5px; padding:3px 9px; border-radius:20px; font-weight:600;}
.pill.red{background:color-mix(in srgb, var(--red) 15%, var(--card)); color:var(--red);}
.pill.orange{background:color-mix(in srgb, var(--orange) 15%, var(--card)); color:var(--orange);}
.btn{background:var(--emerald); color:#fff; border:none; border-radius:11px; padding:12px 14px; font-size:14.5px; font-weight:700; cursor:pointer; width:100%;}
.btn:active{background:var(--emerald-d);}
.btn.secondary{background:var(--mint); color:var(--emerald-d);}
.btn.danger{background:color-mix(in srgb, var(--red) 15%, var(--card)); color:var(--red);}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--text);}
.btn.sm{width:auto; padding:8px 12px; font-size:13px; border-radius:9px;}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px;
  background:var(--card); color:var(--text); font-family:inherit;
}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--emerald) 45%,transparent); outline-offset:1px;}
textarea{resize:vertical; min-height:70px;}
label.flabel{font-size:12.5px; color:var(--sub); font-weight:600; margin:10px 0 4px; display:block;}
.progbar{height:8px; background:var(--mint); border-radius:6px; overflow:hidden;}
.progbar>div{height:100%; background:var(--emerald); border-radius:6px;}
.empty{text-align:center; padding:40px 16px; color:var(--sub);}
.empty .ic{font-size:38px; margin-bottom:8px;}
.opt{border:1px solid var(--line); border-radius:11px; padding:12px 14px; margin-bottom:9px; display:flex; align-items:center; gap:10px; cursor:pointer;}
.opt .let{width:24px; height:24px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.opt.selected{border-color:var(--emerald); background:var(--mint);}
.opt.selected .let{background:var(--emerald); color:#fff; border-color:var(--emerald);}
.opt.correct{border-color:var(--green); background:color-mix(in srgb, var(--green) 14%, var(--card));}
.opt.correct .let{background:var(--green); color:#fff; border-color:var(--green);}
.opt.wrong{border-color:var(--red); background:color-mix(in srgb, var(--red) 14%, var(--card));}
.opt.wrong .let{background:var(--red); color:#fff; border-color:var(--red);}
.toast{position:fixed; bottom:calc(88px + var(--safe-b)); left:50%; transform:translateX(-50%);
  background:#1a1d1b; color:#fff; padding:10px 18px; border-radius:30px; font-size:13.5px; z-index:100; opacity:0; transition:opacity .25s;}
.toast.show{opacity:1;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:flex; align-items:flex-end;}
.modal{background:var(--card); width:100%; max-width:560px; margin:0 auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + var(--safe-b)); max-height:85vh; overflow-y:auto;}
.modal h3{margin:0 0 12px; font-size:16px;}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px; padding:7px 12px; font-size:13px; cursor:pointer; margin:3px 4px 3px 0;}
.chip.active{background:var(--emerald); color:#fff; border-color:var(--emerald);}
.listitem{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--line);}
.listitem:last-child{border-bottom:none;}
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0; padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; background:var(--mint); color:var(--emerald-d); cursor:pointer; white-space:nowrap;}
.tab.active{background:var(--emerald); color:#fff;}
.timerbox{font-variant-numeric:tabular-nums; font-weight:800; font-size:15px; color:var(--emerald-d);}
.qnav{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:10px;}
.qnavbtn{aspect-ratio:1; border-radius:8px; border:1px solid var(--line); background:var(--card); font-size:12px; font-weight:700; cursor:pointer;}
.qnavbtn.answered{background:var(--emerald); color:#fff; border-color:var(--emerald);}
.qnavbtn.current{outline:2px solid var(--orange);}
.exam-q-card { border-left: 4px solid transparent; transition: border-color .15s ease; }
.exam-q-card:active { opacity:.94; }
.qnavbtn.flagged { border-color: var(--red); color: var(--red); background: #fff5f5; }
.options-list { display: flex; flex-direction: column; gap: 8px; }
.sticky-bottom { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; z-index: 10; }
.import-card-valid { border-left: 4px solid var(--emerald); }
.import-card-invalid { border-left: 4px solid var(--red); }
.import-card-duplicate { border-left: 4px solid var(--orange); }
.history-tool-card{border-left:4px solid var(--emerald);transition:transform .18s ease,box-shadow .18s ease}.history-tool-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(15,107,79,.12)}.history-tool-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.history-tool-stats span{font-size:11px;background:var(--mint);color:var(--emerald-d);padding:5px 8px;border-radius:8px;font-weight:700}.history-filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.history-record{cursor:pointer}.history-record:hover{border-color:var(--emerald)}.history-record-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.history-record-meta span{font-size:11px;color:var(--sub);background:var(--mint);padding:4px 7px;border-radius:7px}.history-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.history-summary-grid .stat-card{padding:10px 6px}.history-summary-grid .v{font-size:17px}.history-summary-grid .l{font-size:9px}@media(max-width:390px){.history-summary-grid{grid-template-columns:repeat(2,1fr)}}
.searchbar{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:11px; padding:9px 12px; margin-bottom:12px; background:var(--card);}
.searchbar input{border:none; padding:0; flex:1;}
.explorer-head{margin:4px 0 14px;}
.explorer-kicker{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--emerald);}
.explorer-title{font-size:22px; font-weight:800; letter-spacing:-.5px; margin:3px 0;}
.explorer-subtitle{font-size:12.5px; color:var(--sub); line-height:1.4;}
.explorer-search{padding:12px 14px; border-color:color-mix(in srgb, var(--emerald) 28%, var(--line)); box-shadow:0 2px 9px rgba(15,107,79,.06);}
.explorer-search input{font-size:15px;}
.explorer-search .search-icon{font-size:18px;}
.explorer-filter-card{padding:12px; margin-bottom:12px;}
.explorer-filter-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.explorer-filter-grid label{min-width:0;}
.explorer-filter-grid select{padding:9px 10px; font-size:13px;}
.explorer-filter-label{display:block; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin:0 0 4px 2px;}
.explorer-filter-chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.explorer-filter-chips .chip{margin:0; padding:7px 10px; font-size:12px;}
.explorer-toolbar{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:12px 0 8px;}
.explorer-toolbar-left{display:flex; align-items:center; gap:8px; min-width:0;}
.explorer-toolbar-title{font-weight:800; font-size:14px;}
.explorer-count{font-size:11.5px; color:var(--sub); white-space:nowrap;}
.explorer-select{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--sub); white-space:nowrap;}
.explorer-select input,.explorer-check input{width:18px; height:18px; accent-color:var(--emerald);}
.explorer-card{position:relative; padding:13px; margin-bottom:9px; animation:fadeUp .28s ease both;}
.explorer-card.is-selected{border-color:var(--emerald); box-shadow:0 0 0 2px color-mix(in srgb, var(--emerald) 14%, transparent);}
.explorer-card-top{display:flex; align-items:flex-start; gap:9px;}
.explorer-check{padding-top:1px; flex-shrink:0;}
.explorer-qbody{min-width:0; flex:1;}
.explorer-qtext{font-size:14px; font-weight:700; line-height:1.42; color:var(--text);}
.explorer-qmeta{display:flex; flex-wrap:wrap; gap:5px 8px; margin-top:7px; font-size:11.5px; color:var(--sub);}
.explorer-qmeta span{display:inline-flex; align-items:center; gap:3px;}
.explorer-qactions{display:flex; gap:3px; flex-wrap:wrap; justify-content:flex-end; margin-top:10px; padding-top:9px; border-top:1px solid var(--line);}
.explorer-qactions .iconbtn{font-size:16px; padding:7px 8px;}
.explorer-qactions .iconbtn.action-label{font-size:11.5px; font-weight:700; border:1px solid var(--line); padding:7px 9px; color:var(--emerald-d);}
.explorer-bookmark{color:var(--orange) !important;}
.explorer-status{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:8px; white-space:nowrap;}
.explorer-status.good{background:color-mix(in srgb, var(--green) 14%, var(--card)); color:var(--green);}
.explorer-status.bad{background:color-mix(in srgb, var(--red) 14%, var(--card)); color:var(--red);}
.explorer-status.neutral{background:var(--mint); color:var(--sub);}
.explorer-load{margin:4px 0 14px;}
.explorer-bulk{display:flex; gap:6px; flex-wrap:wrap; padding:10px 12px; background:var(--mint); border-radius:11px; margin:8px 0 12px; animation:fadeUp .2s ease;}
.explorer-bulk .btn{font-size:12px; padding:8px 10px;}
.explorer-subjects-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:22px 0 8px;}
.explorer-subjects-head .h2{margin:0;}
@media (max-width:380px){.explorer-filter-grid{grid-template-columns:1fr;}.explorer-qactions{justify-content:stretch;}.explorer-qactions .action-label{flex:1;}.explorer-title{font-size:20px;}}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-card{background:var(--mint); border-radius:12px; padding:12px;}
.stat-card .v{font-size:20px; font-weight:800; color:var(--emerald-d);}
.stat-card .l{font-size:11.5px; color:var(--sub); margin-top:2px;}
.togglerow{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line);}
.toggle{width:44px; height:26px; border-radius:20px; background:var(--line); position:relative; cursor:pointer; flex-shrink:0;}
.toggle.on{background:var(--emerald);}
.toggle .dot{width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:.15s;}
.toggle.on .dot{left:21px;}
.fab{position:fixed; right:16px; bottom:calc(90px + var(--safe-b)); width:52px; height:52px; border-radius:16px; background:var(--emerald);
  color:#fff; font-size:24px; border:none; box-shadow:0 6px 16px rgba(15,107,79,.35); z-index:25; cursor:pointer;}
.divider{height:1px; background:var(--line); margin:12px 0;}
.errbox{background:color-mix(in srgb, var(--red) 15%, var(--card)); color:var(--red); border-radius:10px; padding:9px 12px; font-size:12.5px; margin-top:6px;}
.timerbox.timer-warn{color:var(--orange);}
	.timerbox.timer-danger{color:var(--red);}
	.reveal{animation:fadeUp .25s ease;}
	@keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
	a.link{color:var(--emerald-d); text-decoration:underline;}

	/* Exam System 2.0 Styles */
	.exam-center-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
	.exam-mode-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; cursor: pointer; transition: var(--transition); }
	.exam-mode-card:active { transform: scale(0.96); }
	.exam-mode-card .icon { font-size: 24px; }
	.exam-mode-card .name { font-weight: 700; font-size: 14px; color: var(--text); }
	.exam-mode-card .desc { font-size: 11px; color: var(--sub); line-height: 1.3; }
	.exam-mode-card.active { border-color: var(--emerald); background: var(--mint); }

	.wizard-step { display: none; animation: fadeUp 0.3s ease-out both; }
	.wizard-step.active { display: block; }
	.wizard-progress { display: flex; gap: 4px; margin-bottom: 20px; }
	.wizard-dot { flex: 1; height: 4px; background: var(--line); border-radius: 2px; }
	.wizard-dot.active { background: var(--emerald); }
	.wizard-dot.complete { background: var(--emerald-d); }

	.summary-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); }
	.summary-item:last-child { border-bottom: none; }
	.summary-label { color: var(--sub); font-size: 13px; }
	.summary-value { font-weight: 700; font-size: 13px; }

	.navigator-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: flex; align-items: flex-end; }
	.navigator-panel { background: var(--card); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + var(--safe-b)); max-height: 80vh; overflow-y: auto; }

	.comparison-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 12px 0; }
	.comparison-val { text-align: center; }
	.comparison-val .label { font-size: 10px; text-transform: uppercase; color: var(--sub); margin-bottom: 2px; }
	.comparison-val .value { font-weight: 800; font-size: 16px; }
	.comparison-trend { font-size: 12px; font-weight: 700; }
	.trend-up { color: var(--green); }
	.trend-down { color: var(--red); }

	.readiness-meter { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; margin: 10px 0; }
	.readiness-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--orange), var(--green)); transition: width 1s ease-out; }

	.careless-tag { display: inline-flex; align-items: center; gap: 4px; background: #fff7ed; color: #c2410c; border: 1px solid #ffedd5; padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; }

	.time-tag { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
	.time-tag.vfast { background: #dcfce7; color: #16a34a; }
	.time-tag.normal { background: #f3f4f6; color: #4b5563; }
	.time-tag.slow { background: #fef3c7; color: #d97706; }
	.time-tag.vslow { background: #fee2e2; color: #ef4444; }

	/* Phase 2 — Result & Deep Analysis styles */
	.result-section-title{font-size:15px; font-weight:800; margin:20px 0 9px; color:var(--text);}
	.result-mini-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
	.result-mini-card{background:var(--mint); border-radius:12px; padding:11px 12px;}
	.result-mini-card .rmv{font-size:18px; font-weight:800; color:var(--emerald-d);}
	.result-mini-card .rml{font-size:11px; color:var(--sub); margin-top:2px; line-height:1.35;}
	.result-meta-chips{display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 4px;}
	.result-meta-chips .chip{font-size:10.5px; padding:5px 9px; margin:0;}
	.insight-card{background:linear-gradient(135deg, var(--mint), color-mix(in srgb, var(--emerald) 10%, var(--mint))); border:1px solid color-mix(in srgb, var(--emerald) 22%, var(--line)); border-radius:14px; padding:14px; margin-bottom:16px;}
	.insight-card .insight-icon{font-size:18px; margin-right:6px;}
	.time-bars{display:flex; flex-direction:column; gap:7px; margin-top:10px;}
	.time-bar-row{display:flex; align-items:center; gap:8px; font-size:11.5px;}
	.time-bar-row .tqnum{width:30px; font-weight:800; color:var(--sub); flex-shrink:0;}
	.time-bar-row .tqbar{flex:1; height:10px; background:var(--mint); border-radius:6px; overflow:hidden;}
	.time-bar-row .tqbar>div{height:100%; border-radius:6px; background:var(--emerald);}
	.time-bar-row .tqbar>div.slow{background:var(--red);}
	.time-bar-row .tqbar>div.mid{background:var(--orange);}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ============================================================
   MY ADMISSION HUB - core app
   ============================================================ */

/* ---------------- utils ---------------- */
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
function todayKey(d){d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(ts){const d=new Date(ts); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();}
function fmtTime(sec){sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60); const s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
function round2(n){return Math.round(n*100)/100;}
function debounce(fn,ms){let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);};}

/* ---------------- IndexedDB layer ---------------- */
const DB_NAME='admissionHubDB', DB_VERSION=2;
const STORES=['appMeta','subjects','topics','questions','exams','examResults','mistakes','vocabulary','dailyStats','activityLogs','settings'];
let DB=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded=(e)=>{
      const db=e.target.result;
      STORES.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          const store=db.createObjectStore(name,{keyPath:'id'});
          if(name==='questions'){store.createIndex('subjectId','subjectId'); store.createIndex('topicId','topicId');}
          if(name==='topics'){store.createIndex('subjectId','subjectId');}
          if(name==='examResults'){store.createIndex('date','date');}
          if(name==='mistakes'){store.createIndex('questionId','questionId');}
        }
      });
    };
    req.onsuccess=(e)=>{DB=e.target.result; resolve(DB);};
    req.onerror=(e)=>reject(e.target.error);
  });
}
function tx(store,mode='readonly'){return DB.transaction(store,mode).objectStore(store);}
function dbGetAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
function dbGet(store,id){return new Promise((res,rej)=>{const r=tx(store).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
function dbPut(store,obj){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error);});}
function dbDel(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);});}
function dbClear(store){return new Promise((res,rej)=>{const r=tx(store,'readwrite').clear(); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);});}
async function dbPutMany(store,arr){for(const o of arr) await dbPut(store,o); return true;}

/* ---------------- in-memory cache (mirrors DB, refreshed on write) ---------------- */
const CACHE={subjects:[],topics:[],questions:[],exams:[],examResults:[],mistakes:[],vocabulary:[],dailyStats:[],activityLogs:[],settings:{}};

function normalizeExamResult(r){
  if(!r) return r;
  const count=Number(r.questionCount||r.totalQuestions||(r.snapshot||[]).length||0);
  const time=Number(r.timeUsed||r.totalTime||0);
  const correct=Number(r.correct||0), wrong=Number(r.wrong||0), skipped=Number(r.skipped||0);
  return {...r,
    questionCount:count, totalQuestions:count, timeUsed:time, totalTime:time,
    averageTimePerQuestion:Number(r.averageTimePerQuestion??r.avgTimePerQuestion??(time/Math.max(1,count))),
    avgTimePerQuestion:Number(r.avgTimePerQuestion??r.averageTimePerQuestion??(time/Math.max(1,count))),
    negativeMarks:Number(r.negativeMarks??r.negative??0),
    negative:Number(r.negative??r.negativeMarks??0),
    accuracy:Number(r.accuracy??((correct+wrong)?correct/(correct+wrong)*100:0)),
    subjects:Array.isArray(r.subjects)?r.subjects:[], topics:Array.isArray(r.topics)?r.topics:[],
    snapshot:Array.isArray(r.snapshot)?r.snapshot:[],
    subjectBreakdown:r.subjectBreakdown||null, topicBreakdown:r.topicBreakdown||null,
    timeAnalysis:r.timeAnalysis||null,
    positive:Number(r.positive??0), score:Number(r.score??0), attemptRate:Number(r.attemptRate??0),
    testType:r.testType||((r.configuration&&r.configuration.testType)||((r.configuration&&r.configuration.mistakeRevision)?'mistake':(r.mode==='mock'?'mock':'flash')))
  };
}
function examTypeLabel(r){
  const t=normalizeExamResult(r).testType;
  return ({mock:'Mock Test',flash:'Flash Test',mistake:'Mistake Test',weak:'Weak Topic Test',custom:'Custom Test'})[t]||((r.mode||'flash').toUpperCase()+' TEST');
}
async function loadCache(){
  CACHE.subjects=await dbGetAll('subjects');
  CACHE.topics=await dbGetAll('topics');
  CACHE.questions=await dbGetAll('questions');
  CACHE.exams=await dbGetAll('exams');
  CACHE.examResults=(await dbGetAll('examResults')).map(normalizeExamResult);
  CACHE.mistakes=await dbGetAll('mistakes');
  CACHE.vocabulary=await dbGetAll('vocabulary');
  CACHE.dailyStats=await dbGetAll('dailyStats');
  CACHE.activityLogs=await dbGetAll('activityLogs');
  const s=await dbGetAll('settings');
  CACHE.settings=(s&&s[0])?s[0]:defaultSettings();
}

function defaultSettings(){
  return {id:'main', theme:'light', animation:'on', sound:'off', feedback:'visual',
    dailyTarget:100, examDefaults:{count:20,duration:20,negative:0,mode:'mock'},
    qPrefs:{showExplanation:true,showQNumber:true,randomizeQ:false,randomizeOpt:false,oneScreen:true}};
}

/* ---------------- seed default data (only if empty) ---------------- */
async function seedIfEmpty(){
  const subs=await dbGetAll('subjects');
  const meta=await dbGet('appMeta','flags');
  if(subs.length===0 && !meta){
    const defaults=[
      {name:'বাংলা', icon:'📘', color:'#0f6b4f'},
      {name:'English', icon:'📗', color:'#0b4f3b'},
      {name:'GK', icon:'🌍', color:'#c98a2c'},
      {name:'IBA / Math', icon:'🧮', color:'#5b6bd6'}
    ];
    let order=0;
    for(const d of defaults){
      await dbPut('subjects',{id:uid(), name:d.name, icon:d.icon, color:d.color, order:order++, createdAt:Date.now()});
    }
  }
  if(!meta){ await dbPut('appMeta',{id:'flags', seeded:true, createdAt:Date.now()}); }
  if(!(await dbGet('settings','main'))){ await dbPut('settings', defaultSettings()); }
}

/* ---------------- activity / streak logging ---------------- */
async function logActivity(kind, count){
  const key=todayKey();
  let ds=CACHE.dailyStats.find(d=>d.id===key);
  if(!ds){ds={id:key,date:key,questions:0,correct:0,wrong:0,exams:0,timeMs:0};}
  await dbPut('dailyStats', ds);
  CACHE.dailyStats=await dbGetAll('dailyStats');
}

/* ================= ROUTER ================= */
const Router={ path:'dashboard', params:{}, };
function navigate(path){
  Router.path=path;
  location.hash=path;
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{
  Router.path=location.hash.slice(1)||'dashboard';
  render();
});

/* ================= APP SHELL ================= */
const NAV_TABS=[
  {key:'dashboard', icon:'🏠', label:'Home'},
  {key:'question-bank', icon:'📚', label:'Bank'},
  {key:'exam', icon:'📝', label:'Exam'},
  {key:'history', icon:'📋', label:'History'},
  {key:'progress', icon:'📊', label:'Progress'},
];

function baseTab(path){
  if(path.startsWith('ai-chat')) return 'history';
  if(path.startsWith('exam')) return 'exam';
  if(path.startsWith('question-bank')||path.startsWith('subject')||path.startsWith('topic')||path.startsWith('question')||path.startsWith('add-question')||path.startsWith('edit-question')) return 'question-bank';
  if(path.startsWith('history')) return 'exam';
  if(path.startsWith('progress')) return 'progress';
  return 'dashboard';
}

function renderShell(innerHtml, opts){
  opts=opts||{};
  const app=document.getElementById('app');
  const activeTab=baseTab(Router.path);
  const showNav = !opts.hideNav;
  app.classList.toggle('no-nav', !!opts.hideNav);
  app.innerHTML = `
    ${opts.topbar!==false ? topbarHtml(opts) : ''}
    <div class="page">${innerHtml}</div>
    ${showNav ? bottomNavHtml(activeTab) : ''}
  `;
}
function topbarHtml(opts){
  return `<div class="topbar">
    ${opts.back ? `<button class="backbtn" onclick="${opts.back}">←</button>` : ''}
    <h1>${opts.title||''}</h1>
    ${(opts.actions||[]).join('')}
  </div>`;
}
function bottomNavHtml(active){
  return `<div class="bottomnav">
    ${NAV_TABS.map(t=>`<button class="navbtn ${active===t.key?'active':''}" onclick="navigate('${t.key}')">
      <span class="ic">${t.icon}</span><span>${t.label}</span></button>`).join('')}
  </div>`;
}
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function confirmModal(title, body, onYes, yesLabel, danger){
  openModal(`<h3>${esc(title)}</h3><p class="muted">${body}</p>
    <div class="row" style="margin-top:14px;">
      <button class="btn ghost" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn ${danger?'danger':''}" style="flex:1" id="confirmYesBtn">${yesLabel||'Confirm'}</button>
    </div>`);
  document.getElementById('confirmYesBtn').onclick=()=>{closeModal(); onYes();};
}

/* ================= RENDER DISPATCH ================= */
function render(){
  const p=Router.path;
  if(p==='dashboard') return renderDashboard();
  if(p==='question-bank') return renderQuestionBank();
  if(p==='question-bank/orphans') return renderOrphanExplorer();
  if(p.startsWith('question-bank/subject/')) return renderSubjectDetail(p.split('/')[2]);
  if(p.startsWith('question-bank/topic/')) return renderTopicDetail(p.split('/')[2]);
  if(p.startsWith('question/')) return renderQuestionDetail(p.split('/')[1]);
  if(p==='add-question') return renderQuestionForm(null);
  if(p.startsWith('edit-question/')) return renderQuestionForm(p.split('/')[1]);
  if(p==='import-questions') return renderImportQuestions();
  if(p==='exam') return renderExamCenter();
  if(p==='exam/setup') return renderExamSetup();
  if(p==='exam/running') return renderExamRunning();
  if(p==='exam/result') return renderExamResult();
  if(p==='history') return renderHistory();
  if(p.startsWith('history/')) return renderHistoryDetail(p.split('/')[1]);
  if(p==='mistakes') return renderMistakes();
  if(p==='ai-chat') return renderAIChat();
  if(p==='progress') return renderProgress();
  if(p==='vocabulary') return renderVocabulary();
  if(p==='settings') return renderSettings();
  renderDashboard();
}

/* ================= DASHBOARD ================= */
function getStudyTimeToday(){
  const key=todayKey();
  let total=0;
  CACHE.examResults.forEach(r=>{
    if(todayKey(new Date(r.date))===key) total += (r.timeUsed||0);
  });
  return total;
}

function getSmartFocusTopics(){
  const topicStats = {};
  CACHE.examResults.forEach(r => {
    (r.snapshot || []).forEach(q => {
      if (!topicStats[q.topicId]) topicStats[q.topicId] = { correct: 0, total: 0, name: topicName(q.topicId) };
      topicStats[q.topicId].total++;
      if (q.status === 'correct') topicStats[q.topicId].correct++;
    });
  });

  const mistakes = {};
  CACHE.mistakes.forEach(m => {
    const q = CACHE.questions.find(x => x.id === m.questionId);
    if (q) {
      if (!mistakes[q.topicId]) mistakes[q.topicId] = 0;
      mistakes[q.topicId] += m.wrongCount;
    }
  });

  const results = Object.keys(topicStats).map(tid => {
    const s = topicStats[tid];
    const acc = s.total > 0 ? (s.correct / s.total) * 100 : 0;
    const mCount = mistakes[tid] || 0;
    let status = 'strong', label = 'Strong', cls = 'strong';
    if (acc < 60 || mCount > 5) { status = 'revision'; label = 'Needs Revision'; cls = 'revision'; }
    else if (acc < 85 || mCount > 2) { status = 'improving'; label = 'Improving'; cls = 'improving'; }
    return { id: tid, name: s.name, acc, mCount, status, label, cls };
  });

  return results.sort((a, b) => {
    if (a.status === 'revision' && b.status !== 'revision') return -1;
    if (a.status !== 'revision' && b.status === 'revision') return 1;
    return b.mCount - a.mCount;
  }).slice(0, 3);
}

async function getUnfinishedExam(){
  return await checkResumableExam();
}

function computeLifetimeStats(){
  const results=CACHE.examResults;
  const totalQuestions=CACHE.questions.length;
  let attempted=0, correct=0, wrong=0, skipped=0, exams=results.length, mock=0, flash=0, points=0, negPoints=0;
  let best=0, bestAcc=0, sumScore=0, sumAcc=0, accCount=0;
  results.forEach(r=>{
    attempted += (r.correct+r.wrong);
    correct += r.correct; wrong += r.wrong; skipped += r.skipped;
    if(r.mode==='mock') mock++; else flash++;
    points += r.positive; negPoints += r.negative;
    sumScore += r.score;
    if(r.score>best) best=r.score;
    if((r.correct+r.wrong)>0){ const a=r.correct/(r.correct+r.wrong)*100; sumAcc+=a; accCount++; if(a>bestAcc) bestAcc=a; }
  });
  const accuracy = (correct+wrong)>0 ? round2(correct/(correct+wrong)*100) : 0;
  const avgScore = exams>0 ? round2(sumScore/exams) : 0;
  return {totalQuestions, attempted, correct, wrong, skipped, exams, mock, flash, points:round2(points), negPoints:round2(negPoints), accuracy, avgScore, best:round2(best), bestAcc:round2(bestAcc)};
}
function computeStreak(){
  const days=new Set(CACHE.activityLogs.map(a=>a.day));
  CACHE.examResults.forEach(r=>days.add(todayKey(new Date(r.date))));
  let streak=0; let d=new Date();
  while(true){
    const key=todayKey(d);
    if(days.has(key)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function subjectPerformance(){
  const map={};
  CACHE.subjects.forEach(s=>map[s.id]={name:s.name, icon:s.icon, correct:0, wrong:0});
  CACHE.examResults.forEach(r=>{
    (r.snapshot||[]).forEach(q=>{
      if(!map[q.subjectId]) return;
      if(q.status==='correct') map[q.subjectId].correct++;
      else if(q.status==='wrong') map[q.subjectId].wrong++;
    });
  });
  return Object.values(map).map(s=>({...s, acc: (s.correct+s.wrong)>0 ? round2(s.correct/(s.correct+s.wrong)*100) : null}))
    .filter(s=>s.acc!==null).sort((a,b)=>b.acc-a.acc);
}

function topicQCount(topId){return CACHE.questions.filter(q=>q.topicId===topId).length;}
function topicsOf(subId){return CACHE.topics.filter(t=>t.subjectId===subId).sort((a,b)=>a.order-b.order);}

const ExplorerState={
  query:'', subjectId:'', topicId:'', status:'all', difficulty:'all',
  bookmarked:false, mistakes:false, recentlyAdded:false, sort:'newest',
  visibleCount:40, selected:new Set()
};
function explorerStats(q){return q.stats||{attempts:0,correct:0,wrong:0};}
function explorerMistake(q){
  const st=explorerStats(q);
  return st.wrong>0 || CACHE.mistakes.some(m=>m.questionId===q.id && (m.wrongCount||0)>0);
}
function explorerMostRecent(q){
  const m=CACHE.mistakes.find(x=>x.questionId===q.id);
  return Math.max(q.createdAt||0,q.updatedAt||0,m&&m.lastWrongAt||0);
}
function explorerMatchesSearch(q){
  const term=(ExplorerState.query||'').trim().toLowerCase();
  if(!term) return true;
  const hay=[q.question,...(q.options||[]),q.explanation,subjectName(q.subjectId),topicName(q.topicId),...(q.tags||[]),...(q.keywords||[])];
  return hay.some(v=>String(v||'').toLowerCase().includes(term));
}
function explorerFilterAndSort(){
  const now=Date.now(), recentCutoff=now-30*24*60*60*1000;
  let rows=CACHE.questions.filter(q=>{
    const st=explorerStats(q);
    if(!explorerMatchesSearch(q)) return false;
    if(ExplorerState.subjectId && q.subjectId!==ExplorerState.subjectId) return false;
    if(ExplorerState.topicId && q.topicId!==ExplorerState.topicId) return false;
    if(ExplorerState.status==='correct' && !(st.correct>0)) return false;
    if(ExplorerState.status==='wrong' && !(st.wrong>0)) return false;
    if(ExplorerState.status==='unattempted' && (st.attempts>0)) return false;
    if(ExplorerState.difficulty!=='all' && (q.difficulty||'medium')!==ExplorerState.difficulty) return false;
    if(ExplorerState.bookmarked && q.bookmarked!==true) return false;
    if(ExplorerState.mistakes && !explorerMistake(q)) return false;
    if(ExplorerState.recentlyAdded && (q.createdAt||0)<recentCutoff) return false;
    return true;
  });
  const alpha=(q)=>String(q.question||'').toLocaleLowerCase();
  rows.sort((a,b)=>{
    const sa=explorerStats(a), sb=explorerStats(b), ma=explorerMistake(a)?Math.max(sa.wrong||0,CACHE.mistakes.find(m=>m.questionId===a.id)?.wrongCount||0):0, mb=explorerMistake(b)?Math.max(sb.wrong||0,CACHE.mistakes.find(m=>m.questionId===b.id)?.wrongCount||0):0;
    let n=0;
    if(ExplorerState.sort==='oldest') n=(a.createdAt||0)-(b.createdAt||0);
    else if(ExplorerState.sort==='alphabetical') n=alpha(a).localeCompare(alpha(b));
    else if(ExplorerState.sort==='most-attempted') n=(sb.attempts||0)-(sa.attempts||0);
    else if(ExplorerState.sort==='least-attempted') n=(sa.attempts||0)-(sb.attempts||0);
    else if(ExplorerState.sort==='most-mistakes') n=mb-ma;
    else n=(b.createdAt||0)-(a.createdAt||0);
    return n || String(a.id).localeCompare(String(b.id));
  });
  return rows;
}

async function saveQuestionForm(qid){
  const subjectId=document.getElementById('qfSubject').value;
  const topicId=document.getElementById('qfTopic').value;
  const question=document.getElementById('qfQuestion').value.trim();
  const options=[0,1,2,3].map(i=>document.getElementById('qfOpt'+i).value.trim());
  const answer=parseInt(document.getElementById('qfAnswer').value);
  const explanation=document.getElementById('qfExplain').value.trim();
  const tags=document.getElementById('qfTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const difficulty=document.getElementById('qfDiff').value;
  if(!question || options.some(o=>!o) || !topicId){toast('Please fill question, 4 options and select a topic'); return;}
  if(qid){
    const q=CACHE.questions.find(x=>x.id===qid);
    Object.assign(q,{subjectId,topicId,question,options,answer,explanation,tags,difficulty,updatedAt:Date.now()});
    await dbPut('questions',q);
  } else {
    await dbPut('questions',{id:uid(),subjectId,topicId,question,options,answer,explanation,tags,difficulty,
      source:'manual', createdAt:Date.now(), updatedAt:Date.now(), stats:{attempts:0,correct:0,wrong:0}});
  }
  CACHE.questions=await dbGetAll('questions');
  toast('Question saved');
  navigate('question-bank');
}

/* ================= BULK QUESTION IMPORT / PARSER =================
   Additive module — reuses the existing 'questions' store and schema.
   Imported questions are saved with dbPut('questions', {...}) using the
   exact same object shape as saveQuestionForm() above, so they behave
   identically to manually-added questions everywhere in the app. */

let ImportState = {

/* ---------- Parsers ---------- */
function letterToIndex(ch){
  if(!ch) return null;
  const m={'A':0,'B':1,'C':2,'D':3,'ক':0,'খ':1,'গ':2,'ঘ':3};
  const up=ch.trim();
  if(m[up]!==undefined) return m[up];
  const upC=up.toUpperCase();
  if(m[upC]!==undefined) return m[upC];
  return null;
}
function resolveAnswerIndex(raw, options){
  if(raw===null || raw===undefined) return null;
  if(typeof raw==='number') return (raw>=0&&raw<=3)? raw : null;
  const trimmed=String(raw).trim().replace(/^\(|\)$/g,'');
  if(trimmed.length<=2){
    const idx=letterToIndex(trimmed);
    if(idx!==null) return idx;
  }
  const norm=s=>(s||'').trim().toLowerCase().replace(/\s+/g,' ');
  const t=norm(trimmed);
  for(let i=0;i<options.length;i++){ if(options[i] && norm(options[i])===t) return i; }
  const m=trimmed.match(/^([A-Dকখগঘ])/);
  if(m) return letterToIndex(m[1]);
  return null;
}
function hasContent(arr){return arr.some(l=>l.trim().length>0);}

function splitQuestionBlocks(text){
  const lines=text.split(/\r?\n/);
  const headerRe=/^\s*(?:Q(?:uestion)?\.?\s*\d+\s*[:.\)]?|\d+\s*[\.\)])\s*(.*)$/i;
  const blocks=[]; let current=null;
  for(const line of lines){
    const m=line.match(headerRe);
    if(m && (current===null || hasContent(current))){
      if(current) blocks.push(current);
      current=[];
      if(m[1] && m[1].trim()) current.push(m[1].trim());
      continue;
    }
    if(current===null) current=[];
    current.push(line);
  }
  if(current) blocks.push(current);
  return blocks.filter(hasContent);
}
function parseTextBlock(lines){
  const optRe=/^\s*([A-Da-dকখগঘ])\s*[\.\)\-:]\s*(.+)$/;
  const ansRe=/^\s*(?:Correct\s*Answer|Answer|Correct|Ans|উত্তর|সঠিক\s*উত্তর)\s*[:=]\s*(.+?)\s*$/i;
  const expRe=/^\s*(?:Explanation|ব্যাখ্যা|Explain)\s*[:=]\s*(.*)$/i;
  let qLines=[], options={}, answerRaw=null, explanationLines=[], mode='question';
  for(let raw of lines){
    const line=(raw||'').trim();
    if(!line) continue;
    const om=line.match(optRe);
    if(om && mode!=='explanation'){
      const idx=letterToIndex(om[1]);
      if(idx!==null) options[idx]=om[2].trim();
      mode='options'; continue;
    }
    const am=line.match(ansRe);
    if(am){ answerRaw=am[1].trim().replace(/^\(|\)$/g,''); mode='answer'; continue; }
    const em=line.match(expRe);
    if(em){ explanationLines.push(em[1]); mode='explanation'; continue; }
    if(mode==='explanation'){ explanationLines.push(line); continue; }
    qLines.push(line);
  }
  const optionsArr=[0,1,2,3].map(i=>options[i]||'');
  return {
    question: qLines.join(' ').trim(),
    options: optionsArr,
    answerIndex: resolveAnswerIndex(answerRaw, optionsArr),
    explanation: explanationLines.join(' ').trim(),
    tags:[], subjectName:null, topicName:null
  };
}
function parseBulkText(text){
  let blocks=splitQuestionBlocks(text);
  if(blocks.length<=1){
    const paras=text.split(/\n\s*\n+/).map(p=>p.split(/\r?\n/)).filter(hasContent);
    if(paras.length>1) blocks=paras;
  }
  return blocks.map(parseTextBlock);
}

function parseJSONText(text){
  let data;
  try{ data=JSON.parse(text); }
  catch(e){ return {error:'⚠️ Invalid JSON — please check the format and try again.'}; }
  let arr = Array.isArray(data) ? data : (Array.isArray(data.questions) ? data.questions : null);
  if(!arr) return {error:'⚠️ JSON must be an array of questions.'};
  const items = arr.map(item=>{
    if(!item || typeof item!=='object') return null;
    const question = item.question || item.q || item.text || '';
    let options;
    if(Array.isArray(item.options)) options=item.options.slice(0,4);
    else if(item.options && typeof item.options==='object') options=['A','B','C','D'].map(k=>item.options[k]!==undefined?item.options[k]:(item.options[k.toLowerCase()]||''));
    else options=['','','',''];
    while(options.length<4) options.push('');
    const answerRaw = item.answer!==undefined?item.answer : item.correctAnswer!==undefined?item.correctAnswer :
      item.correct_answer!==undefined?item.correct_answer : item.correct!==undefined?item.correct : null;
    const explanation = item.explanation || item.explain || '';
    const tags = Array.isArray(item.tags) ? item.tags : [];
    return {
      question: String(question||'').trim(),
      options: options.map(o=>String(o==null?'':o).trim()),
      answerIndex: resolveAnswerIndex(answerRaw, options),
      explanation: String(explanation||'').trim(),
      tags, subjectName: item.subject||item.subjectName||null, topicName: item.topic||item.topicName||null
    };
  }).filter(Boolean);
  return {items};
}

function htmlToText(node){
  const clone=node.cloneNode(true);
  clone.querySelectorAll('br').forEach(br=>br.replaceWith('\n'));
  clone.querySelectorAll('p,div,li,h1,h2,h3,h4,tr,section').forEach(el=>{ el.insertAdjacentText('afterend','\n'); });
  return clone.textContent;
}
function parseHTMLDoc(htmlStr){
  const doc=new DOMParser().parseFromString(htmlStr,'text/html');
  const containers=Array.from(doc.querySelectorAll('.question,.mcq,.quiz-question,[class*="question"]'));
  if(containers.length===0){
    return parseBulkText(htmlToText(doc.body));
  }
  return containers.map(c=>parseTextBlock(htmlToText(c).split('\n')));
}

/* ---------- Validation / dedup ---------- */
function normalizeQ(s){ return (s||'').trim().toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,'').replace(/\s+/g,' ').trim(); }
function buildValidated(raws){
  const existingQuestions = CACHE.questions.map(q=>({norm:normalizeQ(q.question), id:q.id}));
  const seen=[];
  const validated = raws.map(raw=>{
    raw.options=(raw.options||['','','','']).slice(0,4); while(raw.options.length<4) raw.options.push('');
    if(raw.answerIndex===undefined) raw.answerIndex=null;
    const issues=[];
    if(!raw.question || !raw.question.trim()) issues.push('Question text missing');
    ['A','B','C','D'].forEach((L,i)=>{ if(!raw.options[i] || !raw.options[i].trim()) issues.push('Option '+L+' missing'); });
    if(raw.answerIndex===null || raw.answerIndex<0 || raw.answerIndex>3) issues.push('Missing/invalid correct answer');
    const infoOnly=[];
    if(!raw.explanation || !raw.explanation.trim()) infoOnly.push('Explanation missing');
    const norm=normalizeQ(raw.question||'');
    let isDuplicate=false, duplicateId=null;
    if(norm){
      const existing = existingQuestions.find(eq=>eq.norm===norm);
      if(seen.includes(norm)||existing) isDuplicate=true;
      if(existing) duplicateId=existing.id;
      seen.push(norm);
    }
    let matchedSubjectId=null, matchedTopicId=null;
    if(raw.subjectName){
      const s=CACHE.subjects.find(s=>s.name.trim().toLowerCase()===String(raw.subjectName).trim().toLowerCase());
      if(s){ matchedSubjectId=s.id;
        if(raw.topicName){ const t=CACHE.topics.find(t=>t.subjectId===s.id && t.name.trim().toLowerCase()===String(raw.topicName).trim().toLowerCase()); if(t) matchedTopicId=t.id; }
      }
    }
    return {raw, issues, infoOnly, isDuplicate, duplicateId, matchedSubjectId, matchedTopicId, status: issues.length?'invalid':'valid', selected:true};
  });
  ImportState.validated=validated;
  ImportState.visibleCount=20;
  const subs=[...CACHE.subjects].sort((a,b)=>a.order-b.order);
  if(!ImportState.destSubjectId) ImportState.destSubjectId = subs[0]? subs[0].id : '';
  const topics=topicsOf(ImportState.destSubjectId);
  if(!ImportState.destTopicId || !topics.find(t=>t.id===ImportState.destTopicId)) ImportState.destTopicId = topics[0]? topics[0].id : '';
}
function reValidateOne(idx){
  const v=ImportState.validated[idx]; const raw=v.raw;
  const issues=[];
  if(!raw.question || !raw.question.trim()) issues.push('Question text missing');
  ['A','B','C','D'].forEach((L,i)=>{ if(!raw.options[i] || !raw.options[i].trim()) issues.push('Option '+L+' missing'); });
  if(raw.answerIndex===null || raw.answerIndex<0 || raw.answerIndex>3) issues.push('Missing/invalid correct answer');
  v.issues=issues; v.status=issues.length?'invalid':'valid';
}

/* ---------- Save (chunked, non-blocking) ---------- */
async function saveImportedQuestions(){
  const st=ImportState;
  if(!st.destTopicId){ toast('Select a destination topic'); return; }
  const toSave = st.validated.filter(v=> v.selected && v.status==='valid' && (st.dupStrategy!=='skip' || !v.isDuplicate));
  if(toSave.length===0){ toast('No questions to save'); return; }
  openModal(`<h3>Importing…</h3>
    <div class="progbar"><div id="impProgFill" style="width:0%"></div></div>
    <div class="muted" id="impProgLabel" style="margin-top:8px;">0 / ${toSave.length}</div>`);
  let saved=0;
  for(const v of toSave){
    const subjectId = (st.useIndividual && v.matchedSubjectId) ? v.matchedSubjectId : st.destSubjectId;
    const topicId = (st.useIndividual && v.matchedTopicId) ? v.matchedTopicId : st.destTopicId;

    let targetId = uid();
    let existing = null;
    if(v.isDuplicate && st.dupStrategy==='replace' && v.duplicateId){
      targetId = v.duplicateId;
      existing = CACHE.questions.find(q=>q.id===targetId);
    }

    const obj={
      id: targetId, subjectId, topicId,
      question: v.raw.question.trim(),
      options: v.raw.options.map(o=>o.trim()),
      answer: v.raw.answerIndex,
      explanation: (v.raw.explanation||'').trim(),
      tags: v.raw.tags||[], difficulty: existing? (existing.difficulty||'medium') : 'medium',
      source: 'import', createdAt: existing? (existing.createdAt||Date.now()) : Date.now(), updatedAt: Date.now(),
      stats: existing? (existing.stats||{attempts:0,correct:0,wrong:0}) : {attempts:0,correct:0,wrong:0},
      bookmarked: existing? !!existing.bookmarked : false
    };
    try{ await dbPut('questions', obj); saved++; }
    catch(e){ console.error(e); }
    if(saved % 20 === 0 || saved===toSave.length){
      const fill=document.getElementById('impProgFill'); const lbl=document.getElementById('impProgLabel');
      if(fill) fill.style.width = Math.round((saved/toSave.length)*100)+'%';
      if(lbl) lbl.textContent = saved+' / '+toSave.length;
      await new Promise(r=>setTimeout(r,0));
    }
  }
  CACHE.questions = await dbGetAll('questions');
  try{
    await dbPut('activityLogs',{id:uid(), day:todayKey(), ts:Date.now(), type:'import', source:st.mode, count:saved});
    CACHE.activityLogs = await dbGetAll('activityLogs');
  }catch(e){}
  closeModal();
  st.lastSavedCount=saved;
  st.lastSkippedCount=st.validated.filter(v=>v.selected && v.status==='valid' && v.isDuplicate && st.dupStrategy==='skip').length;
  st.lastWarningCount=st.validated.filter(v=>v.infoOnly&&v.infoOnly.length).length;
  st.lastSubjectId=st.destSubjectId; st.lastTopicId=st.destTopicId;
  importSetScreen('success');
}

function countAvailable(){
  const st=ExamSetup;
  let pool=CACHE.questions;
  if(st.onlyQuestionIds && st.onlyQuestionIds.length) pool=pool.filter(q=>st.onlyQuestionIds.includes(q.id));
  else if(st.topicIds.length>0) pool=pool.filter(q=>st.topicIds.includes(q.topicId));
  else if(st.subjectIds.length>0) pool=pool.filter(q=>st.subjectIds.includes(q.subjectId));
  return pool.length;
}
function weakTopicIds(){
  const by={};
  CACHE.questions.forEach(q=>{const st=q.stats||{}; const attempts=st.attempts||0; if(!by[q.topicId]) by[q.topicId]={attempts:0,correct:0}; by[q.topicId].attempts+=attempts; by[q.topicId].correct+=st.correct||0;});
  return Object.entries(by).filter(([,v])=>v.attempts>0).sort((a,b)=>(a[1].correct/Math.max(1,a[1].attempts))-(b[1].correct/Math.max(1,b[1].attempts))).map(([id])=>id);
}
function selectQuestionsByMode(pool,mode,count){
  const attempts=q=>(q.stats&&q.stats.attempts)||0;
  const wrong=q=>(q.stats&&q.stats.wrong)||0 || (CACHE.mistakes.find(m=>m.questionId===q.id)?.wrongCount||0);
  const sortNewest=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
  let candidates=[...pool];
  if(mode==='newest') candidates.sort(sortNewest);
  else if(mode==='unattempted') candidates=candidates.filter(q=>attempts(q)===0).concat(candidates.filter(q=>attempts(q)>0).sort(sortNewest));
  else if(mode==='wrong') candidates=candidates.filter(q=>wrong(q)>0).concat(candidates.filter(q=>wrong(q)===0).sort(sortNewest));
  else if(mode==='bookmarked') candidates=candidates.filter(q=>q.bookmarked===true).concat(candidates.filter(q=>!q.bookmarked).sort(sortNewest));
  else if(mode==='weak') {const weak=new Set(weakTopicIds()); candidates.sort((a,b)=>{const aw=weak.has(a.topicId)?0:1,bw=weak.has(b.topicId)?0:1; return aw-bw||wrong(b)-wrong(a);});}
  else if(mode==='mixed'){
    const groups=[candidates.filter(q=>attempts(q)===0),candidates.filter(q=>wrong(q)>0),candidates.filter(q=>q.bookmarked===true),shuffleArr(candidates)];
    const seen=new Set(); candidates=[]; let round=0; while(candidates.length<pool.length && round<pool.length*2){const g=groups[round%groups.length]; const q=g[Math.floor(round/groups.length)]; if(q&&!seen.has(q.id)){seen.add(q.id); candidates.push(q);} round++;}
  } else candidates=shuffleArr(candidates);
  return candidates.slice(0,count);
}
function startExamFor(subjectIds, topicIds){
  ExamSetup=freshSetup();
  ExamSetup.subjectIds=subjectIds||[]; ExamSetup.topicIds=topicIds||[];
  ExamSetup.wizardStep = 1; // Skip center, start at Type
  navigate('exam/setup');
}
function shuffleArr(a){const arr=[...a]; for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];} return arr;}

async function beginExam(){
  const st=ExamSetup;
  let pool=CACHE.questions;
  if(st.onlyQuestionIds && st.onlyQuestionIds.length) pool=pool.filter(q=>st.onlyQuestionIds.includes(q.id));
  else if(st.mode==='mistake') {
    const qids=CACHE.mistakes.map(m=>m.questionId);
    pool=pool.filter(q=>qids.includes(q.id));
  }
  else if(st.topicIds.length>0) pool=pool.filter(q=>st.topicIds.includes(q.topicId));
  else if(st.subjectIds.length>0) pool=pool.filter(q=>st.subjectIds.includes(q.subjectId));
  if(pool.length===0){toast('No questions available for this selection'); return;}
  let selected=[];
  const distributionTopicIds = st.distribution==='custom' ? (st.topicIds.length ? st.topicIds : [...new Set(pool.map(q=>q.topicId))]) : [];
  const requestedCount = st.distribution==='custom' ? distributionTopicIds.reduce((sum,topicId)=>sum+(parseInt(st.customCounts[topicId])||0),0) : st.totalCount;
  if(requestedCount<=0){toast('Choose at least one question in the custom distribution'); return;}
  if(st.distribution==='custom' && distributionTopicIds.length){
    const used=new Set();
    distributionTopicIds.forEach(topicId=>{
      const want=Math.max(0,parseInt(st.customCounts[topicId])||0);
      const topicPool=pool.filter(q=>q.topicId===topicId && !used.has(q.id));
      selectQuestionsByMode(topicPool,st.selectionMode||'random',want).forEach(q=>{if(!used.has(q.id)){used.add(q.id); selected.push(q);}});
    });
    if(selected.length<requestedCount) selectQuestionsByMode(pool.filter(q=>!used.has(q.id)),st.selectionMode||'random',requestedCount-selected.length).forEach(q=>selected.push(q));
  } else {
    selected=selectQuestionsByMode(pool,st.selectionMode|| (st.randomizeQ?'random':'newest'),Math.min(requestedCount,pool.length));
  }
  selected = selected.slice(0, Math.min(requestedCount, selected.length));

  const questions = selected.map(q=>{
    let optOrder=[0,1,2,3];
    if(st.randomizeOpt) optOrder=shuffleArr(optOrder);
    return {id:q.id, subjectId:q.subjectId, topicId:q.topicId, question:q.question,
      options:optOrder.map(i=>q.options[i]), answerIndex: optOrder.indexOf(q.answer),
      explanation:q.explanation||'', optOrder};
  });

  const startTime=Date.now();
  const durationSec = (st.mode==='mock' && st.duration > 0) ? st.duration*60 : null;
  const exam={
    id:uid(), mode:st.mode, questionIds:questions.map(q=>q.id), questions,
    currentIndex:0, selectedAnswers:{}, startTime,
    duration: durationSec,
    endTime: durationSec ? (startTime + durationSec*1000) : null,
    negative: (st.mode==='mock' || st.mode==='custom') ? st.negative : 0,
    status:'running', isSubmitting:false, configuration:{...st},
    bookmarks: new Set(),
    flags: new Set(),
    timing: {}, // qid -> {ms, startedAt, answeredAt}
    questionStartedAt:Object.fromEntries(questions.map(q=>[q.id,startTime])),
    flashResults:{} // for flash mode: qid -> {correct:bool}
  };
  await dbPut('exams', exam);
  CACHE.exams=await dbGetAll('exams');
  ActiveExam=exam;
  startTimerLoop();
  navigate('exam/running');
}

    return e;
  }
  return null;
}
function computeRemaining(exam){
  if(!exam || exam.mode!=='mock' || !exam.endTime) return null;
  return Math.max(0, Math.ceil((exam.endTime - Date.now())/1000));
}
function timerVisualClass(remaining){
  if(remaining===null || remaining===undefined) return '';
  if(remaining<=30) return 'timer-danger';
  if(remaining<=120) return 'timer-warn';
  return '';
}
function startTimerLoop(){
  clearInterval(timerHandle);
  if(!ActiveExam || ActiveExam.mode!=='mock') return;
  const tick=async ()=>{
    if(!ActiveExam || ActiveExam.status!=='running'){clearInterval(timerHandle); return;}
    const remaining=computeRemaining(ActiveExam);
    const tb=document.getElementById('examTimer');
    if(tb){
      tb.textContent=fmtTime(remaining);
      tb.classList.remove('timer-warn','timer-danger');
      const cls=timerVisualClass(remaining);
      if(cls) tb.classList.add(cls);
    }
    if(remaining<=0){
      clearInterval(timerHandle);
      await submitExam(true);
    }
  };
  tick();
  timerHandle=setInterval(tick,1000);
}

function renderExamRunning(){

/* ---- submit & scoring (shared) ---- */
async function submitExam(autoSubmit){
  const e=ActiveExam;
  if(!e || e.isSubmitting) return;
  e.isSubmitting=true;
  clearInterval(timerHandle);
  const timeUsed = e.mode==='mock' ? (e.duration-computeRemaining(e)) : Math.round((Date.now()-e.startTime)/1000);
  let correct=0, wrong=0, skipped=0;

  const topicBreakdown = {};
  const subjectBreakdown = {};
  const snapshot=e.questions.map(q=>{
    const sel=e.selectedAnswers[q.id];
    let status;
    if(sel===undefined){status='skipped'; skipped++;}
    else if(sel===q.answerIndex){status='correct'; correct++;}
    else {status='wrong'; wrong++;}

    if(!topicBreakdown[q.topicId]) topicBreakdown[q.topicId] = {id:q.topicId,name:topicName(q.topicId), subName:subjectName(q.subjectId), total:0, correct:0, wrong:0, skipped:0};
    topicBreakdown[q.topicId].total++;
    topicBreakdown[q.topicId][status]++;
    if(!subjectBreakdown[q.subjectId]) subjectBreakdown[q.subjectId] = {id:q.subjectId,name:subjectName(q.subjectId), total:0, correct:0, wrong:0, skipped:0};
    subjectBreakdown[q.subjectId].total++;
    subjectBreakdown[q.subjectId][status]++;

    return {questionId:q.id, subjectId:q.subjectId, topicId:q.topicId, question:q.question,
      options:q.options, answerIndex:q.answerIndex, selected: sel===undefined?null:sel, status, explanation:q.explanation,
      timing:e.timing&&e.timing[q.id]?e.timing[q.id]:null, bookmarked:e.bookmarks&&e.bookmarks.has(q.id), flagged:e.flags&&e.flags.has(q.id)};
  });

  const positive = correct * (e.configuration.marksPerQ || 1);
  const negative = round2(wrong*(e.negative||0));
  const score = round2(positive-negative);
  const accuracy = (correct+wrong)>0 ? round2(correct/(correct+wrong)*100) : 0;
  const attemptRate = e.questions.length ? round2((correct+wrong)/e.questions.length*100) : 0;
  const timed = snapshot.map(s=>({questionId:s.questionId,status:s.status,ms:s.timing&&s.timing.ms||0})).filter(x=>x.ms>0);
  const fastest=timed.length?timed.reduce((a,b)=>a.ms<=b.ms?a:b):null;
  const slowest=timed.length?timed.reduce((a,b)=>a.ms>=b.ms?a:b):null;
  const timeAnalysis={averageSeconds:round2(timeUsed/Math.max(1,e.questions.length)),fastestQuestionId:fastest&&fastest.questionId||null,fastestSeconds:fastest?round2(fastest.ms/1000):null,slowestQuestionId:slowest&&slowest.questionId||null,slowestSeconds:slowest?round2(slowest.ms/1000):null,classified:timed.map(x=>({questionId:x.questionId,status:x.status,seconds:round2(x.ms/1000),speed:x.ms<=((timeUsed*1000)/Math.max(1,e.questions.length))?'fast':'slow'}))};

  const completedAt=Date.now();
  const result={
    id:uid(), examId:e.id, date:completedAt, completedAt, startedAt:e.startTime, mode:e.mode,
    testType:e.configuration?.revisionKind || (e.configuration?.mistakeRevision?'mistake':(e.mode||'flash')),
    subjects:[...new Set(snapshot.map(s=>subjectName(s.subjectId)))],
    topics:[...new Set(snapshot.map(s=>topicName(s.topicId)))],
    questionCount:e.questions.length, correct, wrong, skipped,
    score, positive, negative, negativeMarks:negative, accuracy, attemptRate,
    duration: e.duration||null, timeUsed, totalTime:timeUsed, averageTimePerQuestion:round2(timeUsed/Math.max(1,e.questions.length)), avgTimePerQuestion:round2(timeUsed/Math.max(1,e.questions.length)), autoSubmit:!!autoSubmit,
    configuration:e.configuration, snapshot, topicBreakdown, subjectBreakdown, timeAnalysis,
    bookmarks:[...(e.bookmarks||[])], flags:[...(e.flags||[])], timing:Object.fromEntries(snapshot.map(s=>[s.questionId,s.timing||null]))
  };
  await dbPut('examResults', result);

  for(const s of snapshot){
    if(s.status==='wrong'){
      let m=CACHE.mistakes.find(x=>x.questionId===s.questionId);
      if(!m) m={id:uid(), questionId:s.questionId, wrongCount:0, revisionStatus:'pending'};
      m.wrongCount=(m.wrongCount||0)+1; m.lastWrongAt=Date.now(); m.examId=result.id; m.subjectId=s.subjectId; m.topicId=s.topicId;
      await dbPut('mistakes', m);
    }
    const qd=CACHE.questions.find(x=>x.id===s.questionId);
    if(qd){
      qd.stats=qd.stats||{attempts:0,correct:0,wrong:0};
      qd.stats.attempts++;
      if(s.status==='correct') qd.stats.correct++;
      else if(s.status==='wrong') qd.stats.wrong++;
      await dbPut('questions', qd);
    }
  }

  if(e.bookmarks && e.bookmarks.size>0){
    for(const qid of e.bookmarks){
      const q=CACHE.questions.find(x=>x.id===qid);
      if(q){ q.bookmarked=true; await dbPut('questions',q); }
    }
  }

  await dbPut('activityLogs',{id:uid(), day:todayKey(), examId:result.id, ts:Date.now()});
  e.status='completed';
  await dbPut('exams', e);
  await loadCache();

  LastResult=result;
  ActiveExam=null;
  navigate('exam/result');
}

function retryStoredResult(resultId,mode,kind){const r=CACHE.examResults.find(x=>x.id===resultId)||LastResult; if(r) retryResultQuestions(r,mode,kind);}

/* Lifetime-level weak topics (for Practice Weak button) — real attempt data only */
function lifetimeWeakTopicIds(limit){
  const by={};
  CACHE.examResults.forEach(r=>{(r.snapshot||[]).forEach(s=>{if(!by[s.topicId]) by[s.topicId]={attempts:0,correct:0}; by[s.topicId].attempts++; if(s.status==='correct') by[s.topicId].correct++;});});
  const sorted=Object.entries(by).filter(([,v])=>v.attempts>=2).sort((a,b)=>(a[1].correct/a[1].attempts)-(b[1].correct/b[1].attempts));
  const ids=sorted.map(([id])=>id);
  const weak=ids.filter(id=>{const v=by[id]; return v.attempts>0&&(v.correct/v.attempts)<0.7;});
  return (limit?weak.slice(0,limit):weak);
}
function lifetimeWeakTopicPool(){
  const weakIds=new Set(lifetimeWeakTopicIds());
  if(!weakIds.size) return [];
  return CACHE.questions.filter(q=>weakIds.has(q.topicId));
}
async function startResultWeakPractice(r){if(typeof r==='string') r=(CACHE.examResults.find(x=>x.id===r)||LastResult); if(!r){toast('পরীক্ষার ফলাফল পাওয়া যায়নি'); return;}

}

function resultWrongRows(r){ return (r.snapshot||[]).filter(s=>s.status==='wrong'); }
function resultWeaknessLevel(acc){ if(!acc && acc!==0) return {label:'—', cls:''}; if(acc>=75) return {label:'শক্তিশালী', cls:'strong'}; if(acc>=50) return {label:'মাঝারি', cls:'medium'}; return {label:'দুর্বল', cls:'weak'}; }
function resultTopStats(r){
  const sn=r.snapshot||[];
  const att=r.correct+r.wrong+r.skipped;
  const accAtt=(r.correct+r.wrong)>0? Math.round(r.correct/(r.correct+r.wrong)*100):0;
  const ta=r.timeAnalysis||{};
  const timed=(sn||[]).filter(s=>s.timing&&s.timing.ms>0);
  return {attempted:att, accAtt, avgMs:(sn.length&&ta.averageSeconds)?ta.averageSeconds:0, fastestMs:ta.fastestSeconds?ta.fastestSeconds*1000:null, slowestMs:ta.slowestSeconds?ta.slowestSeconds*1000:null, fastestQ:ta.fastestQuestionId||null, slowestQ:ta.slowestQuestionId||null};
}
/* Dynamic Bangla insight from actual result data */
function resultBanglaInsight(r){
  const parts=[];
  const sb=resultSubjectBreakdown(r);
  const tb=resultTopicBreakdown(r);
  const acc=Number(r.accuracy||0);
  const total=r.questionCount||0;
  const skipped=r.skipped||0;
  const wrong=(r.wrong||0), correct=(r.correct||0);
  // overall
  if(acc>=80) parts.push('এই পরীক্ষায় accuracy চমৎকার ('+Math.round(acc)+'%) — বেসিক কনসেপ্ট বহুটাই মজবুত, এই ধারা ধরে রাখো।');
  else if(acc>=60) parts.push('তোমার বেসিক ভালো, কিন্তু কিছু জায়গায় ভুলের হার এখনো বেশি — টার্গেটেড রিভিশনে দ্রুত উন্নতি হবে।');
  else if(total>0) parts.push('এই পরীক্ষায় ভুলের হার বেশি ('+Math.round(acc)+'% accuracy) — mistake bank ও smart revision ব্যবহার করে দুর্বল জায়গা থেকে শুরু করো।');
  else parts.push('পরীক্ষা সম্পূর্ণ হয়েছে। নিচের বিশ্লেষণ থেকে তোমার শক্তি-দুর্বলতা জানে নেও।');
  // subject best / worst
  const withAtt=sb.filter(x=>(x.correct+x.wrong)>0);
  if(withAtt.length>1){
    const sorted=[...withAtt].sort((a,b)=>(b.correct/b.total)-(a.correct/a.total));
    const best=sorted[0], worst=sorted[sorted.length-1];
    const bAcc=Math.round(best.correct/best.total*100), wAcc=Math.round(worst.correct/worst.total*100);
    parts.push('সাবজেক্ট অনুযায়ী সেরা অংশ: '+esc(best.name)+' ('+bAcc+'% accuracy), সবচেয়ে দুর্বল: '+esc(worst.name)+' ('+wAcc+'%)।');
  } else if(withAtt.length===1){
    parts.push('এই পরীক্ষায় শুধু '+esc(withAtt[0].name)+' সাবজেক্ট ছিল। accuracy: '+Math.round(withAtt[0].correct/withAtt[0].total*100)+'%।');
  }
  // skipped
  if(skipped>=Math.max(1,Math.round(total*0.2))) parts.push('অনেকগুলো প্রশ্ন ('+skipped+') উত্তর দেওয়া হয়নি — সময় ব্যবস্থাপনা বা concept gap থাকতে পারে; পরবর্তী পরীক্ষায় skip কমানোর চেষ্টা করো।');
  // weak topics
  const weakTb=tb.filter(t=>t.total>0&&(t.correct+t.wrong)>0).map(t=>({t, acc:Math.round(t.correct/(t.correct+t.wrong)*100)})).filter(x=>x.acc<60).sort((a,b)=>a.acc-b.acc);
  if(weakTb.length){
    parts.push('রিভিশনে priority: '+weakTb.slice(0,3).map(x=>esc(x.t.name)+' ('+x.acc+'%)').join(', ')+weakTb.length>3?' সহ আরো কয়েকটি topic।':'।');
  }
  // speed
  const st=resultTopStats(r);
  if(st.avgMs>0){
    if(st.avgMs<25) parts.push('তোমার answering speed দ্রুত ('+st.avgMs+'s/question) — কিন্তু careless ভুল এড়াতে একটু ভেবে উত্তর দেও।');
    else if(st.avgMs<55) parts.push('তোমার answering speed স্বাভাবিক ('+st.avgMs+'s/question) — real exam-এ এই গতি বজায় রাখো।');
    else parts.push('প্রতিটি প্রশ্নে অনেক সময় লাগছে ('+Math.round(st.avgMs)+'s) — shortcut technique প্র্যাকটিস করো।');
  }
  if(st.slowestQ){
    const slowSnap=(r.snapshot||[]).find(s=>s.questionId===st.slowestQ);
    if(slowSnap&&slowSnap.timing) parts.push('সবচেয়ে ধীর উত্তর: '+esc((slowSnap.question||'').slice(0,45))+'… — এই ধরনের প্রশ্নে সময় বেশি লেগেছে।');
  }
  return parts.join(' ');
}
function resultFilterRows(r){
  const sn=r.snapshot||[];
  const sf=ResultSubjectFilter, tf=ResultTopicFilter;
  return sn.filter(s=>{
    if(ResultFilter!=='all' && s.status!==ResultFilter) return false;

  });

function resultTopicFilterOptions(r){

let HistoryFilters={type:'all',from:'',to:'',subject:'',topic:'',sort:'dateDesc'};
function historyRows(){
  return CACHE.examResults.map(normalizeExamResult).filter(r=>{
    const d=new Date(r.date); const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const from=HistoryFilters.from?new Date(HistoryFilters.from+'T00:00:00'):null;
    const to=HistoryFilters.to?new Date(HistoryFilters.to+'T23:59:59'):null;
    const type=HistoryFilters.type==='all'||r.testType===HistoryFilters.type;
    const sub=!HistoryFilters.subject||(r.subjects||[]).includes(HistoryFilters.subject);
    const top=!HistoryFilters.topic||(r.topics||[]).includes(HistoryFilters.topic);
    return type&&sub&&top&&(!from||d>=from)&&(!to||d<=to);
  }).sort((a,b)=>{
    const s=HistoryFilters.sort; if(s==='scoreDesc'||s==='scoreAsc') return (s==='scoreDesc'?-1:1)*(Number(a.score||0)-Number(b.score||0));
    if(s==='accuracyDesc'||s==='accuracyAsc') return (s==='accuracyDesc'?-1:1)*(Number(a.accuracy||0)-Number(b.accuracy||0));
    return Number(b.date||0)-Number(a.date||0);
  });
}
function historyFilterOptions(){
  const subs=[...new Set(CACHE.examResults.flatMap(r=>r.subjects||[]))].filter(Boolean).sort();
  const tops=[...new Set(CACHE.examResults.flatMap(r=>r.topics||[]))].filter(Boolean).sort();
  return {subs,tops};
}

async function startMistakeExam(mode){

  ExamSetup=freshSetup();
  ExamSetup.mode=mode;
  ExamSetup.totalCount=pool.length;
  ExamSetup.onlyQuestionIds = pool.map(q=>q.id);
  await beginExam();
}
let MistakePoolOverride=null;
async function beginExamFromPool(pool, mode){
  const st=ExamSetup;

    options:q.options, answerIndex:q.answer, explanation:q.explanation||'', optOrder:[0,1,2,3]}));

    negative:0, status:'running', isSubmitting:false, configuration:{mistakeRevision:true}, bookmarks:new Set(), flags:new Set(), timing:{}, questionStartedAt:Object.fromEntries(questions.map(q=>[q.id,mpStart])), flashResults:{}};
  await dbPut('exams', exam);
  CACHE.exams=await dbGetAll('exams');
  ActiveExam=exam;
  startTimerLoop();
  navigate('exam/running');
}

function weeklyActivity(){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const now=new Date();
  const map={};
  for(let i=0;i<7;i++){ const d=new Date(now); d.setDate(now.getDate()-i); map[todayKey(d)]={q:0}; }
  CACHE.examResults.forEach(r=>{
    const k=todayKey(new Date(r.date));
    if(map[k]!==undefined) map[k].q += (r.correct+r.wrong+r.skipped);
  });
  const out=[];
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); const k=todayKey(d); out.push({label:days[(d.getDay()+6)%7], v: map[k]? map[k].q:0}); }
  return out;
}

function handleRestoreFile(ev){

  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      openModal(`<h3>Restore Backup</h3>
        <div class="muted">Subjects: ${(data.subjects||[]).length}<br>Topics: ${(data.topics||[]).length}<br>Questions: ${(data.questions||[]).length}<br>Exams: ${(data.examResults||[]).length}<br>Vocabulary: ${(data.vocabulary||[]).length}</div>

        <div class="muted" style="margin-top:8px;">Existing data is never cleared. Records with the same IDs are updated only from the selected backup.</div>`);
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
  ev.target.value='';
}
async function doRestore(dataStr, strategy){
  const data=JSON.parse(dataStr);
  closeModal();

    for(const store of ['subjects','topics','questions','exams','examResults','mistakes','vocabulary','dailyStats']){
      if(data[store]) await dbPutMany(store, data[store]);
    }
    if(data.settings) await dbPut('settings', data.settings);
    await loadCache();
    toast('Restore complete'); navigate('dashboard');
  }catch(err){ toast('Restore failed'); }
}

            mime_type: m.mimeType || 'image/jpeg',
            data: m.image
          }
        });
      }
      contents.push({
        role: m.role==='model'?'model':'user',
        parts: parts
      });
    }

    const provider=getAiProvider();
    let aiRawText='';

    if(provider==='gemini'){
      const requestBody={
        system_instruction:{
          parts:[{text:systemInstruction}]
        },
        contents:contents,
        generationConfig:{
          temperature:0.4,
          maxOutputTokens:2048
        }
      };

      const url=`https://generativelanguage.googleapis.com/v1beta/models/${getProviderModel(provider)||'gemini-3.5-flash-lite'}:generateContent?key=${getProviderKey()}`;
      const response=await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(requestBody)
      });

      if(!response.ok){
        const errText=await response.text();
        throw new Error(`Gemini API error: ${response.status} ${errText}`);
      }

      const data=await response.json();
      const candidate=data.candidates && data.candidates[0];
      aiRawText=candidate && candidate.content && candidate.content.parts && candidate.content.parts[0] && candidate.content.parts[0].text;
      if(!aiRawText){
        if(data.promptFeedback && data.promptFeedback.blockReason){
          throw new Error('Response blocked by Gemini (reason: '+data.promptFeedback.blockReason+'). Try rephrasing.');
        }
        throw new Error('Empty response from Gemini AI');
      }
    } else if(provider==='groq'){
      /* Groq: OpenAI-compatible chat completions. Text only (no image support via Groq API keys). */
      const openaiMessages=[];
      openaiMessages.push({role:'system', content:systemInstruction});
      for(const m of recentMsgs){
        openaiMessages.push({
          role: m.role==='model'?'assistant':'user',
          content: m.text || (m.image ? "Please describe this image's content in text." : "")
        });
      }
      const groqUrl='https://api.groq.com/openai/v1/chat/completions';
      const groqResponse=await fetch(groqUrl, {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer '+getProviderKey()
        },
        body:JSON.stringify({
          model:getProviderModel(provider)||'llama-3.3-70b-versatile',
          messages:openaiMessages,
          temperature:0.4,
          max_tokens:2048
        })
      });
      if(!groqResponse.ok){
        const errText=await groqResponse.text();
        throw new Error(`Groq API error: ${groqResponse.status} ${errText}`);
      }
      const groqData=await groqResponse.json();
      const choice=groqData.choices && groqData.choices[0];
      aiRawText=choice && choice.message && choice.message.content;
      if(!aiRawText){
        throw new Error('Empty response from Groq AI');
      }
    } else {
      throw new Error('Unknown AI provider: '+provider);
    }

    let actionObj=null;
    let replyText=aiRawText;

    const jsonMatch=aiRawText.match(/```json\s*([\s\S]*?)\s*```/) || aiRawText.match(/\{[\s\S]*\}/);
    if(jsonMatch){
      try{
        const jsonStr=jsonMatch[1] || jsonMatch[0];
        actionObj=JSON.parse(jsonStr);
        if(actionObj.reply){
          replyText=actionObj.reply;
        }
      }catch(e){
        console.error('JSON parse error from AI response:', e);
      }
    }

    if(actionObj && actionObj.action){
      await executeAIAction(actionObj);
    }

    AIChatState.messages.push({
      role:'model',
      text:replyText
    });

  }catch(err){
    console.error(err);
    toast('AI Error: '+err.message);
    AIChatState.messages.push({
      role:'model',
      text:'দুঃখিত, একটি সমস্যা হয়েছে: '+err.message
    });
  }finally{
    AIChatState.isLoading=false;
    AIChatState.pendingImage=null;
    render();
    scrollChatBottom();
  }
}

async function executeAIAction(act){
  if(!act || !act.action) return;

  if(act.action==='add_questions'){
    let subId='';
    if(act.subjectName){
      let sub=CACHE.subjects.find(s=>s.name.toLowerCase()===act.subjectName.toLowerCase() || s.name.includes(act.subjectName));
      if(!sub){
        subId=uid();
        await dbPut('subjects',{id:subId, name:act.subjectName, icon:'📘', color:'#0f6b4f', order:CACHE.subjects.length, createdAt:Date.now()});
        CACHE.subjects=await dbGetAll('subjects');
      } else {
        subId=sub.id;
      }
    } else {
      subId=CACHE.subjects[0]?CACHE.subjects[0].id:'';
    }

    let topId='';
    if(act.topicName && subId){
      let tops=topicsOf(subId);
      let top=tops.find(t=>t.name.toLowerCase()===act.topicName.toLowerCase() || t.name.includes(act.topicName));
      if(!top){
        topId=uid();
        await dbPut('topics',{id:topId, subjectId:subId, name:act.topicName, order:tops.length, createdAt:Date.now()});
        CACHE.topics=await dbGetAll('topics');
      } else {
        topId=top.id;
      }
    } else if(subId){
      let tops=topicsOf(subId);
      if(tops.length>0){
        topId=tops[0].id;
      } else {
        topId=uid();
        await dbPut('topics',{id:topId, subjectId:subId, name:'AI Generated', order:0, createdAt:Date.now()});
        CACHE.topics=await dbGetAll('topics');
      }
    }

    if(act.questions && Array.isArray(act.questions)){
      for(const q of act.questions){
        if(!q.question || !q.options || q.options.length<4) continue;
        await dbPut('questions',{
          id:uid(),
          subjectId:subId,
          topicId:topId,
          question:q.question,
          options:q.options.slice(0,4),
          answer:typeof q.answer==='number'?q.answer:0,
          explanation:q.explanation||'',
          tags:q.tags||['AI'],
          difficulty:q.difficulty||'medium',
          source:'ai',
          createdAt:Date.now(),
          updatedAt:Date.now(),
          stats:{attempts:0,correct:0,wrong:0}
        });
      }
      CACHE.questions=await dbGetAll('questions');
      toast(`${act.questions.length} questions added to Question Bank!`);
    }
  } else if(act.action==='start_exam'){
    let subIds=[];
    if(act.subjectNames && Array.isArray(act.subjectNames)){
      for(const sName of act.subjectNames){
        const sub=CACHE.subjects.find(s=>s.name.toLowerCase().includes(sName.toLowerCase()));
        if(sub) subIds.push(sub.id);
      }
    }
    let topIds=[];
    if(act.topicNames && Array.isArray(act.topicNames)){
      for(const tName of act.topicNames){
        const top=CACHE.topics.find(t=>t.name.toLowerCase().includes(tName.toLowerCase()));
        if(top) topIds.push(top.id);
      }
    }

    ExamSetup=freshSetup();
    if(subIds.length>0) ExamSetup.subjectIds=subIds;
    if(topIds.length>0) ExamSetup.topicIds=topIds;
    if(act.mode) ExamSetup.mode=act.mode;
    if(act.count) ExamSetup.totalCount=parseInt(act.count)||20;
    if(act.duration) ExamSetup.duration=parseInt(act.duration)||20;
    if(act.negative!==undefined) ExamSetup.negative=parseFloat(act.negative)||0;

    await beginExam();
  } else if(act.action==='add_subject'){
    const name=act.name;
    if(name){
      await dbPut('subjects',{
        id:uid(),
        name:name,
        icon:act.icon||'📘',
        color:act.color||'#0f6b4f',
        order:CACHE.subjects.length,
        createdAt:Date.now()
      });
      CACHE.subjects=await dbGetAll('subjects');
      toast(`Subject "${name}" created!`);
    }
  } else if(act.action==='add_topic'){
    const subName=act.subjectName;
    const topName=act.name;
    if(subName && topName){
      const sub=CACHE.subjects.find(s=>s.name.toLowerCase().includes(subName.toLowerCase()));
      if(sub){
        const tops=topicsOf(sub.id);
        await dbPut('topics',{
          id:uid(),
          subjectId:sub.id,
          name:topName,
          order:tops.length,
          createdAt:Date.now()
        });
        CACHE.topics=await dbGetAll('topics');
        toast(`Topic "${topName}" added!`);
      }
    }
  } else if(act.action==='add_vocabulary'){
    const word=act.word;
    if(word){
      await dbPut('vocabulary',{
        id:uid(),
        category:'english',
        word:word,
        meaning:act.meaning||'',
        example:act.example||'',
        status:'new',
        createdAt:Date.now()
      });
      CACHE.vocabulary=await dbGetAll('vocabulary');
      toast(`Word "${word}" added to Vocabulary!`);
    }
  }
}
