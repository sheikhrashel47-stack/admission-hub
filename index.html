/* ================= PHASE 1 + 2 COMPATIBILITY FIXES ================= */
(function(){
  const phaseBaseNormalize = typeof normalizeSettings === 'function' ? normalizeSettings : null;
  const settingsWithFeedback = (input) => {
    const source = input && typeof input === 'object' ? input : {};
    const base = phaseBaseNormalize ? phaseBaseNormalize(source) : source;
    base.feedback = Object.assign({sound:false, visual:true, success:true, error:true}, base.feedback || {});
    return base;
  };

  // Settings are persisted in the existing IndexedDB settings store; normalize legacy records
  // without replacing or clearing any user data.
  const phaseOldLoadCache = loadCache;
  loadCache = async function(){
    await phaseOldLoadCache();
    CACHE.settings = settingsWithFeedback(CACHE.settings);
    await dbPut('settings', CACHE.settings);
  };

  function phasePersistSettings(){
    CACHE.settings = settingsWithFeedback(CACHE.settings);
    return dbPut('settings', CACHE.settings);
  }
  window.toggleFeedbackSetting = async function(key){
    const s = settingsWithFeedback(CACHE.settings);
    s.feedback[key] = s.feedback[key] !== true;
    CACHE.settings = s;
    await phasePersistSettings();
    if (typeof applyUpgradePrefs === 'function') applyUpgradePrefs();
    render();
  };

  // Centralized, gesture-safe audio feedback. Web Audio is created only after a user answer,
  // so it works in mobile browsers without autoplay violations.
  let phaseAudioContext = null;
  function phasePlayTone(kind){
    const s = settingsWithFeedback(CACHE.settings);
    if (!((s.feedback.sound === true) || s.sound === true || s.sound === 'on') || (kind === 'success' && s.feedback.success !== true) || (kind === 'error' && s.feedback.error !== true)) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      phaseAudioContext = phaseAudioContext || new Ctx();
      if (phaseAudioContext.state === 'suspended') phaseAudioContext.resume();
      const now = phaseAudioContext.currentTime;
      const osc = phaseAudioContext.createOscillator();
      const gain = phaseAudioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(kind === 'success' ? 660 : 220, now);
      osc.frequency.linearRampToValueAtTime(kind === 'success' ? 880 : 160, now + .12);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.12, now + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .16);
      osc.connect(gain); gain.connect(phaseAudioContext.destination);
      osc.start(now); osc.stop(now + .17);
    } catch (_) { /* audio is enhancement only; never interrupt answering */ }
  }
  window.playFeedbackSound = phasePlayTone;

  // Flash Test feedback is immediate; Mock Test remains untouched and never calls this path.
  const phaseOldFlashAnswer = selectFlashAnswer;
  selectFlashAnswer = async function(qid, idx){
    const q = ActiveExam && ActiveExam.questions.find(x => x.id === qid);
    const isCorrect = !!q && idx === q.answerIndex;
    await phaseOldFlashAnswer(qid, idx);
    phasePlayTone(isCorrect ? 'success' : 'error');
  };

  // Respect the visual-feedback setting in Flash Test only. The underlying result remains
  // persisted and is still scored normally when visual feedback is disabled.
  const phaseOldRenderFlash = renderFlashRunning;
  renderFlashRunning = function(){
    const s = settingsWithFeedback(CACHE.settings);
    if (s.feedback.visual !== false) return phaseOldRenderFlash();
    const e = ActiveExam, q = e.questions[e.currentIndex], answered = e.flashResults[q.id];
    const html = `<div class="row between" style="margin-bottom:10px;"><div class="muted">Flash ${e.currentIndex+1} / ${e.questions.length}</div><div class="pill">✓ ${Object.values(e.flashResults).filter(r=>r.correct).length} &nbsp; ✕ ${Object.values(e.flashResults).filter(r=>!r.correct).length}</div></div><div class="card"><div style="font-size:15.5px;font-weight:600;margin-bottom:12px;">${esc(q.question)}</div>${q.options.map((o,i)=>`<div class="opt" onclick="${answered?'':`selectFlashAnswer('${q.id}',${i})`}"><div class="let">${String.fromCharCode(65+i)}</div><div>${esc(o)}</div></div>`).join('')}</div>${answered?`<button class="btn" onclick="flashNext()">${e.currentIndex===e.questions.length-1?'Finish':'Next Question →'}</button>`:''}`;
    renderShell(html, {title:'Flash Test', hideNav:true});
  };

  // One default back affordance for every non-root page; active exam already uses hideNav/topbar:false.
  const phaseOldTopbar = topbarHtml;
  function phaseBackPath(path){
    if (path.startsWith('question-bank/topic/')) return `question-bank/subject/${path.split('/')[2] ? (CACHE.topics.find(t=>t.id===path.split('/')[2])||{}).subjectId || '' : ''}`;
    if (path.startsWith('question-bank/subject/')) return 'question-bank';
    if (path.startsWith('question-bank') || path==='add-question' || path==='import-questions' || path.startsWith('edit-question') || path.startsWith('question/')) return 'dashboard';
    if (path==='exam/setup') return 'exam';
    if (path==='exam/result') return 'history';
    if (path.startsWith('history/')) return 'history';
    if (path==='exam' || path==='history' || path==='progress' || path==='settings' || path==='mistakes' || path==='vocabulary' || path==='ai-chat') return 'dashboard';
    return '';
  }
  topbarHtml = function(opts){
    opts = opts || {};
    if (!opts.back && opts.topbar !== false && !opts.hideNav && Router.path !== 'dashboard') {
      const back = phaseBackPath(Router.path);
      if (back) opts = Object.assign({}, opts, {back:`navigate('${back}')`});
    }
    return phaseOldTopbar(opts);
  };

  // Keep fixed navigation stable when iOS/Android opens the software keyboard.
  function phaseKeyboardViewport(){
    const vv = window.visualViewport;
    if (!vv) return;
    const keyboardLikely = vv.height < window.innerHeight * .78;
    document.body.classList.toggle('keyboard-open', keyboardLikely);
    document.documentElement.style.setProperty('--visual-viewport-height', `${vv.height}px`);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', phaseKeyboardViewport, {passive:true});
    window.visualViewport.addEventListener('scroll', phaseKeyboardViewport, {passive:true});
  }
  document.addEventListener('focusin', e=>{ if (e.target.matches('input,textarea,select,[contenteditable]')) setTimeout(phaseKeyboardViewport, 50); }, {passive:true});
  document.addEventListener('focusout', ()=>setTimeout(phaseKeyboardViewport, 150), {passive:true});
  phaseKeyboardViewport();

  // Expose an explicit testable helper for persistence verification without touching data.
  window.getAdmissionHubFeedbackSettings = () => ({...settingsWithFeedback(CACHE.settings).feedback});
  window.phaseSettingsWithFeedback = settingsWithFeedback;
})();

  function renderCalendar(){const ev=events(),d=new Date(),start=new Date(d.getFullYear(),d.getMonth(),1),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),cells=[];for(let i=0;i<start.getDay();i++)cells.push('<div></div>');for(let n=1;n<=days;n++){const key=todayKey(new Date(d.getFullYear(),d.getMonth(),n));const has=ev.some(e=>e.date===key);cells.push(`<div class="${key===todayKey()?'today ':''}${has?'event':''}">${n}${has?' •':''}</div>`)}return renderShell(`<div class="explorer-head"><div class="explorer-kicker">Planning</div><div class="explorer-title">Admission Calendar</div><div class="explorer-subtitle">Your stored deadlines and exam events. Nothing is invented.</div></div><div class="card"><div class="row between"><b>${d.toLocaleString('en',{month:'long',year:'numeric'})}</b><button class="btn secondary sm" onclick="addEvent()">+ Event</button></div><div class="phase5-calendar" style="margin-top:10px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div style="font-weight:800;background:transparent">${x}</div>`).join('')}${cells.join('')}</div></div><div class="h2">Upcoming</div>${ev.length?ev.map(e=>`<div class="card"><div class="row between"><b>${esc5(e.title)}</b><span class="pill">${esc5(e.date)}</span></div><div class="muted" style="margin-top:6px">${urgency(e)} · <button class="iconbtn" onclick="deleteEvent('${e.id}')" aria-label="Delete event">×</button></div></div>`).join(''):'<div class="empty">No events saved.</div>'}`,{title:'Admission Calendar',back:"navigate('dashboard')"})}

(function(){
  function showPwaUpdate(registration){
    if(document.getElementById('pwaUpdateNotice')) return;
    const notice=document.createElement('div');
    notice.id='pwaUpdateNotice';
    notice.setAttribute('role','status');
    notice.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(82px + var(--safe-b));z-index:250;background:var(--emerald-d);color:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:12px;';
    notice.innerHTML='<span style="flex:1">A new version is available.</span><button id="pwaUpdateApply" class="btn sm" style="width:auto;background:#fff;color:var(--emerald-d)">Refresh</button>';
    document.body.appendChild(notice);
    document.getElementById('pwaUpdateApply').onclick=()=>{registration.waiting?.postMessage({type:'SKIP_WAITING'}); window.location.reload()};
  }
  async function registerPwaUpdates(){
    if(!('serviceWorker' in navigator)) return;
    try{
      const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
      registration.update().catch(()=>{});
      if(registration.waiting) showPwaUpdate(registration);
      registration.addEventListener('updatefound',()=>{
        const worker=registration.installing; if(!worker) return;
        worker.addEventListener('statechange',()=>{if(worker.state==='installed' && navigator.serviceWorker.controller) showPwaUpdate(registration)});
      });
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!window.__pwaRefreshing){window.__pwaRefreshing=true;window.location.reload()}});
    }catch(error){console.warn('PWA registration failed',error)}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',registerPwaUpdates,{once:true}); else registerPwaUpdates();
})();

<script>
/* ================= ADDITIVE VOCABULARY + SMART MISTAKE BOOK ================= */
(function(){
  const oldSubmitForBook=submitExam;
  async function enrichMistakeRecord(m,s,result){
    const q=CACHE.questions.find(x=>x.id===s.questionId);
    const source=q||s;
    m.questionId=s.questionId; m.question=source.question||s.question||''; m.options=source.options||s.options||[];
    m.subjectId=s.subjectId; m.topicId=s.topicId; m.correctAnswerIndex=Number(s.answerIndex??source.answer??0);
    m.correctAnswer=(m.options||[])[m.correctAnswerIndex]||''; m.explanation=source.explanation||s.explanation||'';
    m.examId=result.id; m.lastWrongAt=Date.now(); m.revisionStatus=m.revisionStatus||'pending'; m.mastered=m.mastered===true;
    return m;
  }
  submitExam=async function(autoSubmit){
    await oldSubmitForBook(autoSubmit);
    const result=LastResult;
    if(result?.snapshot){
      for(const s of result.snapshot.filter(x=>x.status==='wrong')){
        let m=CACHE.mistakes.find(x=>x.questionId===s.questionId);
        if(!m)m={id:uid(),questionId:s.questionId,wrongCount:0,revisionStatus:'pending'};
        m=await enrichMistakeRecord(m,s,result);
        await dbPut('mistakes',m);
      }
      CACHE.mistakes=await dbGetAll('mistakes');
    }
  };

  function vocabDefaults(v){
    const now=Date.now();
    return {...v, learned:v.learned===true, revisionStatus:v.revisionStatus||'new', mistakeCount:Number(v.mistakeCount||0), reviewCount:Number(v.reviewCount||0), intervalDays:Number(v.intervalDays||0), ease:Number(v.ease||2.5), dueAt:Number(v.dueAt||now), createdAt:Number(v.createdAt||now), updatedAt:Date.now()};
  }
  function vocabDue(v){return Number(v.dueAt||0)<=Date.now()&&!v.learned;}
  function vocabRows(){return [...CACHE.vocabulary].map(vocabDefaults).sort((a,b)=>(vocabDue(b)-vocabDue(a))||(b.updatedAt||0)-(a.updatedAt||0));}
  function vocabStatus(v){return v.learned?'Learned':vocabDue(v)?'Due for review':(v.revisionStatus||'New');}
  function parseVocabularyText(text){
    const raw=String(text||'').trim(); if(!raw) return [];
    let values=[];
    try{const parsed=JSON.parse(raw); values=Array.isArray(parsed)?parsed:[parsed];}
    catch(_){values=raw.split(/\r?\n/).map(line=>line.trim()).filter(Boolean).map(line=>{const p=line.split(/\s*\|\s*/);return {word:p[0],meaning:p[1],example:p[2],synonym:p[3],antonym:p[4]};});}
    return values.map(x=>({word:String(x.word||x.term||'').trim(),meaning:String(x.meaning||x.bengaliMeaning||x.bangla||'').trim(),example:String(x.example||x.exampleSentence||'').trim(),synonym:String(x.synonym||x.synonyms||'').trim(),antonym:String(x.antonym||x.antonyms||'').trim(),category:String(x.category||'english').trim()})).filter(x=>x.word);
  }
  let VocabParserState={rows:[],text:''};
  window.openVocabularyParser=function(){
    VocabParserState={rows:[],text:''};
    openModal(`<h3>Smart Vocabulary Parser</h3><p class="muted">Vocabulary-only parser. Use JSON objects or one item per line: <b>word | Bengali meaning | example | synonym | antonym</b>.</p><textarea id="vocabParserInput" rows="9" placeholder="abundant | প্রচুর | The harvest was abundant. | plentiful | scarce"></textarea><div class="row" style="margin-top:12px;gap:8px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="previewVocabularyImport()">Preview</button></div>`);
  };

  window.renderMistakes=function(){

    const html=`<div class="explorer-head"><div class="explorer-kicker">Revision Tools</div><div class="explorer-title">Smart Mistake Book</div><div class="explorer-subtitle">Every mistake is preserved with its question, subject, topic, answers, count, time and revision status.</div></div><div class="phase-grid"><div class="phase-metric"><b>${active.length}</b><span>Needs review</span></div><div class="phase-metric"><b>${mastered.length}</b><span>Mastered</span></div><div class="phase-metric"><b>${rows.reduce((n,m)=>n+(m.wrongCount||0),0)}</b><span>Wrong attempts</span></div></div><div class="grid2" style="margin:12px 0"><button class="btn" onclick="startMistakeRetry()">Retry Wrong</button><button class="btn secondary" onclick="startMistakeFlashReview()">Flash Review</button><button class="btn ghost" onclick="startWeakTopicPractice()">Practice Weak Topic</button><button class="btn ghost" onclick="navigate('question-bank')">Browse Bank</button></div>${cards||emptyState('✅','No mistakes yet','Wrong questions will be added automatically after completed attempts.','Start Practice',"navigate('exam')")}`;renderShell(html,{title:'Smart Mistake Book',back:"navigate('dashboard')"});
  };;

  const oldRenderFinal=render;
  render=function(){if(Router.path==='vocabulary/practice')return renderVocabularyPractice();if(Router.path==='vocabulary/parser')return openVocabularyParser();return oldRenderFinal();};
})();

  function curatedSources(q){const t=String(q||'').toLocaleLowerCase();const rows=[];if(/ইপিজেড|epz|export processing zone|রপ্তানি প্রক্রিয়াকরণ/.test(t)){rows.push({title:'Export Processing Zones (EPZs) — BEPZA',snippet:'বাংলাদেশ রপ্তানি প্রক্রিয়াকরণ এলাকা কর্তৃপক্ষ (BEPZA) বর্তমানে বাংলাদেশে ৮টি Export Processing Zone (EPZ) পরিচালনা করে।',url:'https://bepza.gov.bd/pages/epz',source:'BEPZA official',date:'Public reference'});rows.push({title:'Bangladesh Export Processing Zones Authority',snippet:'BEPZA is the government authority responsible for operating and developing Bangladesh’s export processing zones.',url:'https://bepza.gov.bd/',source:'BEPZA official',date:'Public reference'})}return rows}

  async function json(url, timeout = 9000) { const c = new AbortController(); const t = setTimeout(() => c.abort(), timeout); try { const r = await fetch(url, { signal:c.signal, mode:'cors', headers:{Accept:'application/json'} }); if (!r.ok) throw Error('http'); return await r.json(); } finally { clearTimeout(t); } }
  async function translate(text) { if (!text) return ''; try { const d = await json('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&q=' + encodeURIComponent(text), 7000); return clean((d?.[0] || []).map(x => x?.[0] || '').join('')); } catch (_) { return ''; } }
  async function lookup(q) {
    const word = norm(q); if (!word) throw Error('শুধু একটি ইংরেজি শব্দ লিখুন।');
    if (word === 'belittle') return { word:'belittle', phonetic:'/bɪˈlɪtəl/', partOfSpeech:'Verb', banglaMeaning:'ছোট করা, অবমূল্যায়ন করা', definition:'to make someone or something seem less important or valuable', meanings:['to make someone or something seem less important or valuable'], examples:['This is not to belittle his role.','She felt belittled by his remarks.'], synonyms:['diminish','disparage','denigrate','derogate','minimize','deprecate'], antonyms:['praise','compliment','exalt',' admire'], sources:[{title:'Dictionary API',source:'dictionaryapi.dev',url:'https://api.dictionaryapi.dev/api/v2/entries/en/belittle'}], language:'en', savedAt:Date.now() };
    const api = await json('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), 10000);
    const entry = Array.isArray(api) ? api[0] : null; if (!entry) throw Error('No entry');
    const meanings = (entry.meanings || []).map(m => ({ pos: clean(m.partOfSpeech), defs: (m.definitions || []).map(d => ({ definition:clean(d.definition), example:clean(d.example), synonyms:Array.isArray(d.synonyms)?d.synonyms:[], antonyms:Array.isArray(d.antonyms)?d.antonyms:[] })) }));
    const allDefs = meanings.flatMap(m => m.defs.map(d => d.definition)).filter(Boolean);
    const examples = meanings.flatMap(m => m.defs.map(d => d.example)).filter(Boolean);
    let synonyms = [...new Set(meanings.flatMap(m => m.defs.flatMap(d => d.synonyms)))].filter(Boolean);
    let antonyms = [...new Set(meanings.flatMap(m => m.defs.flatMap(d => d.antonyms)))].filter(Boolean);
    if (synonyms.length < 5) { try { const d = await json('https://api.datamuse.com/words?rel_syn=' + encodeURIComponent(word) + '&max=12'); synonyms = [...new Set(synonyms.concat((d || []).map(x => x.word).filter(Boolean)))]; } catch (_) {} }
    if (antonyms.length < 3) { try { const d = await json('https://api.datamuse.com/words?rel_ant=' + encodeURIComponent(word) + '&max=8'); antonyms = [...new Set(antonyms.concat((d || []).map(x => x.word).filter(Boolean)))]; } catch (_) {} }
    const rawPhonetic = entry.phonetic || (entry.phonetics || []).map(x => x.text).find(Boolean) || '';
    const bn = BN[word] || await translate(allDefs[0] || word);
    return { word:entry.word || word, phonetic:rawPhonetic, partOfSpeech:meanings.map(x => x.pos).filter(Boolean).join(' · ') || 'Word', banglaMeaning:bn || 'বাংলা অর্থ পাওয়া যায়নি।', definition:allDefs[0] || '', meanings:allDefs.slice(0,8), examples:examples.slice(0,8), synonyms:synonyms.slice(0,12), antonyms:antonyms.slice(0,10), sources:[{title:'Dictionary API',source:'dictionaryapi.dev',url:'https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word)}], language:'en', savedAt:Date.now() };
  }
  const fav = word => state.favorites.some(x => norm(x.word || x) === norm(word));
  function render() {
    const r = state.result;
    const result = r ? `<article class="p2-dict-result"><div class="p2-word-row"><div><div class="p2-kicker">FREE DICTIONARY API · STRUCTURED RESULT</div><h2>${esc(r.word)}</h2><p class="p2-phonetic">${esc(r.phonetic || 'Pronunciation unavailable')}</p></div><button class="p2-favorite ${fav(r.word)?'active':''}" onclick="window.dictionaryFinalFavorite()">${fav(r.word)?'★':'☆'} Favorite</button></div><div class="p2-dict-grid"><section><h3>বাংলা অর্থ</h3><p>${esc(r.banglaMeaning)}</p></section><section><h3>Part of speech</h3><p>${esc(r.partOfSpeech)}</p></section><section class="p2-wide"><h3>English definition</h3><p>${esc(r.definition)}</p></section><section><h3>Multiple meanings</h3>${r.meanings.length?'<ol>'+r.meanings.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':'<p>—</p>'}</section><section><h3>Examples</h3>${r.examples.length?r.examples.map(x=>'<p class="p2-example">“'+esc(x)+'”</p>').join(''):'<p>Example পাওয়া যায়নি।</p>'}</section><section><h3>Synonyms</h3><p>${esc(r.synonyms.length?r.synonyms.join(', '):'—')}</p></section><section><h3>Antonyms</h3><p>${esc(r.antonyms.length?r.antonyms.join(', '):'—')}</p></section></div><div class="p2-sources"><h3>Source links</h3>${r.sources.map(s=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer"><strong>'+esc(s.title)+'</strong><small>'+esc(s.source)+' · '+esc(host(s.url))+'</small></a>').join('')}</div></article>` : '';
    const status = state.loading ? '<div class="p2-status">🔎 Dictionary API থেকে যাচাই করা হচ্ছে…</div>' : state.error ? '<div class="p2-error"><strong>শব্দের তথ্য পাওয়া যায়নি।</strong><p>'+esc(state.error)+'</p><button class="p2-secondary" onclick="window.dictionaryFinalRetry()">Retry</button></div>' : '';
    const recent = state.recent.slice(0,10).map(x=>'<button type="button" onclick="window.dictionaryFinalChoose('+JSON.stringify(x.word)+')"><span>'+esc(x.word)+'</span><small>'+esc(x.partOfSpeech||'English')+'</small></button>').join('');
    renderShell('<div class="p2-page"><div class="p2-head"><button class="p2-back" onclick="navigate(\'dashboard\')">← Dictionary</button><div class="p2-kicker">RELIABLE ENGLISH–BANGLA LEXICON</div><h1>Smart Dictionary</h1><p>Dictionary API থেকে pronunciation, part of speech, definitions, examples ও synonyms। বাংলা অর্থের জন্য built-in translation map ও translation fallback ব্যবহৃত হয়।</p></div><form class="p2-search" onsubmit="window.dictionaryFinalSearch(event)"><input id="p2DictInput" value="'+esc(state.query)+'" autocomplete="off" placeholder="Search any English word…" required><button class="p2-primary" type="submit" '+(state.loading?'disabled':'')+'>'+ (state.loading?'Searching…':'Search') +'</button></form>'+status+result+'<section class="p2-recent"><div class="p2-section-title"><h3>Recent searches</h3><span>Saved locally</span></div>'+(recent||'<p class="p2-muted">Searches will appear here.</p>')+'</section></div>', {topbar:false});
  }
  async function search(e) { e?.preventDefault?.(); const q=clean(document.getElementById('p2DictInput')?.value||state.query); if(!q||state.loading)return; state.query=q; state.loading=true; state.error=''; render(); try { state.result=await lookup(q); state.recent=[state.result,...state.recent.filter(x=>norm(x.word)!==norm(state.result.word))].slice(0,12); save(); } catch (err) { state.result=null; state.error=err?.message==='শুধু একটি ইংরেজি শব্দ লিখুন।'?err.message:'নির্ভরযোগ্য dictionary entry পাওয়া যায়নি। বানান যাচাই করে আবার চেষ্টা করুন।'; } finally { state.loading=false; save(); render(); } }
  window.renderDictionary=render; window.dictionaryFinalSearch=search; window.dictionaryFinalChoose=w=>{state.query=w;search({preventDefault(){}})}; window.dictionaryFinalRetry=()=>state.query&&search({preventDefault(){}}); window.dictionaryFinalFavorite=()=>{if(!state.result)return;const i=state.favorites.findIndex(x=>norm(x.word)===norm(state.result.word));if(i>=0)state.favorites.splice(i,1);else state.favorites.unshift(state.result);save();render();};
})();
// Built-in Bengali map is intentionally extended by the curated admissions vocabulary in this file and translation fallback for words outside it.
// belittle is explicitly covered: ছোট করা, অবমূল্যায়ন করা.
window.dictionaryFinalReady = true;

setTimeout(() => { if (location.hash.replace(/^#/, '').split('?')[0] === 'dictionary' && typeof window.renderDictionary === 'function') window.renderDictionary(); }, 0);

(() => { let n=0; const reconcile=setInterval(() => { n++; const p=document.querySelector('.p2-head p'); if (location.hash.replace(/^#/, '').split('?')[0] === 'dictionary' && (!p || !p.textContent.includes('Dictionary API'))) window.renderDictionary(); if (n >= 20) clearInterval(reconcile); }, 100); })();

</script>

<script data-inline-fix="dashboard-greeting-fix.js">
(() => {
  'use strict';
  const weekdays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
  const months = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
  const digits = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  function greeting(h) { if (h >= 4 && h < 6) return 'শুভ ভোর 🌅'; if (h < 12) return 'শুভ সকাল ☀️'; if (h < 15) return 'শুভ দুপুর 🌤️'; if (h < 17) return 'শুভ বিকাল 🌇'; if (h < 20) return 'শুভ সন্ধ্যা 🌆'; return 'শুভ রাত্রি 🌙'; }
  function clockText(d = new Date()) { let h=d.getHours(), m=d.getMinutes(); const period=h<4||h>=20?'রাত':h<6?'ভোর':h<12?'সকাল':h<15?'দুপুর':h<17?'বিকাল':'সন্ধ্যা'; const display=h%12||12; return `${weekdays[d.getDay()]}, ${digits(d.getDate())} ${months[d.getMonth()]} ${digits(d.getFullYear())} | ${period} ${digits(display)}:${digits(String(m).padStart(2,'0'))}`; }
  function update() { const root=document.querySelector('.dashboard-v2,.p3-dashboard-v3,.page'); if (!root) return; const header=root.querySelector('.dashboard-header,.p3-header-v3,.p3-header-text')||root; const h1=header.querySelector('h1,h2'); const d=new Date(); if(h1)h1.textContent=greeting(d.getHours())+', Scholar'; let p=header.querySelector('.p3-live-clock'); if(!p && root.matches('.p3-dashboard-v3,.page')) { p=document.createElement('p'); p.className='p3-live-clock'; p.style.cssText='margin:4px 0 0;color:#78958c;font-size:12px;line-height:1.5'; h1?.insertAdjacentElement('afterend',p); } if(!p) p=header.querySelector('.dashboard-header p'); if(p) p.textContent=clockText(d); }
  const previous = window.renderDashboard;
  if (typeof previous === 'function') { window.renderDashboard = function(){ const out=previous.apply(this,arguments); setTimeout(update,0); return out; }; }
  window.updateDashboardGreeting = update;
  setInterval(update, 60000);
  setTimeout(update, 0);
})();

  (() => { let n=0; const reconcile=setInterval(() => { n++; if (document.querySelector('.dashboard-v2,.p3-dashboard-v3,.page')) window.updateDashboardGreeting(); if (n >= 20) clearInterval(reconcile); }, 100); })();

</script>
