<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Concord Lab — Subject–Verb Agreement</title>
  <style>
    :root {
      --bg: #f4f7f7;
      --bg-soft: #eef5f4;
      --surface: #ffffff;
      --surface-2: #f8fbfb;
      --ink: #172428;
      --muted: #64757a;
      --line: #dce8e6;
      --primary: #0f766e;
      --primary-2: #115e59;
      --primary-soft: #d8f3ee;
      --accent: #f59e0b;
      --accent-soft: #fff2d6;
      --violet: #6957c9;
      --violet-soft: #ece9ff;
      --danger: #c2414b;
      --danger-soft: #ffe6e8;
      --success: #14804a;
      --success-soft: #dff7e9;
      --shadow: 0 14px 38px rgba(25, 66, 66, .08);
      --shadow-sm: 0 4px 16px rgba(25, 66, 66, .07);
      --radius: 20px;
      --radius-sm: 13px;
      --font-scale: 1;
    }
    [data-theme="dark"] {
      --bg: #0d1718;
      --bg-soft: #122223;
      --surface: #172627;
      --surface-2: #1c3030;
      --ink: #eef8f6;
      --muted: #a1b6b5;
      --line: #2e4848;
      --primary: #40c7b4;
      --primary-2: #7be4d3;
      --primary-soft: #153e3a;
      --accent: #f7bb54;
      --accent-soft: #4a3616;
      --violet: #aca1ff;
      --violet-soft: #302d56;
      --danger: #ff8790;
      --danger-soft: #4d272d;
      --success: #60daa0;
      --success-soft: #16402e;
      --shadow: 0 14px 38px rgba(0, 0, 0, .22);
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, .18);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans Bengali", "Hind Siliguri", "SolaimanLipi", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: calc(17px * var(--font-scale));
      line-height: 1.85;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .progress-line { position: fixed; top: 0; left: 0; height: 3px; z-index: 1000; background: linear-gradient(90deg, var(--primary), var(--violet)); width: 0; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 286px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 25px 18px 20px;
      background: var(--surface); border-right: 1px solid var(--line); z-index: 50;
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 4px 10px 23px; }
    .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: #fff; background: linear-gradient(135deg, var(--primary), var(--violet)); font-weight: 900; box-shadow: 0 8px 18px rgba(15,118,110,.24); }
    .brand h1 { font-size: 19px; line-height: 1.2; margin: 0; letter-spacing: -.02em; }
    .brand small { color: var(--muted); display: block; font-size: 12px; margin-top: 2px; }
    .nav-label { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 15px 12px 7px; }
    .nav-btn { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; background: transparent; color: var(--muted); padding: 10px 12px; border-radius: 12px; text-align: left; transition: .18s ease; }
    .nav-btn:hover { color: var(--ink); background: var(--bg-soft); }
    .nav-btn.active { color: var(--primary); background: var(--primary-soft); font-weight: 800; }
    .nav-icon { width: 22px; text-align: center; font-size: 17px; }
    .sidebar-foot { margin: 22px 5px 0; padding: 15px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 15px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .sidebar-foot strong { color: var(--ink); display: block; margin-bottom: 3px; }
    .main-wrap { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 40; height: 72px; display: flex; align-items: center; gap: 14px; padding: 0 34px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent); }
    .mobile-menu { display: none; }
    .crumb { flex: 1; min-width: 0; }
    .crumb strong { font-size: 16px; display: block; line-height: 1.25; }
    .crumb span { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }
    .search-mini { display: flex; align-items: center; gap: 8px; width: min(290px, 32vw); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 7px 11px; color: var(--muted); }
    .search-mini input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); min-width: 0; }
    main { max-width: 1500px; padding: 34px 42px 75px; margin: 0 auto; }
    .eyebrow { color: var(--primary); font-weight: 900; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    h2, h3, h4 { line-height: 1.28; letter-spacing: -.025em; }
    h2 { font-size: clamp(29px, 4vw, 46px); margin: 6px 0 11px; }
    h3 { font-size: clamp(21px, 2.5vw, 29px); margin: 0 0 9px; }
    h4 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .hero { position: relative; overflow: hidden; border-radius: 28px; padding: clamp(26px, 5vw, 58px); background: linear-gradient(135deg, #123f42 0%, #0f766e 54%, #6151bd 145%); color: white; box-shadow: var(--shadow); }
    .hero::after { content: ""; position: absolute; width: 330px; height: 330px; border-radius: 50%; right: -80px; top: -130px; background: rgba(255,255,255,.09); box-shadow: -80px 210px 0 18px rgba(255,255,255,.045); }
    .hero > * { position: relative; z-index: 1; }
    .hero .eyebrow { color: #9ff2e2; }
    .hero h2 { max-width: 800px; margin-top: 8px; }
    .hero p { max-width: 760px; color: rgba(255,255,255,.82); font-size: 18px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .btn { border: 1px solid transparent; border-radius: 12px; padding: 9px 15px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800; line-height: 1.4; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { color: #fff; background: var(--primary); box-shadow: 0 7px 16px rgba(15,118,110,.22); }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-ghost { color: var(--ink); background: var(--surface); border-color: var(--line); }
    .hero .btn-ghost { color: #fff; background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); }
    .btn-soft { color: var(--primary); background: var(--primary-soft); }
    .btn-danger { color: var(--danger); background: var(--danger-soft); }
    .btn-small { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin: 35px 0 15px; }
    .section-head h3 { margin-bottom: 2px; }
    .section-head p { color: var(--muted); margin: 0; }
    .stat-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 12px; margin-top: 18px; }
    .stat { min-height: 122px; padding: 17px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
    .stat .stat-label { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .stat .stat-value { font-size: 29px; font-weight: 900; line-height: 1.2; margin: 8px 0 4px; }
    .stat .stat-note { color: var(--primary); font-size: 12px; }
    .two-col { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 18px; }
    .three-col { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 21px; box-shadow: var(--shadow-sm); }
    .card-tight { padding: 15px 17px; border-radius: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 13px; }
    .card-header p { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
    .progress-track { height: 9px; background: var(--bg-soft); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), #54cdb5); transition: width .35s ease; }
    .progress-row { display: flex; align-items: center; gap: 12px; }
    .progress-row .progress-track { flex: 1; }
    .progress-value { color: var(--primary); font-weight: 900; min-width: 42px; text-align: right; }
    .ring { width: 118px; height: 118px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--primary) var(--progress), var(--bg-soft) 0); position: relative; flex: 0 0 auto; }
    .ring::before { content: ""; position: absolute; inset: 10px; background: var(--surface); border-radius: 50%; }
    .ring > div { position: relative; z-index: 1; text-align: center; line-height: 1.2; }
    .ring strong { display: block; font-size: 24px; }
    .ring small { color: var(--muted); font-size: 11px; }
    .continue { display: flex; gap: 19px; align-items: center; }
    .continue-copy { flex: 1; min-width: 0; }
    .continue-copy h4 { margin-bottom: 4px; }
    .continue-copy p { color: var(--muted); font-size: 14px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 9px; font-size: 12px; line-height: 1.35; font-weight: 800; background: var(--bg-soft); color: var(--muted); white-space: nowrap; }
    .chip.high { background: var(--danger-soft); color: var(--danger); }
    .chip.important { background: var(--accent-soft); color: #a76200; }
    .chip.basic { background: var(--success-soft); color: var(--success); }
    .chip.admission { background: var(--violet-soft); color: var(--violet); }
    .chip.source-adapted { background: var(--accent-soft); color: #9a6207; }
    .chip.source-original { background: var(--primary-soft); color: var(--primary); }
    .chip.source-verified { background: var(--success-soft); color: var(--success); }
    .chip.source-uncertain { background: var(--danger-soft); color: var(--danger); }
    .lesson-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 15px; }
    .lesson-card { position: relative; overflow: hidden; padding: 19px; background: var(--surface); border: 1px solid var(--line); border-radius: 17px; box-shadow: var(--shadow-sm); }
    .lesson-card::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 8px; background: var(--primary); margin-bottom: 15px; }
    .lesson-card.priority-high::before { background: var(--danger); }
    .lesson-card.priority-important::before { background: var(--accent); }
    .lesson-number { color: var(--muted); font-size: 12px; font-weight: 900; }
    .lesson-card h4 { margin: 3px 0 5px; }
    .lesson-card p { color: var(--muted); font-size: 14px; line-height: 1.65; min-height: 48px; }
    .lesson-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin: 12px 0; }
    .lesson-card .progress-track { margin: 10px 0 13px; height: 6px; }
    .lesson-card .btn { width: 100%; }
    .roadmap { display: grid; gap: 12px; position: relative; }
    .roadmap::before { content: ""; position: absolute; left: 20px; top: 21px; bottom: 21px; width: 2px; background: var(--line); }
    .roadmap-item { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 13px; align-items: center; position: relative; }
    .roadmap-dot { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); border: 4px solid var(--surface); font-weight: 900; z-index: 1; }
    .roadmap-item.done .roadmap-dot { color: white; background: var(--primary); }
    .roadmap-copy { min-width: 0; }
    .roadmap-copy strong { display: block; line-height: 1.3; }
    .roadmap-copy span { color: var(--muted); font-size: 13px; }
    .feature-card { height: 100%; }
    .feature-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: var(--primary-soft); color: var(--primary); font-size: 20px; margin-bottom: 13px; }
    .feature-card h4 { margin-bottom: 5px; }
    .feature-card p { color: var(--muted); font-size: 14px; line-height: 1.7; }
    .callout { border-left: 4px solid var(--primary); padding: 13px 16px; background: var(--primary-soft); border-radius: 0 13px 13px 0; margin: 15px 0; }
    .callout.warning { border-color: var(--accent); background: var(--accent-soft); }
    .callout.danger { border-color: var(--danger); background: var(--danger-soft); }
    .callout strong { display: block; margin-bottom: 3px; }
    .lesson-hero { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 22px; }
    .lesson-hero-copy { min-width: 0; }
    .lesson-hero h2 { margin-bottom: 7px; }
    .lesson-hero p { color: var(--muted); max-width: 850px; }
    .lesson-side-meta { flex: 0 0 auto; min-width: 145px; padding: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; }
    .lesson-side-meta strong { display: block; color: var(--primary); font-size: 22px; }
    .lesson-side-meta span { color: var(--muted); font-size: 12px; }
    .lesson-layout { display: grid; grid-template-columns: minmax(0,1fr) 270px; gap: 18px; align-items: start; }
    .lesson-content { min-width: 0; }
    .lesson-sidebar { position: sticky; top: 92px; }
    .sticky-card { position: sticky; top: 92px; }
    .rule-card { border: 1px solid var(--line); border-radius: 16px; padding: 17px; background: var(--surface-2); margin: 12px 0; }
    .rule-card .rule-top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .rule-id { color: var(--primary); font-size: 12px; font-weight: 900; letter-spacing: .06em; }
    .rule-card h4 { margin: 3px 0 3px; }
    .rule-card p { font-size: 15px; line-height: 1.75; }
    .rule-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin-top: 10px; }
    .mini-panel { padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
    .mini-panel small { display: block; color: var(--primary); font-size: 11px; font-weight: 900; margin-bottom: 3px; }
    .mini-panel p { font-size: 13px; line-height: 1.65; margin: 0; }
    .example-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 11px; }
    .example { padding: 13px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); }
    .example.correct { border-left: 4px solid var(--success); }
    .example.trap { border-left: 4px solid var(--accent); }
    .example strong { display: block; font-family: Georgia, serif; font-size: 16px; line-height: 1.55; margin-bottom: 4px; }
    .example span { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .contrast-table { width: 100%; border-collapse: collapse; min-width: 620px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 13px; }
    .contrast-table th, .contrast-table td { padding: 11px 13px; border-bottom: 1px solid var(--line); vertical-align: top; text-align: left; }
    .contrast-table th { background: var(--bg-soft); color: var(--primary); font-size: 13px; }
    .contrast-table td { font-size: 14px; }
    .contrast-table tr:last-child td { border-bottom: 0; }
    details { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); margin: 10px 0; overflow: hidden; }
    details summary { cursor: pointer; padding: 12px 15px; font-weight: 800; list-style: none; display: flex; justify-content: space-between; gap: 12px; }
    details summary::-webkit-details-marker { display: none; }
    details summary::after { content: "+"; color: var(--primary); font-weight: 900; }
    details[open] summary::after { content: "–"; }
    .details-body { padding: 0 15px 15px; }
    .search-page-head { display: flex; gap: 13px; align-items: center; margin-bottom: 19px; }
    .search-big { flex: 1; display: flex; gap: 10px; border: 1px solid var(--line); background: var(--surface); padding: 11px 14px; border-radius: 14px; }
    .search-big input { border: 0; outline: 0; background: transparent; color: var(--ink); width: 100%; }
    .result-list { display: grid; gap: 11px; }
    .result-card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 15px; background: var(--surface); color: var(--ink); }
    .result-card:hover { border-color: var(--primary); }
    mark { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 3px; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 9px; padding: 14px; border-radius: 15px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 15px; }
    .filter-bar label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .filter-bar select, .filter-bar input { border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--ink); padding: 7px 9px; min-width: 118px; }
    .filter-bar .filter-search { flex: 1 1 190px; min-width: 160px; }
    .bank-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .bank-toolbar strong { color: var(--primary); }
    .question-list { display: grid; gap: 11px; }
    .question-list-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; }
    .question-list-card .stem { font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.55; margin: 8px 0; }
    .question-list-card .subline { color: var(--muted); font-size: 13px; }
    .pagination { display: flex; gap: 7px; justify-content: center; margin: 19px 0; flex-wrap: wrap; }
    .page-btn { min-width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); background: var(--surface); }
    .page-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
    .quiz-shell { display: grid; grid-template-columns: minmax(0,1fr) 270px; gap: 17px; align-items: start; }
    .quiz-main { min-width: 0; }
    .quiz-top { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 13px; }
    .quiz-progress { flex: 1; }
    .quiz-progress p { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
    .timer { padding: 8px 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--primary); font-weight: 900; white-space: nowrap; }
    .timer.warn { color: var(--danger); background: var(--danger-soft); }
    .quiz-card { padding: clamp(19px, 4vw, 33px); border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
    .question-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 15px; }
    .question-number { color: var(--muted); font-weight: 900; font-size: 13px; margin-right: auto; }
    .question-stem { font-family: Georgia, "Times New Roman", serif; font-size: clamp(20px, 3vw, 27px); line-height: 1.55; margin: 8px 0 22px; }
    .options { display: grid; gap: 10px; }
    .option { display: flex; gap: 11px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 12px 13px; border-radius: 13px; line-height: 1.65; transition: .16s ease; }
    .option:hover:not(:disabled) { border-color: var(--primary); transform: translateX(2px); }
    .option:disabled { cursor: default; }
    .option-key { width: 27px; height: 27px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 8px; background: var(--bg-soft); color: var(--muted); font-weight: 900; font-size: 13px; }
    .option.correct { border-color: var(--success); background: var(--success-soft); color: var(--ink); }
    .option.correct .option-key { background: var(--success); color: white; }
    .option.wrong { border-color: var(--danger); background: var(--danger-soft); }
    .option.wrong .option-key { background: var(--danger); color: white; }
    .feedback { margin-top: 17px; padding: 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
    .feedback.good { border-color: color-mix(in srgb, var(--success) 45%, var(--line)); background: var(--success-soft); }
    .feedback.bad { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); background: var(--danger-soft); }
    .feedback h4 { margin-bottom: 4px; }
    .feedback p { font-size: 15px; line-height: 1.75; }
    .quiz-controls { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .quiz-controls .control-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .palette { position: sticky; top: 93px; }
    .palette-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; margin-top: 12px; }
    .palette-btn { height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 900; }
    .palette-btn.current { border-color: var(--primary); box-shadow: inset 0 0 0 2px var(--primary-soft); color: var(--primary); }
    .palette-btn.correct { color: var(--success); background: var(--success-soft); border-color: var(--success); }
    .palette-btn.wrong { color: var(--danger); background: var(--danger-soft); border-color: var(--danger); }

    function normalise(text) { return String(text).toLowerCase().replace(/[“”‘’'".,!?;:()\[\]{}—–-]/g, " ").replace(/\s+/g, " ").trim(); }

      return { options: entries.map(e => e.text), answer: entries.findIndex(e => e.correct) };

    function filteredQuestions() {

ct</option><option value="wrong">Mistake bank</option><option value="bookmarked">Bookmarked</option></select></label><button class="btn btn-ghost btn-small" data-action="clear-filters">Clear</button></div><div class="bank-toolbar"><div><strong>${rows.length}</strong>টি result • page ${practicePage}/${totalPages}</div><button class="btn btn-primary btn-small" data-action="start-filtered" ${rows.length?"":"disabled"}>এই filter দিয়ে ${Math.min(20, rows.length)} প্রশ্ন শুরু</button></div><div class="question-list">${pageRows.length ? pageRows.map(questionListCardHtml).join("") : `<div class="empty"><strong>কোনো item পাওয়া যায়নি</strong>Filter clear করে আবার চেষ্টা করো। Verified past count 0—এটি intentional source honesty।</div>`}</div><div class="pagination">${Array.from({length:Math.min(totalPages,9)},(_,i)=>`<button class="page-btn ${practicePage===i+1?"active":""}" data-action="page" data-page="${i+1}">${i+1}</button>`).join("")}</div></section>`;
    }
    function questionListCardHtml(q) {

{adapted.map(q=>`<article class="card card-tight question-list-card"><div><div class="chip-row">${typeChip(q)}<span class="chip">${q.id}</span><span class="chip">${escapeHtml(q.sourceOrganisation)}</span></div><div class="stem">${escapeHtml(q.stem)}</div><div class="subline">Source: ${escapeHtml(q.sourceTitle)} • verification: adapted, not official</div></div><button class="btn btn-soft btn-small" data-action="start-single" data-id="${q.id}">Solve →</button></article>`).join("")}</div><div class="section-head"><div><div class="eyebrow">PATTERN ANALYSIS</div><h3>Available dataset থেকে কী বোঝা যায়?</h3></div></div><div class="three-col"><div class="card feature-card"><div class="feature-icon">01</div><h4>Most repeated skill</h4><p>head noun বনাম nearby plural noun—এই contrast বহু grammar-prep item-এ দেখা যায়; L01/L04 আগে করো।</p></div><div class="card feature-card"><div class="feature-icon">02</div><h4>High-yield cluster</h4><p>a number of বনাম the number of, neither/either এবং each/every admission-এ দ্রুত marks দেয়।</p></div><div class="card feature-card"><div class="feature-icon">03</div><h4>Dataset caution</h4><p>এটি একটি curated learning dataset; সব বাংলাদেশি পরীক্ষার পূর্ণ statistical sample নয়। Frequency claim না করে priority label ব্যবহার করা হয়েছে।</p></div></div><div class="card" style="margin-top:16px"><div class="card-header"><div><h3>Previous Year mode</h3><p>শুধু verified/public-uncertain exact records-এর জন্য reserved।</p></div><span class="chip high">0 verified</span></div><div class="empty"><strong>Verified past-question bank এখনো শূন্য</strong>কোনো exam/year/source বানিয়ে বলা হয়নি। Adapted Pattern set-এ নতুন wording-এর honest practice আছে।</div></div></section>`;

iv><span class="chip ${h.percentage>=70?"basic":h.percentage>=45?"important":"high"}">${h.percentage}% • ${h.score} score</span></div>`).join("")}</div>`:`<div class="empty"><strong>No mock history yet</strong>একটি test শুরু করলেই history এখানে দেখা যাবে।</div>`}</section>`;

    function mistakesHtml() {
      const qs = state.wrongQuestionIds.map(getQuestion).filter(Boolean);
      return `<section data-section="mistakes"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">ERROR CLINIC</div><h2>Mistake Bank</h2><p>ভুল answer-কে failure নয়—পরের score-এর roadmap বানাও।</p></div>${qs.length?`<button class="btn btn-primary" data-action="start-mistakes">Retry ${qs.length} →</button>`:""}</div>${qs.length?`<div class="callout danger"><strong>Retry strategy</strong>প্রথমে question না দেখে related rule-এর নাম বলো, তারপর answer দাও। ভুল থাকলে explanation-এর elimination tip লিখে রাখো।</div><div class="question-list">${qs.map(q=>`<article class="card card-tight question-list-card"><div><div class="chip-row">${typeChip(q)}<span class="chip high">Mistake</span><span class="chip">${q.id}</span></div><div class="stem">${escapeHtml(q.stem)}</div><div class="subline">তোমার শেষ answer: ${escapeHtml(q.options[state.answerHistory[q.id]?.choice] || "—")} • Rule ${q.relevantRuleId}: ${escapeHtml(q.conceptTested)}</div></div><button class="btn btn-soft btn-small" data-action="start-single" data-id="${q.id}">Retry →</button></article>`).join("")}</div><button class="btn btn-danger btn-small" style="margin-top:14px" data-action="clear-mistakes">Mistake bank clear</button>`:`<div class="empty"><strong>তোমার mistake bank খালি</strong>Practice বা mock-এ একটি ভুল হলেই এখানে explanation-সহ জমা হবে।</div>`}</section>`;
    }

    function revisionHtml() {
      const highRules = courseData.rules.filter(r=>r.priority === "high"); const savedRules = courseData.rules.filter(r=>state.bookmarkedRules.includes(r.id));
      return `<section data-section="revision"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">5-MINUTE RECALL</div><h2>Quick Revision</h2><p>High-value rule, trap, contrast এবং final master sheet—exam hall-এর আগে।</p></div><button class="btn btn-primary" data-action="start-revision">Revision drill →</button></div><div class="two-col"><div class="card master-sheet"><div class="card-header"><div><h3>Last-Minute Master Sheet</h3><p>শুধু high-value information।</p></div><span class="chip high">5–10 min</span></div><ol class="master-list"><li>আগে subject/head noun খুঁজো; nearest noun নয়।</li><li>he/she/it + present verb = -s; does-এর পরে base verb।</li><li>and → plural; as well as/with/including → মূল subject unchanged।</li><li>each/every/everyone/either/neither = singular default।</li><li>both/many/few/several এবং police/cattle/people = plural।</li><li>news, mathematics, economics, measles = singular।</li><li>scissors/trousers plural; a pair of = singular।</li><li>a number of + plural; the number of + singular।</li><li>all/some/half/percent of-এর পরের noun দেখো।</li><li>there/here-এ পরের noun; inversion-এ hidden subject।</li><li>more than one/many a/one in ten = singular; two out of five = plural।</li><li>শেষ check: S-V-A-N → Subject, Verb, Auxiliary, Number।</li></ol></div><div class="card"><div class="card-header"><div><h3>Saved rules</h3><p>Bookmark করা rule দ্রুত revisit করো।</p></div><span class="chip">${savedRules.length} saved</span></div>${savedRules.length?`<div class="priority-list">${savedRules.slice(0,8).map(r=>`<button class="priority-item" data-action="open-rule" data-id="${r.id}" style="text-align:left"><div class="priority-icon">★</div><div><strong>${escapeHtml(r.id)} · ${escapeHtml(r.title)}</strong><span>${escapeHtml(r.shortcut)}</span></div></button>`).join("")}</div>`:`<div class="empty"><strong>কোনো saved rule নেই</strong>Lesson-এ ☆ Save চাপো।</div>`}</div></div><div class="section-head"><div><div class="eyebrow">HIGH PRIORITY RULES</div><h3>প্রথমে এগুলো আয়ত্ত করো</h3></div></div><div class="two-col"><div class="card"><div class="priority-list">${highRules.slice(0,18).map(r=>`<div class="priority-item"><div class="priority-icon">!</div><div><strong>${escapeHtml(r.id)} · ${escapeHtml(r.title)}</strong><span>${escapeHtml(r.shortcut)}</span></div></div>`).join("")}</div></div><div class="card"><h3>Fast trap recap</h3>${courseData.traps.slice(0,12).map(t=>`<details><summary>${escapeHtml(t.trap)}</summary><div class="details-body"><p style="font-family:Georgia,serif">${escapeHtml(t.example)}</p><p class="muted small">${escapeHtml(t.warning)}</p></div></details>`).join("")}</div></div><div class="section-head"><div><div class="eyebrow">EXAM HALL CHECKLIST</div><h3>Answer দেওয়ার আগে ৬টি প্রশ্ন</h3></div></div><div class="three-col">${["Blank-এর আসল finite verb কোনটি?","Subject phrase-এর head noun কোনটি?","কোনো of/with/including phrase কি চোখকে টানছে?","do/does/modal আছে কি? Main verb base কি?","or/nor/there/inversion/quantifier pattern আছে কি?","Option বসিয়ে পুরো sentence natural ও rule-consistent কি?"] .map((x,i)=>`<div class="card feature-card"><div class="feature-icon">${i+1}</div><p>${escapeHtml(x)}</p></div>`).join("")}</div></section>`;
    }

      return `<section data-section="glossary"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">REFERENCE</div><h2>Glossary</h2><p>${courseData.glossary.length}টি relevant term—English label, Bengali meaning, quick example।</p></div></div><div class="search-page-head"><label class="search-big"><span>⌕</span><input data-glossary-search value="${escapeHtml(glossarySearch)}" placeholder="subject, antecedent, quantifier…"></label><span class="chip admission">${rows.length} results</span></div><div class="glossary-grid">${rows.length?rows.map(x=>`<article class="glossary-item"><h4>${highlight(x.term,term)}</h4><p>${highlight(x.meaning,term)}</p><p style="margin-top:6px;font-family:Georgia,serif;color:var(--ink)">${highlight(x.example,term)}</p></article>`).join(""):`<div class="empty" style="grid-column:1/-1"><strong>Term পাওয়া যায়নি</strong>অন্য keyword দিয়ে খুঁজুন।</div>`}</div></section>`;
    }

    function sourcesHtml() {
      const a = courseData.contentAudit;
      return `<section data-section="sources"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">RESEARCH LEDGER</div><h2>Sources & Methodology</h2><p>Rule support আর question-pattern reference আলাদা রাখা হয়েছে। Access date: 27 August 2026.</p></div><span class="status-pass">${a.passed?"✓ QA PASS":"Review needed"}</span></div><div class="callout"><strong>Verification policy</strong>Cambridge, Purdue এবং British Council rule references হিসেবে ব্যবহৃত। Bangladesh-focused pages কেবল pattern discovery-এর জন্য। কোনো exam/year/source independently identifiable না হলে item-কে official past question বলা হয়নি।</div><div class="card"><div class="card-header"><div><h3>Source ledger</h3><p>প্রতিটি source-এর purpose ও status দেখো।</p></div><span class="chip">${courseData.sources.length} sources</span></div><div class="result-list">${courseData.sources.map((s,i)=>`<article class="source-card"><div class="source-num">${i+1}</div><div><h4>${escapeHtml(s.title)}</h4><p><strong>${escapeHtml(s.org)}</strong> • ${escapeHtml(s.purpose)}</p><p><span class="chip ${s.status.includes("not official")?"source-adapted":"source-verified"}">${escapeHtml(s.status)}</span></p><a href="${safeUrl(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.url)}</a></div></article>`).join("")}</div></div><div class="section-head"><div><div class="eyebrow">CONTENT AUDIT</div><h3>Inspect-able quality report</h3></div></div><div class="card"><div class="audit-grid"><div class="audit-item"><strong>${courseData.questions.length}</strong><span>total question records</span></div><div class="audit-item"><strong>${courseData.rules.length}</strong><span>rules</span></div><div class="audit-item"><strong>${courseData.examples.length}</strong><span>worked examples</span></div><div class="audit-item"><strong>${courseData.traps.length}</strong><span>common traps</span></div><div class="audit-item"><strong>${a.verifiedPastQuestionCount}</strong><span>verified past</span></div><div class="audit-item"><strong>${a.publicUncertainQuestionCount}</strong><span>public uncertain</span></div><div class="audit-item"><strong>${a.adaptedQuestionCount}</strong><span>adapted pattern</span></div><div class="audit-item"><strong>${a.originalQuestionCount}</strong><span>original practice</span></div></div><div class="callout ${a.passed?"":"danger"}" style="margin-bottom:0"><strong>${a.passed?"All automated checks passed.":"Some checks need review."}</strong>Question count, option count, answer index, unique ID/fingerprint, explanation, source status, unrelated keyword এবং content scale checks run on load.</div></div></section>`;

    function searchHtml(term) {
      const t = (term || "").trim(); if (!t) return `<section data-section="search"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">GLOBAL SEARCH</div><h2>কী খুঁজবে?</h2><p>Rule, lesson, trap, glossary, example বা question ID লিখে শুরু করো।</p></div></div><div class="empty"><strong>Search box ব্যবহার করো</strong>যেমন: <em>number of</em>, <em>neither</em>, <em>head noun</em>, <em>scissors</em>।</div></section>`;
      const results = [];
      courseData.lessons.forEach(l=>{ if ([l.title,l.subtitle,l.intro,l.objective].join(" ").toLowerCase().includes(t.toLowerCase())) results.push({kind:"Lesson", title:l.title, text:l.objective, action:"open-lesson", id:l.id}); });
      courseData.rules.forEach(r=>{ if ([r.id,r.title,r.summary,r.shortcut,r.good,r.bad].join(" ").toLowerCase().includes(t.toLowerCase())) results.push({kind:"Rule", title:`${r.id} · ${r.title}`, text:r.summary, action:"open-rule", id:r.id}); });
      courseData.traps.forEach(r=>{ if ([r.trap,r.example,r.warning].join(" ").toLowerCase().includes(t.toLowerCase())) results.push({kind:"Trap", title:r.trap, text:r.example, action:"open-lesson", id:r.lessonId}); });
      courseData.glossary.forEach(g=>{ if ([g.term,g.meaning,g.example].join(" ").toLowerCase().includes(t.toLowerCase())) results.push({kind:"Glossary", title:g.term, text:g.meaning, action:"glossary", id:""}); });
      courseData.questions.forEach(q=>{ if ([q.id,q.stem,q.subtopic,q.conceptTested,q.explanation].join(" ").toLowerCase().includes(t.toLowerCase())) results.push({kind:"Question", title:`${q.id} · ${q.subtopic}`, text:q.stem, action:"start-single", id:q.id}); });
      return `<section data-section="search"><div class="section-head" style="margin-top:0"><div><div class="eyebrow">GLOBAL SEARCH</div><h2>Search results</h2><p>${results.length}টি result for “${escapeHtml(t)}”</p></div><button class="btn btn-ghost" data-action="clear-global-search">Clear search</button></div><div class="result-list">${results.slice(0,80).map(r=>`<button class="result-card" data-action="${r.action}" data-id="${r.id}"><div class="chip-row"><span class="chip admission">${r.kind}</span></div><h4>${highlight(r.title,t)}</h4><p class="muted">${highlight(r.text,t)}</p></button>`).join("") || `<div class="empty"><strong>কোনো result নেই</strong>অন্য keyword বা rule name দিয়ে চেষ্টা করো।</div>`}</div></section>`;
