<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#647089;--primary:#5b5ce2;--teal:#0ea5a4;--gold:#f59e0b;--bad:#dc4c64;--line:#e8ebf3;--shadow:0 12px 35px #26345a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Sans Bengali","Hind Siliguri",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:20px;color:var(--primary);letter-spacing:-.5px}.brand span{color:var(--ink)}.top-right{margin-left:auto;display:flex;gap:10px;align-items:center}.iconbtn,.pill{background:#f0f1ff;color:var(--primary);padding:9px 13px;border-radius:12px}.layout{display:flex;max-width:1440px;margin:auto}.side{width:260px;padding:24px 16px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.side h4{color:var(--muted);font-size:12px;letter-spacing:1px;margin:18px 12px 7px}.nav{display:block;width:100%;text-align:left;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);margin:3px 0}.nav:hover,.nav.active{background:#e9e9ff;color:var(--primary);font-weight:700}.main{flex:1;padding:34px 34px 80px;min-width:0}.hero{background:linear-gradient(135deg,#282c83,#6366f1);color:white;border-radius:26px;padding:34px 38px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:'ADJ';font:900 180px Arial;color:#ffffff13;position:absolute;right:5%;bottom:-60px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:12px;color:#c8caff}.hero h1{font-size:clamp(32px,5vw,55px);line-height:1.15;margin:8px 0}.hero p{max-width:700px;color:#e3e5ff}.cta{background:#fff;color:#3f42bc;border-radius:12px;padding:12px 18px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.stat b{font-size:28px;display:block;color:var(--primary)}.stat small,.muted{color:var(--muted)}h2{font-size:28px;margin:34px 0 13px}h3{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tag{display:inline-flex;padding:3px 9px;border-radius:99px;background:#eefcf9;color:#087b76;font-size:12px;font-weight:700}.tag.gold{background:#fff7e6;color:#a76800}.lesson{display:flex;gap:15px;align-items:flex-start}.num{min-width:38px;height:38px;border-radius:12px;background:#ececff;color:var(--primary);display:grid;place-items:center;font-weight:900}.rule{border-left:4px solid var(--primary);background:#f4f4ff;padding:14px 16px;border-radius:0 12px 12px 0;margin:12px 0}.bn{color:#3f4a63}.example{background:#f8fafc;border:1px dashed #cfd5e3;padding:12px 15px;border-radius:12px}.wrong{color:var(--bad);text-decoration:line-through}.right{color:#087b76;font-weight:700}.quiz{max-width:850px}.qhead{display:flex;justify-content:space-between;gap:12px}.options{display:grid;gap:10px;margin:18px 0}.opt{padding:13px 15px;text-align:left;background:#f8f9fc;border:1px solid var(--line);border-radius:12px;color:var(--ink)}.opt:hover{border-color:var(--primary);background:#f0f0ff}.opt.correct{background:#e9faf4;border-color:#22a97c}.opt.wrong{background:#fff0f2;border-color:var(--bad)}.feedback{padding:15px;border-radius:12px;background:#f5f6ff;margin-top:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white}.progress{height:8px;background:#e8eaf2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--primary));width:0}.hidden{display:none!important}.source{font-size:14px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px;padding-top:12px}.foot{color:var(--muted);font-size:13px}.drawer{display:none}@media(max-width:850px){.side{display:none}.main{padding:20px 15px 50px}.top{padding:0 15px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.hero{padding:25px 22px}.drawer{display:block}.top-right .label{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* premium polish */
::selection{background:#c9caff;color:#25277d}.card{transition:transform .2s ease,box-shadow .2s ease}.card:hover{transform:translateY(-3px);box-shadow:0 18px 42px #26345a18}.cta{box-shadow:0 8px 20px #20245c2b;transition:transform .2s}.cta:hover{transform:translateY(-2px)}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:'＋';float:right;color:var(--primary);font-weight:900}details[open] summary:after{content:'−'}.hero h1{letter-spacing:-1.8px}.section-kicker{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--primary);font-weight:800}

<body><header class="top"><button class="iconbtn drawer" onclick="toggleSide()">☰</button><div class="brand">Adjective<span>Lab</span></div><div class="top-right"><span class="pill label">English Grammar · Admission Track</span><button class="iconbtn" onclick="toggleTheme()">◐</button></div></header><div class="layout"><aside class="side" id="side"><h4>LEARN</h4><button class="nav active" onclick="go('dashboard',this)">⌂ ড্যাশবোর্ড</button><button class="nav" onclick="go('lessons',this)">▣ লেসন ম্যাপ</button><button class="nav" onclick="go('rules',this)">◆ Rule Cards</button><button class="nav" onclick="go('traps',this)">⚠ Trap Clinic</button><h4>TEST</h4><button class="nav" onclick="go('practice',this)">✓ Practice Arena</button><button class="nav" onclick="go('mock',this)">◷ Mock Test</button><button class="nav" onclick="go('mistakes',this)">↻ Mistake Bank</button><h4>REVISE</h4><button class="nav" onclick="go('revision',this)">★ Master Sheet</button><button class="nav" onclick="go('sources',this)">⌁ Sources</button></aside><main class="main" id="app"></main></div>
<script>
const lessons=[
['Foundation','Adjective কী ও কীভাবে চিনবে','Basic','বিশেষণ হলো এমন word যা noun বা pronoun-এর গুণ, পরিমাণ, সংখ্যা বা পরিচয় জানায়।'],
['Position & Function','Attributive ও predicative adjective','Basic','Noun-এর আগে বসলে attributive, linking verb-এর পরে বসলে predicative: a bright student / The student is bright.'],
['Kinds','Quality, quantity, number, demonstrative ও possessive','Basic','পরীক্ষায় adjective-এর শ্রেণি চেনার মূল কৌশল হলো—এটি noun-কে কোন প্রশ্নের উত্তর দিচ্ছে তা দেখা।'],
['Degrees','Positive, comparative ও superlative','Admission','দুটি জিনিসে comparative, তিন বা ততোধিকের মধ্যে সর্বোচ্চ/সর্বনিম্ন বোঝাতে superlative।'],
['Formation','-er/-est, more/most ও spelling rules','Admission','One-syllable adjective-এ সাধারণত -er/-est; দীর্ঘ adjective-এ more/most।'],
['Irregulars','Irregular comparison master list','Admission','good–better–best, bad–worse–worst, little–less–least, much–more–most, far–farther/further।'],
['Equality','as…as, less…than ও the same as','Intermediate','সমতা: as + adjective + as; কম মাত্রা: less + adjective + than।'],
['Order','Multiple adjectives-এর স্বাভাবিক ক্রম','Advanced','Opinion–size–age–shape–colour–origin–material–purpose + noun—এটি tendency, absolute law নয়।'],
['-ed / -ing','Bored বনাম boring','Admission','-ed অনুভূত ব্যক্তি/বস্তুকে, -ing অনুভূতি সৃষ্টিকারী বিষয়কে describe করে।'],
['Gradability','Gradable বনাম absolute adjective','Advanced','very hot বলা যায়; কিন্তু absolutely impossible বেশি স্বাভাবিক। modifier-এর অর্থের সঙ্গে adjective মিলবে।'],
['Traps','Exam trap ও error clinic','Trap','double comparative, wrong than/as, adjective-adverb confusion—এই ভুলগুলোই দ্রুত নম্বর কেটে নেয়।'],
['Mastery','Sentence scan ও admission strategy','Admission','প্রথমে noun/linking verb খুঁজে adjective শনাক্ত করো; তারপর degree, position ও collocation যাচাই করো।']];
const rules=[['R01','Adjective + noun','সাধারণত adjective noun-এর আগে বসে: an honest officer।','একজন সৎ কর্মকর্তা'],['R02','Linking verb + adjective','be, seem, become, feel, look-এর পরে adjective হয়: She looks happy।','look happy, not look happily'],['R03','Comparative + than','দুটি জিনিস তুলনা: taller than, more useful than।','than-কে that দিয়ে বদলাবে না।'],['R04','Superlative + the','দলের মধ্যে চূড়ান্ত degree: the tallest, the most useful।','কখনও possessive থাকলে the বাদ যেতে পারে: our best plan।'],['R05','CVC doubling','big→bigger, hot→hottest; শেষ consonant double হয়।','new→newer, কারণ শেষ অংশ CVC নয়।'],['R06','y → i','happy→happier→happiest; কিন্তু grey→greyer-ও প্রচলিত।','শেষের y বদলে i, তারপর suffix।'],['R07','Irregular forms','good→better→best; bad→worse→worst।','gooder/wellest ভুল।'],['R08','as…as','সমতা বোঝাতে as + positive adjective + as।','He is as tall as me/us—পরীক্ষার style অনুযায়ী pronoun খেয়াল করো।'],['R09','Adjective order','opinion→size→age→shape→colour→origin→material→purpose→noun।','a beautiful small old red Italian leather bag'],['R10','-ed/-ing','interested student; interesting book।','ব্যক্তি সাধারণত interested, বিষয় interesting।'],['R11','very বনাম absolutely','very + gradable; absolutely + extreme/non-gradable।','very tired / absolutely exhausted'],['R12','fewer বনাম less','countable plural noun-এর আগে fewer; uncountable-এর আগে less।','fewer mistakes, less time']];
const baseQs=[
['Q01','Which word is an adjective in “She bought a beautiful dress”?',['bought','beautiful','dress','she'],1,'Adjective beautiful noun dress-এর গুণ বলছে।','R01'],
['Q02','Choose the correct form: This is ___ book I have read.',['the better','the best','bestest','most best'],1,'একটি group-এর মধ্যে সর্বোচ্চ: the best।','R04'],
['Q03','Comparative of “happy” is—',['happyer','more happy','happier','happiest'],2,'শেষে consonant + y হলে y→i + er।','R06'],
['Q04','The correct sentence is—',['He looks happily.','He looks happy.','He look happy.','He is look happy.'],1,'look এখানে linking verb; তাই adjective happy।','R02'],
['Q05','Choose: Dhaka is ___ than Chattogram.',['crowded','more crowded','most crowded','crowdeder'],1,'দীর্ঘ adjective crowded-এর comparative more crowded।','R03'],
['Q06','Which is correct?',['a red beautiful car','a beautiful red car','a car beautiful red','a red car beautiful'],1,'Opinion beautiful সাধারণত colour red-এর আগে।','R09'],
['Q07','The film was so ___. I felt ___.',['bored, boring','boring, bored','bored, bored','boring, boring'],1,'Film অনুভূতি তৈরি করে (boring), viewer অনুভব করে (bored)।','R10'],
['Q08','Choose the natural expression—',['absolutely hot','very hot','completely hot','totally hot'],1,'hot gradable; very hot স্বাভাবিক।','R11'],
['Q09','The comparative of “bad” is—',['badder','worst','worse','more bad'],2,'bad-এর irregular comparative worse।','R07'],
['Q10','There are ___ errors in this draft.',['less','little','fewer','fewest'],2,'errors countable plural; তাই fewer।','R12'],
['Q11','Which sentence shows equality?',['He is taller than me.','He is as tall as me.','He is the tallest.','He is less tall.'],1,'as + positive + as সমতা বোঝায়।','R08'],
['Q12','Choose the correct spelling—',['biggest','bigest','biggestest','more biggest'],0,'CVC pattern-এ শেষ consonant double: big→biggest।','R05']];

function buildQuestionBank(){
 const bank=[];
 const forms=[['good','better','best'],['bad','worse','worst'],['happy','happier','happiest'],['big','bigger','biggest'],['hot','hotter','hottest'],['easy','easier','easiest'],['important','more important','most important'],['beautiful','more beautiful','most beautiful'],['careful','more careful','most careful'],['far','farther','farthest']];
 const contexts=['The admission test was','This route is','Her explanation is','The second plan looks','Our final revision is','The library is'];
 forms.forEach((f,k)=>{for(let i=0;i<15;i++){let mode=i%3, stem, options, answer;
  if(mode===0){stem=`Choose the correct ${f[1].includes('more')?'comparative':'comparative'} form: ${contexts[i%contexts.length]} ___ than the previous one.`; options=[f[0],f[1],f[2],`more ${f[1]}`]; answer=1;}
  else if(mode===1){stem=`Choose the correct superlative: This is ___ example in the set.`; options=[f[0],f[1],`the ${f[2]}`,`the most ${f[2]}`]; answer=2;}
  else {stem=`Which sequence is correct for “${f[0]}”?`; options=[`${f[0]} – ${f[1]} – ${f[2]}`,`${f[0]} – more ${f[0]} – most ${f[0]}`,`${f[1]} – ${f[0]} – ${f[2]}`,`${f[0]} – ${f[2]} – ${f[1]}`]; answer=0;}
  bank.push({id:'MODEL-'+String(bank.length+1).padStart(3,'0'),stem,options,answer,explanation:`${f[0]}-এর সঠিক comparison pattern হলো ${f[0]} → ${f[1]} → ${f[2]}। Context অনুযায়ী degree নির্বাচন করতে হবে।`,rule:'R03'});
 }});
 return bank;
}
const modelBank=buildQuestionBank();
const qs=baseQs.concat(modelBank.map(q=>[q.id,q.stem,q.options,q.answer,q.explanation,q.rule]));
const state=JSON.parse(localStorage.adjLab||'{}'); state.done=state.done||[];state.wrong=state.wrong||[];state.attempts=state.attempts||0;state.correct=state.correct||0;function save(){localStorage.adjLab=JSON.stringify(state)}
function go(id,el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active'); if(id==='dashboard')dashboard();if(id==='lessons')lessonsView();if(id==='rules')rulesView();if(id==='traps')trapsView();if(['practice','mock','mistakes'].includes(id))quizView(id);if(id==='revision')revision();if(id==='sources')sources();scrollTo(0,0);}
function dashboard(){app.innerHTML=`<section class="hero"><div class="eyebrow">PREMIUM ADMISSION COURSE · 01</div><h1>Adjectives<br><span style="color:#aeb1ff">basic to advanced</span></h1><p>বিশেষণের পুরো ecosystem—concept, comparison, adjective order, traps এবং timed practice। English admission ও competitive exam-এর জন্য বানানো একটি focused learning lab.</p><button class="cta" onclick="go('lessons',document.querySelectorAll('.nav')[1])">শেখা শুরু করুন →</button></section><div class="stats"><div class="stat"><b>${lessons.length}</b><small>Structured lessons</small></div><div class="stat"><b>${rules.length}</b><small>High-yield rules</small></div><div class="stat"><b>${qs.length}</b><small>Curated practice</small></div><div class="stat"><b>${state.correct}/${state.attempts||0}</b><small>Score history</small></div></div><section class="card"><h2 style="margin-top:0">তোমার learning pulse</h2><div class="progress"><i style="width:${Math.round(state.done.length/lessons.length*100)}%"></i></div><p class="muted">${state.done.length} / ${lessons.length} lesson complete · ${state.wrong.length} mistake saved</p><div class="grid"><div><span class="tag">HIGH PRIORITY</span><h3>Comparison & degree</h3><p class="muted">-er/-est, more/most, irregular forms—admission-এ বারবার আসে।</p></div><div><span class="tag gold">TRAP ZONE</span><h3>-ed বনাম -ing</h3><p class="muted">কে অনুভব করছে আর কী অনুভূতি তৈরি করছে—এই scan-টি মনে রাখো।</p></div><div><span class="tag">QUICK WIN</span><h3>১০ সেকেন্ড scan</h3><p class="muted">Noun/linking verb খুঁজে position, degree ও modifier যাচাই করো।</p></div></div></section><h2>আজকের route</h2><div class="grid"><div class="card lesson"><div class="num">01</div><div><h3>Foundation scan</h3><p class="muted">Adjective-এর function এবং position বুঝে নাও।</p><button class="pill" onclick="go('lessons',document.querySelectorAll('.nav')[1])">Open lesson</button></div></div><div class="card lesson"><div class="num">02</div><div><h3>Practice arena</h3><p class="muted">Immediate feedback-সহ curated MCQ।</p><button class="pill" onclick="go('practice',document.querySelectorAll('.nav')[4])">Take practice</button></div></div><div class="card lesson"><div class="num">03</div><div><h3>Last-minute sheet</h3><p class="muted">Exam hall-এর ৫ মিনিটের revision।</p><button class="pill" onclick="go('revision',document.querySelectorAll('.nav')[7])">Revise</button></div></div></div>`}
function lessonsView(){app.innerHTML='<h2>Lesson map</h2><p class="muted">Basic থেকে advanced—প্রতিটি lesson-এ concept, rule, example এবং completion tracking আছে।</p><div class="grid">'+lessons.map((l,i)=>`<article class="card lesson"><div class="num">${String(i+1).padStart(2,'0')}</div><div><span class="tag">${l[2]}</span><h3>${l[1]}</h3><p class="bn">${l[3]}</p><button class="pill" onclick="lessonDetail(${i})">${state.done.includes(i)?'✓ Completed':'Study lesson'}</button></div></article>`).join('')+'</div>'}
function lessonDetail(i){let l=lessons[i],r=rules[i%rules.length];app.innerHTML=`<button class="pill" onclick="lessonsView()">← Lesson map</button><h2>${l[1]}</h2><p class="muted">${l[2]} · 15–20 মিনিট</p><div class="card"><span class="tag">সহজ কথা</span><p class="bn">${l[3]} ${i===3?'Comparative দুইটির তুলনা করে; superlative group-এর highest/lowest বোঝায়।':i===7?'সব adjective-এর order একেবারে fixed নয়; এটি common tendency—তাই meaning ও natural usage-ও বিবেচ্য।':''}</p><div class="rule"><b>মূল নিয়ম: ${r[1]}</b><br>${r[2]}</div><div class="example"><b>Example</b><br><span class="right">${i===3?'Rina is taller than Mina. Rina is the tallest in her team.':'She bought a beautiful red leather bag.'}</span><br><span class="wrong">ভুল: ${i===3?'Rina is more taller than Mina.':'She looks happily.'}</span></div><h3 style="margin-top:20px">কীভাবে চিনবে</h3><p>১. বাক্যে noun বা pronoun খুঁজে বের করো। ২. কোন word তার গুণ/পরিমাণ/পরিচয় বলছে দেখো। ৩. comparison থাকলে than / the / as…as signal খুঁজে নাও। ৪. শেষে collocation ও spelling যাচাই করো।</p><span class="tag gold">Exam trap</span><p>Double comparative, adjective-এর জায়গায় adverb, এবং absolute adjective-এর সঙ্গে ভুল modifier—তিনটি জায়গায় সাবধান।</p></div><button class="cta" onclick="state.done.includes(${i})||state.done.push(${i});save();lessonsView()">${state.done.includes(i)?'Completed ✓':'Mark lesson complete'}</button>`}
function rulesView(){app.innerHTML='<h2>Rule cards</h2><p class="muted">প্রতিটি card খুলে rule + why + exam scan একসঙ্গে revise করো।</p><div class="grid">'+rules.map((r,i)=>`<details class="card"><summary><b>${r[0]} · ${r[1]}</b></summary><p>${r[2]}</p><div class="example">${r[3]}</div></details>`).join('')+'</div>'}
function trapsView(){app.innerHTML='<h2>Trap clinic</h2><p class="muted">ভুলের ধরন দেখলেই rule-এ ফিরো—শুধু answer মুখস্থ নয়।</p><div class="grid">'+[['Double comparative','more taller / most easiest নয়; taller / easiest ব্যবহার করো।'],['Than বনাম as','Comparative-এর পরে than; equality-তে as…as।'],['Bored বনাম boring','I am bored; the lecture is boring।'],['Very বনাম absolutely','very + gradable, absolutely + extreme/non-gradable।'],['Fewer বনাম less','fewer books, less information।'],['Order of adjectives','a lovely small old brown wooden box—common order মনে রাখো।']].map(x=>`<article class="card"><span class="tag gold">⚠ TRAP</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('')+'</div>'}
let qi=0,mode='practice',answered=false;function quizView(m){mode=m;qi=0;answered=false;let data=m==='mistakes'?qs.filter((q)=>state.wrong.includes(q[0])):qs; if(!data.length){app.innerHTML='<div class="card"><h2>Mistake Bank empty 🎉</h2><p>Practice-এ ভুল হওয়া প্রশ্নগুলো এখানে ফিরে আসবে।</p></div>';return}renderQ(data)}function renderQ(data){let q=data[qi%data.length];app.innerHTML=`<div class="quiz"><div class="qhead"><div><span class="tag">${mode==='mock'?'TIMED MOCK':'PRACTICE'}</span><h2>${mode==='mock'?'Mock Test':'Practice Arena'}</h2></div><b>${(qi%data.length)+1} / ${data.length}</b></div><div class="progress"><i style="width:${((qi%data.length)/data.length)*100}%"></i></div><article class="card" style="margin-top:18px"><span class="muted">${q[0]} · Original practice · ${q[6]}</span><h3 style="font-size:21px;margin-top:15px">${q[1]}</h3><div class="options">${q[2].map((o,i)=>`<button class="opt" onclick="answer(${i},${q[3]},'${q[0]}',${JSON.stringify(q[4])},${JSON.stringify(q[5])},this)">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div id="feedback"></div></article><div class="toolbar"><button class="pill" onclick="quizView('${mode}')">Reset</button><button class="cta" onclick="nextQ()">Next question →</button></div><p class="source">Question status: Original Practice. No item is presented as an official previous-year question. Related rule: ${q[6]}.</p></div>`;window.currentData=data}function answer(i,correct,id,exp,rule,btn){if(answered)return;answered=true;state.attempts++;let ok=i===correct;if(ok)state.correct++;else if(!state.wrong.includes(id))state.wrong.push(id);save();document.querySelectorAll('.opt')[correct].classList.add('correct');if(!ok)btn.classList.add('wrong');feedback.innerHTML=`<div class="feedback"><b>${ok?'✓ Correct!':'✗ Not quite.'}</b><p>${exp}</p><small>Elimination tip: ${rule}—অন্য option-গুলো এই pattern-এর সঙ্গে মেলে না।</small></div>`}function nextQ(){qi++;answered=false;renderQ(window.currentData||qs)}
function revision(){app.innerHTML=`<h2>Last-minute master sheet</h2><p class="muted">৫–১০ মিনিটে high-value revision।</p><div class="grid">${rules.slice(2,10).map(r=>`<div class="card"><span class="tag">${r[0]}</span><h3>${r[1]}</h3><p>${r[2]}</p></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Exam-hall scan</h3><p>① noun/linking verb শনাক্ত ② adjective-এর position দেখো ③ degree signal: than / the / as…as ④ spelling: y→i, CVC doubling ⑤ irregular list ⑥ meaning: -ed না -ing ⑦ modifier: very না absolutely।</p></div>`}
